<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب | WE Packages</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Tahoma,sans-serif;

    background:
        radial-gradient(
            circle at 100% 0%,
            #a06cf0 0%,
            transparent 38%
        ),
        linear-gradient(
            135deg,
            #f1eff9,
            #ded5f0,
            #d1c5e8
        );

    color:#19182d;
}

.container{
    width:92%;
    max-width:650px;
    margin:auto;
    padding:35px 0 70px;
}

.card{
    background:rgba(255,255,255,.75);

    border:1px solid rgba(255,255,255,.85);

    border-radius:30px;

    padding:30px 24px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 50px
        rgba(60,35,120,.14);
}

.logo{
    text-align:center;

    font-size:42px;

    margin-bottom:8px;
}

.title{
    text-align:center;

    color:#5420b8;

    font-size:30px;

    font-weight:900;

    margin-bottom:8px;
}

.subtitle{
    text-align:center;

    color:#6d6d80;

    margin-bottom:28px;

    line-height:1.7;
}


/* =========================
   PACKAGE
========================= */

.package-summary{
    padding:22px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #5420b8,
            #9747ff
        );

    color:#fff;

    text-align:center;

    margin-bottom:25px;

    box-shadow:
        0 12px 30px
        rgba(84,32,184,.2);
}

.package-summary h2{
    margin:0 0 10px;

    font-size:26px;
}

.package-summary .gb{
    font-size:42px;

    font-weight:900;
}

.package-summary .price{
    font-size:27px;

    font-weight:bold;

    margin-top:8px;
}


/* =========================
   PROMO
========================= */

.promo-box{

    margin-bottom:25px;

    padding:20px;

    border-radius:22px;

    background:#f7f3ff;

    border:1px solid
        rgba(84,32,184,.12);

}

.promo-title{

    text-align:center;

    color:#5420b8;

    font-size:22px;

    font-weight:900;

    margin-bottom:15px;

}

.promo-row{

    display:flex;

    gap:10px;

}

.promo-input{

    flex:1;

    width:100%;

    min-width:0;

    padding:16px;

    border:1px solid #ddd;

    border-radius:15px;

    outline:none;

    font-size:17px;

    text-align:center;

    background:#fff;

}

.promo-input:focus{

    border-color:#7544cf;

    box-shadow:
        0 0 0 3px
        rgba(117,68,207,.12);

}

.promo-button{

    border:0;

    border-radius:15px;

    padding:0 20px;

    background:
        linear-gradient(
            135deg,
            #5420b8,
            #9747ff
        );

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    white-space:nowrap;

}

.promo-button:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.promo-message{

    min-height:24px;

    margin-top:12px;

    text-align:center;

    font-weight:bold;

    line-height:1.6;

}

.price-details{

    display:none;

    margin-top:15px;

    padding:15px;

    border-radius:15px;

    background:#fff;

    text-align:center;

    line-height:2;

}

.price-details .old{

    color:#777;

}

.price-details .discount{

    color:#08752d;

}

.price-details .final{

    color:#5420b8;

    font-size:21px;

    font-weight:900;

}


/* =========================
   FORM
========================= */

.label{

    display:block;

    margin-bottom:9px;

    font-weight:bold;

    color:#353448;

    font-size:18px;

}

input{

    width:100%;

    padding:17px;

    border:1px solid #ddd;

    border-radius:16px;

    outline:none;

    font-size:18px;

    text-align:center;

    background:#fff;

}

input:focus{

    border-color:#7544cf;

    box-shadow:
        0 0 0 3px
        rgba(117,68,207,.12);

}

.hint{

    font-size:13px;

    color:#777;

    margin-top:8px;

    margin-bottom:25px;

    text-align:center;

}


/* =========================
   BUTTON
========================= */

.submit{

    width:100%;

    padding:17px;

    border:none;

    border-radius:17px;

    cursor:pointer;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #5420b8,
            #9747ff
        );

    font-size:19px;

    font-weight:bold;

    box-shadow:
        0 10px 25px
        rgba(84,32,184,.2);

}

.submit:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* =========================
   ERROR
========================= */

.error{

    display:none;

    margin-bottom:18px;

    padding:13px;

    border-radius:14px;

    text-align:center;

    background:#ffe2e2;

    color:#a00000;

    font-weight:bold;

    word-break:break-word;

}


/* =========================
   SUCCESS
========================= */

.success{

    display:none;

    text-align:center;

    padding:20px;

}

.success-icon{

    font-size:55px;

    margin-bottom:10px;

}

.success h2{

    color:#5420b8;

    margin-bottom:10px;

}

.order-number{

    display:inline-block;

    margin-top:12px;

    padding:10px 18px;

    border-radius:50px;

    background:#eee6ff;

    color:#5420b8;

    font-weight:bold;

}


/* =========================
   BACK
========================= */

.back{

    display:block;

    text-align:center;

    margin-top:22px;

    color:#5420b8;

    text-decoration:none;

    font-weight:bold;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .promo-row{

        flex-direction:column;

    }

    .promo-button{

        padding:15px;

    }

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<div class="logo">
📦
</div>


<div class="title">
إتمام الطلب
</div>


<div class="subtitle">
أدخل بيانات المشترك لإتمام الطلب
</div>


<!-- =========================
     PACKAGE SUMMARY
========================= -->

<div class="package-summary">

<h2 id="packageName">
جاري تحميل الباقة...
</h2>


<div
class="gb"
id="packageGB"
>
--
</div>


<div
class="price"
id="packagePrice"
>
--
</div>

</div>


<!-- =========================
     PROMO CODE
========================= -->

<div
class="promo-box"
>

<div class="promo-title">
🎁 عندك كود خصم؟
</div>


<div class="promo-row">


<input
type="text"
id="promoInput"
class="promo-input"
placeholder="اكتب كود الخصم"
autocomplete="off"
>


<button
type="button"
id="promoButton"
class="promo-button"
onclick="applyPromo()"
>
تطبيق الكود
</button>


</div>


<div
id="promoMessage"
class="promo-message"
></div>


<div
id="priceDetails"
class="price-details"
>


<div class="old">

السعر قبل الخصم:

<strong
id="originalPriceDisplay"
>
0
</strong>

جنيه

</div>


<div class="discount">

قيمة الخصم:

<strong
id="discountDisplay"
>
0
</strong>

جنيه

</div>


<div class="final">

السعر النهائي:

<strong
id="finalPriceDisplay"
>
0
</strong>

جنيه

</div>


</div>

</div>


<!-- =========================
     ERROR
========================= -->

<div
class="error"
id="errorMessage"
></div>


<!-- =========================
     ORDER FORM
========================= -->

<div id="orderForm">


<label class="label">
👤 اسم المشترك
</label>


<input
type="text"
id="subscriberName"
placeholder="اكتب اسم المشترك"
autocomplete="name"
>


<div class="hint">
الاسم الذي سيتم تسجيل الطلب به
</div>


<label class="label">
📱 رقم التليفون
</label>


<input
type="tel"
id="phone"
inputmode="numeric"
maxlength="11"
placeholder="01xxxxxxxxx"
autocomplete="tel"
>


<div class="hint">
الرقم الذي سيتم تفعيل الباقة عليه
</div>


<button
class="submit"
id="submitButton"
onclick="submitOrder()"
>
متابعة للدفع
</button>


</div>


<!-- =========================
     SUCCESS
========================= -->

<div
class="success"
id="successBox"
>


<div class="success-icon">
✅
</div>


<h2>
جاري تحويلك للدفع
</h2>


<p>
لحظة واحدة...
</p>


<div
class="order-number"
id="orderNumber"
></div>


</div>


<a
href="packages.html"
class="back"
>
← العودة إلى الباقات
</a>


</div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";


const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbQ_wZkoJGrY";


/* =====================================================
   URL DATA
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


const packageNameFromUrl =
params.get("package") || "";


const gbFromUrl =
Number(
params.get("gb")
);


const price =
Number(
params.get("price")
);


const orderType =
params.get("type") || "";


const customerId =
params.get("customer_id") || "";


const customerPhone =
params.get("phone") || "";


const customerName =
params.get("name") || "";


const promoFromUrl =
params.get("promo") || "";


/* =====================================================
   PACKAGE VALUES
===================================================== */

const packageGB =
gbFromUrl ||
parseInt(
packageNameFromUrl
) ||
0;


const originalPrice =
Number(price) || 0;


let finalPrice =
originalPrice;


let appliedPromo =
null;


/* =====================================================
   DISPLAY PACKAGE
===================================================== */

if(
!packageNameFromUrl ||
!originalPrice
){

document.getElementById(
"packageName"
).textContent =
"لم يتم اختيار باقة";


document.getElementById(
"packageGB"
).textContent =
"";


document.getElementById(
"packagePrice"
).textContent =
"";

}
else{

document.getElementById(
"packageName"
).textContent =
packageNameFromUrl;


document.getElementById(
"packageGB"
).textContent =
packageGB +
" GB";


document.getElementById(
"packagePrice"
).textContent =
originalPrice +
" جنيه";

}


/* =====================================================
   CURRENT CUSTOMER
===================================================== */

if(
orderType ===
"renewal"
){

if(customerName){

document.getElementById(
"subscriberName"
).value =
customerName;

}


if(customerPhone){

document.getElementById(
"phone"
).value =
customerPhone;

}

}


/* =====================================================
   PHONE
===================================================== */

function validPhone(phone){

return /^01[0125][0-9]{8}$/.test(
phone
);

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

const box =
document.getElementById(
"errorMessage"
);


box.textContent =
text;


box.style.display =
"block";

}


/* =====================================================
   ORDER NUMBER
===================================================== */

function createOrderNumber(){

const random =
Math.floor(
1000 +
Math.random() *
9000
);


return(
"WE-" +
Date.now()
.toString()
.slice(-6) +
"-" +
random
);

}


/* =====================================================
   PROMO MESSAGE
===================================================== */

function promoMessage(
text,
color
){

const box =
document.getElementById(
"promoMessage"
);


box.textContent =
text;


box.style.color =
color;

}


/* =====================================================
   UPDATE PRICE
===================================================== */

function updatePromoPrice(){

const details =
document.getElementById(
"priceDetails"
);


const packagePrice =
document.getElementById(
"packagePrice"
);


document.getElementById(
"originalPriceDisplay"
).textContent =
originalPrice;


document.getElementById(
"finalPriceDisplay"
).textContent =
finalPrice;


if(appliedPromo){

const discount =
Math.max(
0,
originalPrice -
finalPrice
);


document.getElementById(
"discountDisplay"
).textContent =
discount;


details.style.display =
"block";


packagePrice.innerHTML =

'<span style="' +
'text-decoration:line-through;' +
'opacity:.6;font-size:18px;">' +

originalPrice +

' جنيه</span> ' +

finalPrice +

' جنيه';

}
else{

details.style.display =
"none";


packagePrice.textContent =
originalPrice +
" جنيه";

}

}


/* =====================================================
   CHECK PROMO DIRECTLY
   لا يوجد RPC هنا
===================================================== */

async function getPromoCode(code){

const url =

SUPABASE_URL +

"/rest/v1/promo_codes" +

"?select=*" +

"&code=eq." +

encodeURIComponent(code) +

"&limit=1";


const response =
await fetch(
url,
{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json"

}

}
);


const text =
await response.text();


let data =
null;


try{

data =
text
?
JSON.parse(text)
:
null;

}
catch(e){

data =
null;

}


if(
!response.ok
){

let message =
text;


if(
data &&
typeof data ===
"object"
){

message =
data.message ||
data.details ||
data.hint ||
data.error ||
text;

}


throw new Error(
message ||
"تعذر قراءة كود الخصم"
);

}


return Array.isArray(data)
?
data[0] || null
:
null;

}


/* =====================================================
   VALIDATE PROMO
===================================================== */

function validatePromoRow(row){

if(!row){

return{
valid:false,
message:
"❌ كود الخصم غير موجود"
};

}


if(
row.is_active !== true
){

return{
valid:false,
message:
"❌ كود الخصم متوقف"
};

}


const used =
Number(
row.used_count
) || 0;


const maxUses =
Number(
row.max_uses
) || 0;


if(
maxUses > 0 &&
used >= maxUses
){

return{
valid:false,
message:
"❌ انتهت كل استخدامات الكود"
};

}


if(
row.expires_at
){

const expiry =
new Date(
row.expires_at
);


if(
expiry <= new Date()
){

return{
valid:false,
message:
"❌ انتهت صلاحية كود الخصم"
};

}

}


const discountValue =
Number(
row.discount_value
) || 0;


if(
discountValue <= 0
){

return{
valid:false,
message:
"❌ قيمة الخصم غير صحيحة"
};

}


if(
row.discount_type !==
"percent" &&
row.discount_type !==
"fixed"
){

return{
valid:false,
message:
"❌ نوع الخصم غير صحيح"
};

}


return{
valid:true
};

}


/* =====================================================
   CALCULATE DISCOUNT
===================================================== */

function calculateDiscount(
row
){

let discount =
0;


const value =
Number(
row.discount_value
) || 0;


if(
row.discount_type ===
"percent"
){

discount =
originalPrice *
value /
100;

}
else if(
row.discount_type ===
"fixed"
){

discount =
value;

}


discount =
Math.max(
0,
Math.min(
discount,
originalPrice
)
);


return Math.round(
discount
);

}


/* =====================================================
   APPLY PROMO
   مهم:
   هنا لا يتم تعديل used_count
===================================================== */

async function applyPromo(){

const input =
document.getElementById(
"promoInput"
);


const button =
document.getElementById(
"promoButton"
);


const code =
input.value
.trim()
.toUpperCase();


if(!code){

appliedPromo =
null;


finalPrice =
originalPrice;


updatePromoPrice();


promoMessage(
"⚠️ اكتب كود الخصم أولاً",
"#a00000"
);


return;

}


button.disabled =
true;


button.textContent =
"⏳ جاري التحقق";


promoMessage(
"⏳ جاري التحقق من الكود...",
"#5420b8"
);


try{

const row =
await getPromoCode(
code
);


const validation =
validatePromoRow(
row
);


if(
!validation.valid
){

appliedPromo =
null;


finalPrice =
originalPrice;


updatePromoPrice();


promoMessage(
validation.message,
"#a00000"
);


return;

}


/* =========================
   APPLY ONLY
   لا نغير used_count
========================= */

const discount =
calculateDiscount(
row
);


finalPrice =
Math.max(
0,
originalPrice -
discount
);


appliedPromo = {

code:
String(
row.code
)
.toUpperCase(),

discount_type:
row.discount_type,

discount_value:
Number(
row.discount_value
),

id:
row.id

};


updatePromoPrice();


promoMessage(
"✅ تم تطبيق كود الخصم بنجاح",
"#08752d"
);


}
catch(error){

console.error(
"PROMO CHECK ERROR:",
error
);


appliedPromo =
null;


finalPrice =
originalPrice;


updatePromoPrice();


promoMessage(
"❌ تعذر التحقق من كود الخصم: " +
error.message,
"#a00000"
);

}
finally{

button.disabled =
false;


button.textContent =
"تطبيق الكود";

}

}


/* =====================================================
   APPLY CODE FROM URL
===================================================== */

if(
promoFromUrl
){

document.getElementById(
"promoInput"
).value =
promoFromUrl;


applyPromo();

}


/* =====================================================
   ENTER PROMO
===================================================== */

document
.getElementById(
"promoInput"
)
.addEventListener(
"keydown",
function(event){

if(
event.key ===
"Enter"
){

event.preventDefault();

applyPromo();

}

}
);


/* =====================================================
   RECHECK PROMO BEFORE ORDER
   يمنع استخدام كود انتهت استخداماته
   أثناء وجود العميل في الصفحة
===================================================== */

async function recheckPromoBeforeSubmit(){

if(
!appliedPromo
){

return true;

}


const code =
appliedPromo.code;


const row =
await getPromoCode(
code
);


const validation =
validatePromoRow(
row
);


if(
!validation.valid
){

appliedPromo =
null;


finalPrice =
originalPrice;


updatePromoPrice();


promoMessage(
validation.message,
"#a00000"
);


return false;

}


/* =========================
   إعادة الحساب من قاعدة البيانات
========================= */

const discount =
calculateDiscount(
row
);


finalPrice =
Math.max(
0,
originalPrice -
discount
);


appliedPromo = {

code:
String(
row.code
)
.toUpperCase(),

discount_type:
row.discount_type,

discount_value:
Number(
row.discount_value
),

id:
row.id

};


updatePromoPrice();


return true;

}


/* =====================================================
   SUBMIT ORDER
===================================================== */

async function submitOrder(){

const subscriberName =
document.getElementById(
"subscriberName"
)
.value
.trim();


const phone =
document.getElementById(
"phone"
)
.value
.trim();


const button =
document.getElementById(
"submitButton"
);


const errorBox =
document.getElementById(
"errorMessage"
);


errorBox.style.display =
"none";


/* =========================
   NAME
========================= */

if(
!subscriberName
){

showError(
"❌ اكتب اسم المشترك أولاً"
);

return;

}


/* =========================
   PHONE
========================= */

if(
!validPhone(phone)
){

showError(
"❌ اكتب رقم تليفون مصري صحيح"
);

return;

}


/* =========================
   PACKAGE
========================= */

if(
!packageNameFromUrl ||
!originalPrice ||
Number.isNaN(
originalPrice
)
){

showError(
"❌ بيانات الباقة غير صحيحة"
);

return;

}


/* =========================
   RECHECK PROMO
========================= */

if(
appliedPromo
){

button.disabled =
true;


button.textContent =
"⏳ جاري التحقق من الخصم...";


try{

const promoStillValid =
await recheckPromoBeforeSubmit();


if(
!promoStillValid
){

button.disabled =
false;


button.textContent =
"متابعة للدفع";


return;

}

}
catch(error){

console.error(
"PROMO RECHECK ERROR:",
error
);


showError(
"❌ تعذر إعادة التحقق من كود الخصم:\n" +
error.message
);


button.disabled =
false;


button.textContent =
"متابعة للدفع";


return;

}

}


/* =========================
   BUTTON
========================= */

button.disabled =
true;


button.textContent =
"⏳ جاري تجهيز الطلب...";


/* =========================
   ORDER NUMBER
========================= */

const orderNumber =
createOrderNumber();


/* =================================================
   ORDER DATA
================================================= */

const orderData = {

subscriber_name:
subscriberName,

order_number:
orderNumber,

phone:
phone,

package_name:
"باقة " +
packageGB +
" جيجا",

package_gb:
Number(
packageGB
),

original_price:
Number(
originalPrice
),

final_price:
Number(
finalPrice
),

promo_code:
appliedPromo
?
appliedPromo.code
:
"",

payment_method:
"لم يتم التحويل بعد",

status:
"pending"

};


/* =================================================
   SEND ORDER
================================================= */

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/orders",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:

)

);

response.status
);

);

){

);

json.details ||
json.hint ||
json.error ||

}
catch(e){

}


showError(
"❌ خطأ قاعدة البيانات:\n" +
message
);

false;


button.textContent =
"متابعة للدفع";

"orderForm"

);

).style.display =

).textContent =
"رقم الطلب: " +
orderNumber;
