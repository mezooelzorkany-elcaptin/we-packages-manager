<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>إتمام الطلب | CASH BACK</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Tahoma,sans-serif;color:#19182d;background:radial-gradient(circle at 100% 0%,#a06cf0 0%,transparent 38%),linear-gradient(135deg,#f1eff9,#ded5f0,#d1c5e8)}.container{width:92%;max-width:650px;margin:auto;padding:25px 0 60px}.card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:30px;padding:25px 20px 30px;backdrop-filter:blur(20px);box-shadow:0 20px 50px rgba(60,35,120,.14)}.logo{width:92px;height:92px;margin:0 auto 12px;background:#fff;border-radius:25px;padding:8px;box-shadow:0 10px 30px #0002}.logo img{width:100%;height:100%;object-fit:contain;border-radius:18px}.title{text-align:center;color:#5420b8;font-size:30px;font-weight:900}.subtitle{text-align:center;color:#707080;margin:7px 0 22px;line-height:1.7}.customer-type{text-align:center;padding:13px;border-radius:17px;margin-bottom:18px;font-weight:900;font-size:17px}.new{background:#eee5ff;color:#5420b8}.renewal{background:#e3f8eb;color:#08752d}.summary{padding:23px 18px;border-radius:25px;color:#fff;text-align:center;margin-bottom:20px;background:linear-gradient(135deg,#5420b8,#9747ff);box-shadow:0 15px 35px #5420b833}.summary h2{margin:0 0 8px;font-size:27px}.gb{font-size:40px;font-weight:900}.price{font-size:30px;font-weight:900;margin-top:6px}.old{font-size:18px;text-decoration:line-through;opacity:.65;margin-left:7px}.discount{font-size:15px;color:#eaffef;margin-top:3px}.box{padding:20px;border-radius:23px;background:rgba(255,255,255,.62);border:1px solid #5420b826;margin-bottom:18px}.label{display:block;font-size:18px;font-weight:bold;margin:12px 0 8px;color:#353448}input{width:100%;padding:16px;border:1px solid #ddd;border-radius:16px;background:#fff;outline:none;font-size:18px;text-align:center}.promo button,.submit{width:100%;border:0;border-radius:17px;background:linear-gradient(135deg,#5420b8,#9747ff);color:#fff;font-size:18px;font-weight:900;cursor:pointer}.promo button{padding:16px;margin-top:10px}.promo-msg{text-align:center;margin-top:10px;font-weight:bold;line-height:1.7}.hint{text-align:center;color:#777;font-size:13px;margin:7px 0 18px}.submit{padding:18px;margin-top:5px;box-shadow:0 10px 25px #5420b833}.submit:disabled,.promo button:disabled{opacity:.6}.error{display:none;background:#ffe1e1;color:#a00000;border-radius:15px;padding:13px;text-align:center;font-weight:bold;margin-bottom:15px;line-height:1.6}.success{display:none;text-align:center;padding:25px}.success-icon{font-size:60px}.success h2{color:#5420b8}.order{display:inline-block;background:#eee5ff;color:#5420b8;padding:10px 18px;border-radius:50px;font-weight:bold;direction:ltr}.back{display:block;text-align:center;margin-top:20px;color:#5420b8;font-weight:bold;text-decoration:none}@media(max-width:550px){.container{width:94%;padding-top:15px}.card{padding:22px 15px}.title{font-size:27px}.gb{font-size:36px}}
</style></head>
<body><div class="container"><div class="card">
<div class="logo"><img src="logo.png" alt="CASH BACK"></div><div class="title">إتمام الطلب</div><div class="subtitle">السعر الظاهر هنا محسوب مباشرة من النظام</div><div id="customerType" class="customer-type"></div>
<div class="summary"><h2 id="packageName">جاري التحقق...</h2><div id="packageGB" class="gb">--</div><div id="packagePrice" class="price">--</div></div><div id="errorMessage" class="error"></div>
<div id="orderForm"><div class="box promo"><div class="label" style="text-align:center;color:#5420b8">🎁 عندك كود خصم؟</div><input id="promoInput" type="text" placeholder="اكتب كود الخصم" autocomplete="off"><button id="applyPromoButton" type="button" onclick="applyPromoCode()">تطبيق الكود</button><div id="promoMessage" class="promo-msg"></div></div>
<div class="box"><label class="label">👤 اسم المشترك</label><input id="subscriberName" type="text" placeholder="اكتب اسم المشترك" autocomplete="name"><div class="hint">الاسم الذي سيتم تسجيل الطلب به</div><label class="label">📱 رقم التليفون</label><input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="01xxxxxxxxx" autocomplete="tel"><div class="hint">الرقم الذي سيتم تفعيل الباقة عليه</div><button id="submitButton" class="submit" type="button" onclick="submitOrder()">متابعة للدفع</button></div></div>
<div id="successBox" class="success"><div class="success-icon">✅</div><h2>تم إنشاء الطلب بنجاح</h2><p>جاري تحويلك لصفحة الدفع...</p><div id="orderNumber" class="order"></div></div><a href="packages.html" class="back">← العودة إلى الباقات</a>
</div></div>
<script>
const SUPABASE_URL='https://pgvbynefhqmyzjtccttl.supabase.co',SUPABASE_KEY='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';
const params=new URLSearchParams(location.search),orderType=(params.get('type')||'new').toLowerCase(),packageGB=String(params.get('gb')||params.get('package')||'').replace('جيجا','').trim(),urlName=params.get('name')||'',urlPhone=params.get('phone')||'',promoFromUrl=(params.get('promo')||'').trim().toUpperCase();
let activePromo=promoFromUrl||null;let pricing=null;const $=id=>document.getElementById(id);
function money(v){return Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:0})}function showError(t){$('errorMessage').textContent=t;$('errorMessage').style.display='block';scrollTo({top:0,behavior:'smooth'})}function clearError(){$('errorMessage').style.display='none'}function validPhone(p){return /^01[0125][0-9]{8}$/.test(p)}
async function rpc(path,body){const r=await fetch(SUPABASE_URL+path,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error(data?.message||data?.details||data?.hint||text||'حدث خطأ');return Array.isArray(data)?data[0]:data}
function renderPrice(){if(!pricing)return;$('packagePrice').innerHTML=(Number(pricing.discount_amount)>0?'<span class="old">'+money(pricing.original_price)+' جنيه</span>':'')+money(pricing.final_price)+' جنيه'+(Number(pricing.discount_amount)>0?'<div class="discount">🎁 خصم '+money(pricing.discount_amount)+' جنيه</div>':'')}
async function loadPrice(code){pricing=await rpc('/rest/v1/rpc/get_public_price',{p_package_gb:Number(packageGB),p_promo_code:code||null});renderPrice()}
async function applyPromoCode(){const code=$('promoInput').value.trim().toUpperCase();if(!code){$('promoMessage').textContent='❌ اكتب كود الخصم أولاً';return}const b=$('applyPromoButton');b.disabled=true;b.textContent='⏳ جاري التحقق...';try{const result=await rpc('/rest/v1/rpc/check_promo_code',{input_code:code});if(!result||result.valid!==true)throw new Error(result?.message||'كود الخصم غير صحيح أو منتهي');await loadPrice(code);activePromo=code;$('promoMessage').textContent='✅ تم تطبيق الكود وحساب السعر من السيرفر.'}catch(e){activePromo=null;$('promoMessage').textContent='❌ '+e.message;await loadPrice(null).catch(()=>{})}finally{b.disabled=false;b.textContent='تطبيق الكود'}}
async function submitOrder(){clearError();const name=$('subscriberName').value.trim(),phone=$('phone').value.trim();if(name.length<2)return showError('❌ اكتب اسم المشترك أولاً');if(!validPhone(phone))return showError('❌ اكتب رقم تليفون مصري صحيح');if(!/^(20|25|30|35|40|45|50|55|60)$/.test(packageGB))return showError('❌ الباقة غير متاحة');const b=$('submitButton');b.disabled=true;b.textContent='⏳ جاري تجهيز الطلب...';try{const result=await rpc('/rest/v1/rpc/create_public_order',{p_order_type:orderType,p_package_gb:Number(packageGB),p_promo_code:activePromo||null,p_subscriber_name:name,p_phone:phone});if(!result?.order_number)throw new Error('لم يتم إنشاء الطلب');$('orderForm').style.display='none';$('successBox').style.display='block';$('orderNumber').textContent=result.order_number;setTimeout(()=>location.href='payment.html?order='+encodeURIComponent(result.order_number),700)}catch(e){showError('❌ لم يتم إنشاء الطلب: '+e.message);b.disabled=false;b.textContent='متابعة للدفع'}}
$('subscriberName').value=urlName;$('phone').value=urlPhone;$('customerType').className='customer-type '+(orderType==='renewal'?'renewal':'new');$('customerType').textContent=orderType==='renewal'?'🔄 عميل حالي — تجديد الباقة':'🆕 عميل جديد — اشتراك جديد';$('packageName').textContent='باقة '+packageGB+' جيجا';$('packageGB').textContent=packageGB+' GB';(async()=>{try{await loadPrice(activePromo);if(activePromo)$('promoInput').value=activePromo}catch(e){showError('❌ تعذر تحميل السعر من النظام: '+e.message)}})();
</script></body></html>
