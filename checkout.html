<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>
إتمام الطلب | WE Packages
</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
    Arial,
    Tahoma,
    sans-serif;

    color:#19182d;

    background:
    radial-gradient(
        circle at 100% 0%,
        #a06cf0 0%,
        transparent 38%
    ),
    linear-gradient(
        135deg,
        #f1eff9,
        #ded5f0,
        #d1c5e8
    );
}

.container{
    width:92%;
    max-width:650px;

    margin:auto;

    padding:
    30px
    0
    70px;
}

.card{
    background:
    rgba(255,255,255,.78);

    border:
    1px solid
    rgba(255,255,255,.9);

    border-radius:30px;

    padding:
    28px 22px;

    backdrop-filter:
    blur(20px);

    -webkit-backdrop-filter:
    blur(20px);

    box-shadow:
    0 20px 50px
    rgba(60,35,120,.14);
}


/* ==============================
   HEADER
============================== */

.logo{
    text-align:center;

    font-size:42px;

    margin-bottom:5px;
}

.title{
    text-align:center;

    color:#5420b8;

    font-size:30px;

    font-weight:900;

    margin-bottom:7px;
}

.subtitle{
    text-align:center;

    color:#707080;

    margin-bottom:24px;

    line-height:1.7;
}


/* ==============================
   CUSTOMER TYPE
============================== */

.customer-type{
    display:block;

    text-align:center;

    padding:13px 15px;

    margin-bottom:20px;

    border-radius:17px;

    font-size:18px;

    font-weight:900;
}

.customer-type.new{
    background:#eee5ff;

    color:#5420b8;
}

.customer-type.renewal{
    background:#e3f8eb;

    color:#08752d;
}


/* ==============================
   PACKAGE
============================== */

.package-summary{

    padding:23px 18px;

    border-radius:25px;

    color:#fff;

    text-align:center;

    margin-bottom:22px;

    background:
    linear-gradient(
        135deg,
        #5420b8,
        #9747ff
    );

    box-shadow:
    0 15px 35px
    rgba(84,32,184,.20);
}

.package-summary h2{
    margin:0 0 9px;

    font-size:27px;
}

.package-summary .gb{
    font-size:41px;

    font-weight:900;

    margin-bottom:5px;
}

.package-summary .price{
    font-size:29px;

    font-weight:900;

    line-height:1.6;
}

.old-price{
    text-decoration:
    line-through;

    opacity:.65;

    font-size:20px;

    margin-left:8px;
}

.discount-line{
    font-size:16px;

    color:#eaffef;

    margin-top:2px;
}


/* ==============================
   ERROR
============================== */

.error{
    display:none;

    padding:15px;

    margin-bottom:20px;

    border-radius:17px;

    background:#ffe1e1;

    color:#a00000;

    text-align:center;

    font-weight:bold;

    line-height:1.6;

    word-break:break-word;
}


/* ==============================
   PROMO
============================== */

.promo{
    padding:22px 18px;

    margin-bottom:25px;

    border-radius:24px;

    background:
    rgba(255,255,255,.62);

    border:
    1px solid
    rgba(84,32,184,.15);
}

.promo-title{

    text-align:center;

    color:#5420b8;

    font-size:25px;

    font-weight:900;

    margin-bottom:15px;
}

.promo-input{

    width:100%;

    height:58px;

    padding:
    0
    15px;

    border:
    1px solid
    #ddd;

    border-radius:17px;

    background:#fff;

    outline:none;

    text-align:center;

    font-size:19px;

    direction:ltr;
}

.promo-input:focus{

    border-color:
    #7544cf;

    box-shadow:
    0 0 0 3px
    rgba(117,68,207,.12);
}

.promo-button{

    width:100%;

    height:58px;

    margin-top:12px;

    border:0;

    border-radius:17px;

    background:
    linear-gradient(
        135deg,
        #5420b8,
        #9747ff
    );

    color:#fff;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;
}

.promo-button:disabled{

    opacity:.6;

    cursor:not-allowed;
}

.promo-message{

    display:none;

    margin-top:13px;

    text-align:center;

    font-weight:bold;

    line-height:1.7;
}

.promo-message.success{

    display:block;

    color:#08752d;
}

.promo-message.error{

    display:block;

    color:#a00000;
}

.promo-message.loading{

    display:block;

    color:#5420b8;
}


/* ==============================
   FORM
============================== */

.label{

    display:block;

    margin-bottom:9px;

    color:#353448;

    font-size:19px;

    font-weight:bold;
}

input:not(.promo-input){

    width:100%;

    padding:17px;

    border:
    1px solid
    #ddd;

    border-radius:17px;

    background:#fff;

    outline:none;

    font-size:18px;

    text-align:center;
}

input:not(.promo-input):focus{

    border-color:
    #7544cf;

    box-shadow:
    0 0 0 3px
    rgba(117,68,207,.12);
}

.hint{

    margin-top:8px;

    margin-bottom:25px;

    color:#777;

    text-align:center;

    font-size:13px;
}


/* ==============================
   SUBMIT
============================== */

.submit{

    width:100%;

    padding:18px;

    border:0;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #5420b8,
        #9747ff
    );

    color:#fff;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 10px 25px
    rgba(84,32,184,.20);
}

.submit:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* ==============================
   SUCCESS
============================== */

.success{

    display:none;

    text-align:center;

    padding:25px 10px;
}

.success-icon{

    font-size:58px;

    margin-bottom:10px;
}

.success h2{

    color:#5420b8;

    margin-bottom:10px;
}

.order-number{

    display:inline-block;

    margin-top:12px;

    padding:
    11px 20px;

    border-radius:50px;

    background:#eee5ff;

    color:#5420b8;

    font-weight:bold;

    direction:ltr;
}


/* ==============================
   BACK
============================== */

.back{

    display:block;

    margin-top:22px;

    text-align:center;

    color:#5420b8;

    text-decoration:none;

    font-weight:bold;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:550px){

    .container{

        width:94%;

        padding-top:18px;
    }

    .card{

        padding:
        24px 17px;
    }

    .title{

        font-size:28px;
    }

    .package-summary .gb{

        font-size:38px;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<div class="logo">
📦
</div>


<div class="title">

</div>

أدخل بيانات المشترك لإتمام الطلب
</div>


<!-- ==============================

============================== -->

<div
id="customerType"
class="customer-type"
></div>


<!-- ==============================

============================== -->

<div class="package-summary">

<h2
id="packageName"
>
جاري تحميل الباقة...
</h2>

id="packageGB"
class="gb"
>
--

<div
id="packagePrice"

>
--
</div>

</div>

============================== -->

id="errorMessage"
class="error"
></div>


<!-- ==============================

============================== -->

<div id="orderForm">


<!-- ==============================

============================== -->

<div class="promo">

<div class="promo-title">
🎁 عندك كود خصم؟
</div>

<input
id="promoInput"
class="promo-input"
type="text"
placeholder="اكتب كود الخصم"
autocomplete="off"
>

id="applyPromoButton"
class="promo-button"
type="button"
onclick="applyPromoCode()"

id="promoMessage"
class="promo-message"
></div>

</div>


<!-- ==============================
     NAME
============================== -->

<label class="label">
👤 اسم المشترك
</label>

<input
id="subscriberName"
type="text"
placeholder="اكتب اسم المشترك"
autocomplete="name"
>

</div>


<!-- ==============================
     PHONE
============================== -->

<label class="label">
📱 رقم التليفون
</label>

<input
id="phone"
type="tel"
inputmode="numeric"
maxlength="11"
placeholder="01xxxxxxxxx"
autocomplete="tel"
>

</div>

     SUBMIT
============================== -->

<button
id="submitButton"
class="submit"
type="button"
onclick="submitOrder()"
>
متابعة للدفع
</button>


</div>


<!-- ==============================
     SUCCESS
============================== -->

<div
id="successBox"
class="success"
>

<div class="success-icon">
✅
</div>

<h2>
تم إنشاء الطلب بنجاح
</h2>

<p>
جاري تحويلك لصفحة الدفع...
</p>

<div
id="orderNumber"
class="order-number"
></div>

</div>

href="packages.html"
class="back"
>
← العودة إلى الباقات
</a>

<script>


/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


/* ==================================================
   URL DATA
================================================== */

const params =
new URLSearchParams(
window.location.search
);


const orderType =
(
params.get("type") ||
"new"
)
.toLowerCase();


const customerId =
params.get("customer_id") ||
"";


const urlName =
params.get("name") ||
"";


const urlPhone =
params.get("phone") ||
"";


const packageGB =
params.get("gb") ||
params.get("package") ||
"";


/*
   السعر القادم من packages.html
   هو السعر النهائي بعد الخصم لو كان
   فيه كود.
*/

const urlPrice =
Number(
params.get("price")
);


/*
   السعر الأصلي قبل الخصم.
*/

const urlOriginal =
Number(
params.get("original")
);


/*
   لو original موجود نستخدمه.
   لو مش موجود نستخدم price.
*/

const originalPrice =
(
!Number.isNaN(urlOriginal) &&
urlOriginal > 0
)
?
urlOriginal
:
urlPrice;


/*
   الكود القادم من packages.html
*/

const promoFromUrl =
(
params.get("promo") ||
""
)
.trim()
.toUpperCase();


/* ==================================================
   PROMO STATE
================================================== */

let activePromo = null;

let promoDiscount = 0;

let finalPrice =
originalPrice;

let promoApplied = false;


/* ==================================================
   CUSTOMER TYPE
================================================== */

function setupCustomerType(){

    const box =
        document.getElementById(
            "customerType"
        );


    if(
        orderType ===
        "renewal"
    ){

        box.className =
            "customer-type renewal";

        box.textContent =
            "🔄 عميل حالي — تجديد الباقة";

    }

    else{

        box.className =
            "customer-type new";

        box.textContent =
            "🆕 عميل جديد — اشتراك جديد";

    }

}


/* ==================================================
   FILL DATA
================================================== */

function fillCustomerData(){

    const name =
        document.getElementById(
            "subscriberName"
        );

    const phone =
        document.getElementById(
            "phone"
        );


    if(urlName){

        name.value =
            urlName;

    }


    if(urlPhone){

        phone.value =
            urlPhone;

    }

}


/* ==================================================
   PACKAGE DISPLAY
================================================== */

function displayPackage(){

    const name =
        document.getElementById(
            "packageName"
        );

    const gb =
        document.getElementById(
            "packageGB"
        );


    if(
        !packageGB ||
        !originalPrice ||
        Number.isNaN(
            originalPrice
        )
    ){

        name.textContent =
            "لم يتم اختيار باقة";

        gb.textContent =
            "";

        document.getElementById(
            "packagePrice"
        ).textContent =
            "";

        return;

    }


    /*
       لو package جاي من الرابط
       كـ "20 جيجا"
       ننظفه للعرض.
    */

    let cleanGB =
        String(packageGB)
            .replace(
                "جيجا",
                ""
            )
            .trim();


    name.textContent =
        "باقة " +
        cleanGB +
        " جيجا";


    gb.textContent =
        cleanGB +
        " GB";


    updatePriceDisplay();

}


/* ==================================================
   PRICE
================================================== */

function updatePriceDisplay(){

    const element =
        document.getElementById(
            "packagePrice"
        );


    if(
        !element
    )
        return;


    if(
        promoApplied &&
        promoDiscount > 0
    ){

        element.innerHTML =

            '<span class="old-price">' +

            formatMoney(
                originalPrice
            ) +

            ' جنيه</span>' +

            formatMoney(
                finalPrice
            ) +

            ' جنيه' +

            '<div class="discount-line">' +

            '🎁 خصم ' +

            formatMoney(
                promoDiscount
            ) +

            ' جنيه' +

            '</div>';

    }

    else{

        element.textContent =
            formatMoney(
                originalPrice
            ) +
            " جنيه";

    }

}


/* ==================================================
   CHECK PROMO
================================================== */

async function checkPromoCode(
    code
){

    const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/check_promo_code",

            {

                method:
                    "POST",

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        input_code:
                            code

                    })

            }

        );


    const text =
        await response.text();


    let data = null;


    try{

        data =
            text
            ?
            JSON.parse(text)
            :
            null;

    }

    catch{

        data = null;

    }


    if(
        !response.ok
    ){

        throw new Error(

            data?.message ||
            data?.details ||
            data?.hint ||
            text ||
            "فشل التحقق من الكود"

        );

    }


    return data;

}


/* ==================================================
   APPLY PROMO
================================================== */

async function applyPromoCode(){

    const input =
        document.getElementById(
            "promoInput"
        );

    const message =
        document.getElementById(
            "promoMessage"
        );

    const button =
        document.getElementById(
            "applyPromoButton"
        );


    const code =
        input.value
        .trim()
        .toUpperCase();


    if(!code){

        message.className =
            "promo-message error";

        message.textContent =
            "❌ اكتب كود الخصم أولاً";

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "⏳ جاري التحقق...";


    message.className =
        "promo-message loading";

    message.textContent =
        "⏳ جاري التحقق من كود الخصم...";


    try{

        const data =
            await checkPromoCode(
                code
            );


        const result =
            Array.isArray(data)
            ?
            data[0]
            :
            data;


        console.log(
            "PROMO RESULT:",
            result
        );


        /* ==========================
           INVALID
        ========================== */

        if(
            !result ||
            result.valid !== true
        ){

            activePromo =
                null;

            promoApplied =
                false;

            promoDiscount =
                0;

            finalPrice =
                originalPrice;

            updatePriceDisplay();


            message.className =
                "promo-message error";

            message.textContent =
                "❌ " +
                (
                    result?.message ||
                    "كود الخصم غير صحيح أو منتهي الصلاحية"
                );

            return;

        }


        /* ==========================
           PROMO DATA
        ========================== */

        activePromo = {

            code:
                result.code ||
                code,

            type:
                result.discount_type,

            value:
                Number(
                    result.discount_value
                ) || 0

        };


        /* ==========================
           CALCULATE
        ========================== */

        let discount = 0;


        if(
            activePromo.type ===
            "percent"
        ){

            discount =
                originalPrice *
                activePromo.value /
                100;

        }

        else{

            discount =
                activePromo.value;

        }


        discount =
            Math.max(
                0,
                Math.min(
                    discount,
                    originalPrice
                )
            );


        promoDiscount =
            Math.round(
                discount
            );


        finalPrice =
            Math.max(
                0,
                Math.round(
                    originalPrice -
                    promoDiscount
                )
            );


        promoApplied =
            true;


        updatePriceDisplay();


        message.className =
            "promo-message success";


        message.innerHTML =

            "✅ تم تطبيق كود الخصم" +

            "<br>" +

            "🎁 الخصم: " +

            formatMoney(
                promoDiscount
            ) +

            " جنيه" +

            "<br>" +

            "💰 السعر النهائي: " +

            formatMoney(
                finalPrice
            ) +

            " جنيه";


        /*
        ==================================================
        مهم:

        هنا لا يتم زيادة used_count.

        التطبيق = تحقق فقط.

        الاستخدام الحقيقي يتم عند إرسال الدفع
        من payment.html عن طريق redeem_promo_code.
        ==================================================
        */

    }


    catch(error){

        console.error(
            "PROMO ERROR:",
            error
        );


        activePromo =
            null;

        promoApplied =
            false;

        promoDiscount =
            0;

        finalPrice =
            originalPrice;


        updatePriceDisplay();


        message.className =
            "promo-message error";


        message.textContent =
            "❌ تعذر التحقق من كود الخصم: " +
            error.message;

    }


    finally{

        button.disabled =
            false;

        button.textContent =
            "تطبيق الكود";

    }

}


/* ==================================================
   AUTO PROMO
================================================== */

async function applyPromoFromUrl(){

    if(
        !promoFromUrl
    )
        return;


    const input =
        document.getElementById(
            "promoInput"
        );


    input.value =
        promoFromUrl;


    await applyPromoCode();

}


/* ==================================================
   PHONE VALIDATION
================================================== */

function validPhone(
    phone
){

    return /^01[0125][0-9]{8}$/.test(
        phone
    );

}


/* ==================================================
   ERROR
================================================== */

function showError(
    text
){

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        text;


    box.style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ==================================================
   CREATE ORDER NUMBER
================================================== */

function createOrderNumber(){

    const random =
        Math.floor(
            1000 +
            Math.random() *
            9000
        );


    /*
       REN = عميل حالي
       NEW = عميل جديد

       لا نحتاج customer_id
       داخل جدول orders.
    */

    const prefix =
        orderType ===
        "renewal"
        ?
        "REN"
        :
        "NEW";


    return (

        prefix +
        "-" +
        Date.now()
            .toString()
            .slice(-7) +
        "-" +
        random

    );

}


/* ==================================================
   SUBMIT ORDER
================================================== */

async function submitOrder(){

    const nameInput =
        document.getElementById(
            "subscriberName"
        );


    const phoneInput =
        document.getElementById(
            "phone"
        );


    const button =
        document.getElementById(
            "submitButton"
        );


    const errorBox =
        document.getElementById(
            "errorMessage"
        );


    const name =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    errorBox.style.display =
        "none";


    /* ==========================
       NAME
    ========================== */

    if(!name){

        showError(
            "❌ اكتب اسم المشترك أولاً"
        );

        return;

    }


    /* ==========================
       PHONE
    ========================== */

    if(
        !validPhone(phone)
    ){

        showError(
            "❌ اكتب رقم تليفون مصري صحيح"
        );

        return;

    }


    /* ==========================
       PACKAGE
    ========================== */

    if(
        !packageGB ||
        !originalPrice ||
        Number.isNaN(
            originalPrice
        )
    ){

        showError(
            "❌ بيانات الباقة غير صحيحة"
        );

        return;

    }


    /* ==========================
       FINAL PRICE
    ========================== */

    const orderFinalPrice =
        promoApplied
        ?
        finalPrice
        :
        originalPrice;


    /* ==========================
       ORDER NUMBER
    ========================== */

    const orderNumber =
        createOrderNumber();


    /* ==========================
       CLEAN GB
    ========================== */

    const cleanGB =
        String(packageGB)
        .replace(
            "جيجا",
            ""
        )
        .trim();


    /* ==================================================
       ORDER DATA

       مهم:
       لا يوجد customer_id هنا.
       لأن جدول orders عندك لا يحتوي هذا العمود.
    ================================================== */

    const orderData = {

        subscriber_name:
            name,

        order_number:
            orderNumber,

        phone:
            phone,

        package_name:
            "باقة " +
            cleanGB +
            " جيجا",

        package_gb:
            Number(
                cleanGB
            ),

        original_price:
            Number(
                originalPrice
            ),

        final_price:
            Number(
                orderFinalPrice
            ),

        promo_code:
            promoApplied &&
            activePromo
            ?
            activePromo.code
            :
            "",

        payment_method:
            "لم يتم التحويل بعد",

        status:
            "pending"

    };


    console.log(
        "ORDER DATA:",
        orderData
    );


    button.disabled =
        true;


    button.textContent =
        "⏳ جاري تجهيز الطلب...";


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/orders",

                {

                    method:
                        "POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"

                    },

                    body:
                        JSON.stringify(
                            orderData
                        )

                }

            );


        const responseText =
            await response.text();


        console.log(
            "SUPABASE STATUS:",
            response.status
        );


        console.log(
            "SUPABASE RESPONSE:",
            responseText
        );


        /* ==========================
           DATABASE ERROR
        ========================== */

        if(
            !response.ok
        ){

            let message =
                responseText;


            try{

                const json =
                    JSON.parse(
                        responseText
                    );


                message =
                    json.message ||
                    json.details ||
                    json.hint ||
                    json.error ||
                    responseText;

            }

            catch{

                /* response not JSON */

            }


            throw new Error(
                message
            );

        }


        /* ==========================
           SUCCESS
        ========================== */

        document.getElementById(
            "orderForm"
        ).style.display =
            "none";


        document.getElementById(
            "successBox"
        ).style.display =
            "block";


        document.getElementById(
            "orderNumber"
        ).textContent =
            "رقم الطلب: " +
            orderNumber;


        /*
        ==================================================
        نرسل فقط رقم الطلب للدفع.

        payment.html سيقرأ الطلب من orders
        ويكمل عملية التحويل.

        وكود الخصم لن يُحتسب استخدامه هنا.
        ==================================================
        */

        setTimeout(

            function(){

                window.location.href =
                    "payment.html?order=" +
                    encodeURIComponent(
                        orderNumber
                    );

            },

            800

        );

    }


    catch(error){

        console.error(
            "ORDER ERROR:",
            error
        );


        showError(
            "❌ لم يتم إنشاء الطلب: " +
            error.message
        );


        button.disabled =
            false;


        button.textContent =
            "متابعة للدفع";

    }

}


/* ==================================================
   FORMAT MONEY
================================================== */

function formatMoney(
    value
){

    return Number(
        value || 0
    ).toLocaleString(
        "ar-EG",
        {
            maximumFractionDigits:0
        }
    );

}


/* ==================================================
   START
================================================== */

setupCustomerType();

fillCustomerData();

displayPackage();


if(
    promoFromUrl
){

    setTimeout(

        function(){

            applyPromoFromUrl();

        },

        200

    );

}

</script>
