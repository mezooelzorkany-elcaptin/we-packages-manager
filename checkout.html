<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إتمام الطلب | WE Packages</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif
}

body{
margin:0;
min-height:100vh;

background:
radial-gradient(
circle at 100% 0%,
#a06cf0 0%,
transparent 38%
),

linear-gradient(
135deg,
#f1eff9,
#ded5f0,
#d1c5e8
);

color:#19182d
}

.container{
width:92%;
max-width:650px;
margin:auto;
padding:30px 0 70px
}

.card{
background:rgba(255,255,255,.82);
border:1px solid rgba(255,255,255,.95);
border-radius:30px;
padding:28px 22px;

backdrop-filter:blur(20px);

box-shadow:
0 20px 50px
rgba(60,35,120,.14)
}

.logo{
text-align:center;
font-size:45px;
margin-bottom:8px
}

.title{
text-align:center;
color:#5420b8;
font-size:30px;
font-weight:900;
margin-bottom:7px
}

.subtitle{
text-align:center;
color:#777;
line-height:1.7;
margin-bottom:22px
}


/* TYPE */

.order-type{
text-align:center;
padding:12px;
border-radius:15px;
font-weight:900;
margin-bottom:18px
}

.new-type{
background:#e8ddff;
color:#5420b8
}

.current-type{
background:#dff8e8;
color:#08752d
}


/* PACKAGE */

.package-summary{
padding:22px;
border-radius:22px;

background:
linear-gradient(
135deg,
#5420b8,
#9747ff
);

color:white;
text-align:center;

margin-bottom:25px
}

.package-summary h2{
margin:0 0 10px;
font-size:25px
}

.package-summary .gb{
font-size:40px;
font-weight:900
}

.package-summary .price{
font-size:28px;
font-weight:bold;
margin-top:8px
}

.discount-line{
margin-top:10px;
font-size:15px;
color:#e9ffe9
}


/* FORM */

.label{
display:block;
margin-bottom:8px;
font-weight:bold;
font-size:17px
}

input{
width:100%;
padding:16px;

border:1px solid #ddd;
border-radius:15px;

outline:none;

font-size:17px;
text-align:center;

background:#fff;

margin-bottom:8px
}

input:focus{
border-color:#7544cf;

box-shadow:
0 0 0 3px
rgba(117,68,207,.12)
}

input:disabled{
background:#f1f1f1;
color:#666
}

.hint{
font-size:12px;
color:#777;
margin-bottom:20px;
text-align:center
}


/* BUTTON */

.submit{
width:100%;
padding:17px;

border:0;
border-radius:17px;

cursor:pointer;

color:#fff;

background:
linear-gradient(
135deg,
#5420b8,
#9747ff
);

font-size:18px;
font-weight:bold
}

.submit:disabled{
opacity:.6;
cursor:not-allowed
}


/* ERROR */

.error{
display:none;

margin-bottom:18px;

padding:13px;

border-radius:14px;

text-align:center;

background:#ffe2e2;
color:#a00000;

font-weight:bold;

line-height:1.7
}


/* SUCCESS */

.success{
display:none;
text-align:center;
padding:20px
}

.success-icon{
font-size:55px;
margin-bottom:10px
}

.success h2{
color:#5420b8
}

.order-number{
display:inline-block;

margin-top:12px;

padding:10px 18px;

border-radius:50px;

background:#eee6ff;
color:#5420b8;

font-weight:bold
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#5420b8;
text-decoration:none;
font-weight:bold
}

@media(max-width:600px){

.container{
width:94%
}

.title{
font-size:27px
}

}

</style>

</head>

<body>


<div class="container">

<div class="card">


<div class="logo">
📦
</div>


<div class="title">
إتمام الطلب
</div>


<div class="subtitle">
راجع بيانات طلبك ثم تابع إلى الدفع
</div>


<!-- TYPE -->

<div
id="orderType"
class="order-type"
>
⏳ جاري تحديد نوع العميل...
</div>


<!-- PACKAGE -->

<div class="package-summary">

<h2 id="packageName">
جاري تحميل الباقة...
</h2>

<div
class="gb"
id="packageGB"
>
--
</div>

<div
class="price"
id="packagePrice"
>
--
</div>

<div
id="discountLine"
class="discount-line"
></div>

</div>


<div
id="errorMessage"
class="error"
></div>


<div id="orderForm">


<label class="label">
👤 اسم المشترك
</label>

<input
type="text"
id="subscriberName"
placeholder="اكتب اسم المشترك"
autocomplete="name"
>

<div class="hint">
الاسم الذي سيتم تسجيل الطلب به
</div>


<label class="label">
📱 رقم التليفون
</label>

<input
type="tel"
id="phone"
inputmode="numeric"
maxlength="11"
placeholder="01xxxxxxxxx"
autocomplete="tel"
>

<div class="hint">
الرقم الذي سيتم تفعيل الباقة عليه
</div>


<button
class="submit"
id="submitButton"
onclick="submitOrder()"
>
متابعة للدفع
</button>

</div>


<div
class="success"
id="successBox"
>

<div class="success-icon">
✅
</div>

<h2>
تم إنشاء الطلب
</h2>

<p>
جاري تحويلك إلى صفحة الدفع...
</p>

<div
class="order-number"
id="orderNumber"
></div>

</div>


<a
href="index.html"
class="back"
>
← العودة للرئيسية
</a>


</div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


/* =====================================================
   URL DATA
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


const type =
params.get("type") || "new";


const customerId =
params.get("customer_id") || "";


const nameFromUrl =
params.get("name") || "";


const phoneFromUrl =
params.get("phone") || "";


const packageName =
params.get("package") || "";


const gb =
Number(
params.get("gb")
) || 0;


const originalPrice =
Number(
params.get("original_price")
) ||

Number(
params.get("price")
) ||

0;


const finalPrice =
Number(
params.get("price")
) ||

originalPrice;


const discountCode =
params.get("discount_code") || "";


const discountAmount =
Number(
params.get("discount_amount")
) || 0;


/* =====================================================
   TYPE
===================================================== */

const isCurrent =
type === "renewal";


const typeBox =
document.getElementById(
"orderType"
);


if(isCurrent){

typeBox.className =
"order-type current-type";

typeBox.textContent =
"👤 عميل حالي — تجديد الباقة";

}
else{

typeBox.className =
"order-type new-type";

typeBox.textContent =
"🆕 عميل جديد — اشتراك جديد";

}


/* =====================================================
   DISPLAY
===================================================== */

document.getElementById(
"packageName"
).textContent =
packageName || "الباقة";


document.getElementById(
"packageGB"
).textContent =
gb
?
gb+" GB"
:
"--";


document.getElementById(
"packagePrice"
).textContent =
finalPrice
?
finalPrice+" جنيه"
:
"--";


if(discountAmount>0){

document.getElementById(
"discountLine"
).textContent =
"🎟️ خصم "+
discountAmount+
" جنيه"+
(
discountCode
?
" — "+discountCode
:
""
);

}


/* =====================================================
   PREFILL
===================================================== */

if(nameFromUrl){

document.getElementById(
"subscriberName"
).value =
nameFromUrl;

}


if(phoneFromUrl){

document.getElementById(
"phone"
).value =
phoneFromUrl;

}


/*
   العميل الحالي:
   البيانات جاية من renew.html
*/

if(isCurrent){

document.getElementById(
"subscriberName"
).readOnly =
true;

document.getElementById(
"phone"
).readOnly =
true;

}


/* =====================================================
   PHONE
===================================================== */

function validPhone(phone){

return /^01[0125][0-9]{8}$/.test(
phone
);

}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

const box =
document.getElementById(
"errorMessage"
);

box.textContent =
text;

box.style.display =
"block";

}


/* =====================================================
   ORDER NUMBER
===================================================== */

function createOrderNumber(){

const random =
Math.floor(
1000+
Math.random()*9000
);

const prefix =
isCurrent
?
"CURRENT"
:
"NEW";

return (
prefix+
"-"+
Date.now()
.toString()
.slice(-6)+
"-"+
random
);

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitOrder(){

const name =
document.getElementById(
"subscriberName"
)
.value
.trim();


const phone =
document.getElementById(
"phone"
)
.value
.trim();


const button =
document.getElementById(
"submitButton"
);


document.getElementById(
"errorMessage"
).style.display =
"none";


if(!name){

showError(
"❌ اكتب اسم المشترك"
);

return;

}


if(!validPhone(phone)){

showError(
"❌ اكتب رقم تليفون مصري صحيح"
);

return;

}


if(!packageName || !finalPrice){

showError(
"❌ بيانات الباقة غير صحيحة"
);

return;

}


button.disabled =
true;

button.textContent =
"⏳ جاري تجهيز الطلب...";


const orderNumber =
createOrderNumber();


/* =====================================================
   ORDER DATA
===================================================== */

const orderData = {

subscriber_name:
name,

order_number:
orderNumber,

phone:
phone,

package_name:
packageName,

package_gb:
gb,

original_price:
originalPrice,

final_price:
finalPrice,

promo_code:
discountCode,

payment_method:
"لم يتم التحويل بعد",

status:
"pending"

};


/*
   مهم:
   العميل الحالي يتعرف من
   CURRENT-
   والجديد من
   NEW-
*/

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(
orderData
)

}

);


const text =
await response.text();


if(!response.ok){

let message =
text;

try{

const json =
JSON.parse(text);

message =
json.message||
json.details||
json.hint||
json.error||
text;

}
catch(e){}


throw new Error(
message
);

}


/* =====================================================
   SUCCESS
===================================================== */

document.getElementById(
"orderForm"
).style.display =
"none";


document.getElementById(
"successBox"
).style.display =
"block";


document.getElementById(
"orderNumber"
).textContent =
"رقم الطلب: "+
orderNumber;


/* =====================================================
   PAYMENT
===================================================== */

setTimeout(

function(){

window.location.href =
"payment.html?order="+
encodeURIComponent(
orderNumber
);

},

700

);


}
catch(error){

console.error(
"ORDER ERROR:",
error
);


showError(
"❌ تعذر إنشاء الطلب:\n"+
error.message
);


button.disabled =
false;

button.textContent =
"متابعة للدفع";

}

}

</script>

</body>

</html>
