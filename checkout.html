<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>
إتمام الطلب | WE Packages
</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;

font-family:
Arial,
Tahoma,
sans-serif;

background:
radial-gradient(
circle at 100% 0%,
#a06cf0 0%,
transparent 38%
),
linear-gradient(
135deg,
#f1eff9,
#ded5f0,
#d1c5e8
);

color:#19182d;
}

.container{
width:92%;
max-width:650px;
margin:auto;
padding:35px 0 70px;
}

.card{
background:rgba(255,255,255,.75);

border:
1px solid
rgba(255,255,255,.85);

border-radius:30px;

padding:30px 24px;

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

box-shadow:
0 20px 50px
rgba(60,35,120,.14);
}

.logo{
text-align:center;
font-size:42px;
margin-bottom:8px;
}

.title{
text-align:center;

color:#5420b8;

font-size:30px;
font-weight:900;

margin-bottom:8px;
}

.subtitle{
text-align:center;

color:#6d6d80;

margin-bottom:28px;

line-height:1.7;
}


/* =========================
   CUSTOMER TYPE
========================= */

.customer-type{
display:none;

text-align:center;

margin-bottom:20px;

padding:12px 15px;

border-radius:15px;

font-weight:bold;

font-size:16px;
}

.customer-type.new{
display:block;

background:#eee6ff;

color:#5420b8;
}

.customer-type.renewal{
display:block;

background:#e4f8ec;

color:#08752d;
}


/* =========================
   PACKAGE SUMMARY
========================= */

.package-summary{
padding:22px;

border-radius:22px;

background:
linear-gradient(
135deg,
#5420b8,
#9747ff
);

color:#fff;

text-align:center;

margin-bottom:25px;

box-shadow:
0 12px 30px
rgba(84,32,184,.2);
}

.package-summary h2{
margin:0 0 10px;

font-size:26px;
}

.package-summary .gb{
font-size:42px;
font-weight:900;
}

.package-summary .price{
font-size:27px;

font-weight:bold;

margin-top:8px;

line-height:1.5;
}

.old-price{
text-decoration:line-through;

opacity:.7;

font-size:19px;

margin-left:8px;
}

.discount-line{
font-size:15px;

color:#eaffef;

margin-top:5px;
}


/* =========================
   PROMO
========================= */

.promo{
padding:22px;

margin-bottom:25px;

border-radius:22px;

background:
rgba(255,255,255,.65);

border:
1px solid
rgba(84,32,184,.14);

text-align:center;
}

.promo-title{
color:#5420b8;

font-size:24px;

font-weight:900;

margin-bottom:15px;
}

.promo-input{
width:100%;

height:55px;

border:
1px solid
#ddd;

border-radius:16px;

outline:none;

padding:0 15px;

font-size:18px;

text-align:center;

background:#fff;
}

.promo-input:focus{
border-color:#7544cf;

box-shadow:
0 0 0 3px
rgba(117,68,207,.12);
}

.promo-button{
width:100%;

height:55px;

margin-top:12px;

border:0;

border-radius:16px;

cursor:pointer;

color:#fff;

background:
linear-gradient(
135deg,
#5420b8,
#9747ff
);

font-size:18px;

font-weight:bold;
}

.promo-button:disabled{
opacity:.6;

cursor:not-allowed;
}

.promo-message{
display:none;

margin-top:12px;

font-size:16px;

font-weight:bold;

line-height:1.7;
}

.promo-message.success{
display:block;

color:#08752d;
}

.promo-message.error{
display:block;

color:#a00000;
}

.promo-message.loading{
display:block;

color:#5420b8;
}


/* =========================
   FORM
========================= */

.label{
display:block;

margin-bottom:9px;

font-weight:bold;

color:#353448;

font-size:18px;
}

input{
width:100%;

padding:17px;

border:
1px solid
#ddd;

border-radius:16px;

outline:none;

font-size:18px;

text-align:center;

background:#fff;
}

input:focus{
border-color:#7544cf;

box-shadow:
0 0 0 3px
rgba(117,68,207,.12);
}

.hint{
font-size:13px;

color:#777;

margin-top:8px;

margin-bottom:25px;

text-align:center;
}


/* =========================
   ERROR
========================= */

.error{
display:none;

margin-bottom:18px;

padding:13px;

border-radius:14px;

text-align:center;

background:#ffe2e2;

color:#a00000;

font-weight:bold;

word-break:break-word;
}


/* =========================
   SUBMIT
========================= */

.submit{
width:100%;

padding:17px;

border:none;

border-radius:17px;

cursor:pointer;

color:#fff;

background:
linear-gradient(
135deg,
#5420b8,
#9747ff
);

font-size:19px;

font-weight:bold;

box-shadow:
0 10px 25px
rgba(84,32,184,.2);
}

.submit:disabled{
opacity:.6;

cursor:not-allowed;
}


/* =========================
   SUCCESS
========================= */

.success{
display:none;

text-align:center;

padding:20px;
}

.success-icon{
font-size:55px;

margin-bottom:10px;
}

.success h2{
color:#5420b8;

margin-bottom:10px;
}

.order-number{
display:inline-block;

margin-top:12px;

padding:10px 18px;

border-radius:50px;

background:#eee6ff;

color:#5420b8;

font-weight:bold;
}


/* =========================
   BACK
========================= */

.back{
display:block;

text-align:center;

margin-top:22px;

color:#5420b8;

text-decoration:none;

font-weight:bold;
}


/* =========================
   MOBILE
========================= */

@media(max-width:550px){

.container{
width:94%;

padding-top:20px;
}

.card{
padding:24px 18px;
}

.title{
font-size:27px;
}

.package-summary .gb{
font-size:38px;
}

.package-summary .price{
font-size:24px;
}

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<div class="logo">
📦
</div>


<div class="title">
إتمام الطلب
</div>


<div class="subtitle">
أدخل بيانات المشترك لإتمام الطلب
</div>


<!-- =========================
     CUSTOMER TYPE
========================= -->

<div
id="customerType"
class="customer-type"
></div>


<!-- =========================
     PACKAGE
========================= -->

<div class="package-summary">

<h2 id="packageName">
جاري تحميل الباقة...
</h2>


<div
class="gb"
id="packageGB"
>
--
</div>


<div
class="price"
id="packagePrice"
>
--
</div>

</div>


<!-- =========================
     ERROR
========================= -->

<div
class="error"
id="errorMessage"
></div>


<!-- =========================
     ORDER FORM
========================= -->

<div id="orderForm">


<!-- =========================
     PROMO
========================= -->

<div class="promo">

<div class="promo-title">
🎁 عندك كود خصم؟
</div>


<input
id="promoInput"
class="promo-input"
type="text"
placeholder="اكتب كود الخصم"
autocomplete="off"
>


<button
id="applyPromoButton"
class="promo-button"
type="button"
onclick="applyPromoCode()"
>
تطبيق الكود
</button>


<div
id="promoMessage"
class="promo-message"
></div>

</div>


<!-- =========================
     NAME
========================= -->

<label class="label">
👤 اسم المشترك
</label>


<input
type="text"
id="subscriberName"
placeholder="اكتب اسم المشترك"
autocomplete="name"
>


<div class="hint">
الاسم الذي سيتم تسجيل الطلب به
</div>


<!-- =========================
     PHONE
========================= -->

<label class="label">
📱 رقم التليفون
</label>


<input
type="tel"
id="phone"
inputmode="numeric"
maxlength="11"
placeholder="01xxxxxxxxx"
autocomplete="tel"
>


<div class="hint">
الرقم الذي سيتم تفعيل الباقة عليه
</div>


<!-- =========================
     SUBMIT
========================= -->

<button
class="submit"
id="submitButton"
type="button"
onclick="submitOrder()"
>
متابعة للدفع
</button>


</div>


<!-- =========================
     SUCCESS
========================= -->

<div
class="success"
id="successBox"
>

<div class="success-icon">
✅
</div>


<h2>
تم تسجيل الطلب بنجاح
</h2>


<p>
جاري تحويلك للدفع...
</p>


<div
class="order-number"
id="orderNumber"
></div>

</div>


<a
href="packages.html"
class="back"
>
← العودة إلى الباقات
</a>


</div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";


const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


/* =====================================================
   URL
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


const packageGB =
params.get("package") || "";


/*
   السعر القادم من الرابط.
*/

const urlPrice =
Number(
params.get("price")
);


/*
   original موجود عند الانتقال
   من packages.html.

   لو مش موجود نستخدم price.
*/

const urlOriginal =
Number(
params.get("original")
);


const originalPrice =
(
!Number.isNaN(urlOriginal) &&
urlOriginal > 0
)
?
urlOriginal
:
urlPrice;


/* =====================================================
   CUSTOMER TYPE
===================================================== */

const orderType =
params.get("type") || "new";


const customerId =
params.get("customer_id") || "";


const urlName =
params.get("name") || "";


const urlPhone =
params.get("phone") || "";


/* =====================================================
   PROMO FROM URL
===================================================== */

const promoFromUrl =
(
params.get("promo") || ""
)
.trim()
.toUpperCase();


/* =====================================================
   PROMO STATE
===================================================== */

let activePromo = null;

let promoDiscount = 0;

let finalPrice =
originalPrice;

let promoApplied = false;


/* =====================================================
   CUSTOMER TYPE
===================================================== */

function setupCustomerType(){

const box =
document.getElementById(
"customerType"
);


if(orderType === "renewal"){

box.className =
"customer-type renewal";


box.textContent =
"🔄 عميل حالي — تجديد الباقة";

}
else{

box.className =
"customer-type new";


box.textContent =
"🆕 عميل جديد — اشتراك جديد";

}

}


/* =====================================================
   DISPLAY CUSTOMER DATA
===================================================== */

function fillCustomerData(){

const nameInput =
document.getElementById(
"subscriberName"
);


const phoneInput =
document.getElementById(
"phone"
);


if(urlName){

nameInput.value =
urlName;

}


if(urlPhone){

phoneInput.value =
urlPhone;

}

}


/* =====================================================
   DISPLAY PACKAGE
===================================================== */

function displayPackage(){

const packageName =
document.getElementById(
"packageName"
);


const packageGBElement =
document.getElementById(
"packageGB"
);


if(
!packageGB ||
!originalPrice ||
Number.isNaN(
originalPrice
)
){

packageName.textContent =
"لم يتم اختيار باقة";


packageGBElement.textContent =
"";


document.getElementById(
"packagePrice"
).textContent =
"";

return;

}


packageName.textContent =
"باقة " +
packageGB +
" جيجا";


packageGBElement.textContent =
packageGB +
" GB";


updatePriceDisplay();

}


/* =====================================================
   PRICE DISPLAY
===================================================== */

function updatePriceDisplay(){

const priceElement =
document.getElementById(
"packagePrice"
);


if(!priceElement)
return;


if(
promoApplied &&
promoDiscount > 0
){

priceElement.innerHTML = `

<span class="old-price">
${formatMoney(originalPrice)} جنيه
</span>

${formatMoney(finalPrice)}
جنيه

<div class="discount-line">
🎁 خصم ${formatMoney(promoDiscount)} جنيه
</div>

`;

}
else{

priceElement.textContent =
formatMoney(
originalPrice
) +
" جنيه";

}

}


/* =====================================================
   SUPABASE RPC
===================================================== */

async function checkPromoCode(
code
){

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/rpc/check_promo_code",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Accept":
"application/json"

},

body:
JSON.stringify({

input_code:
code

})

}

);


const text =
await response.text();


let data = null;


try{

data =
text
?
JSON.parse(text)
:
null;

}
catch{

data = null;

}


if(!response.ok){

console.error(
"PROMO RPC ERROR",
response.status,
text
);


throw new Error(

data?.message ||
data?.details ||
data?.hint ||
data?.error ||
text ||
"فشل التحقق من كود الخصم"

);

}


return data;

}


/* =====================================================
   APPLY PROMO
===================================================== */

async function applyPromoCode(){

const input =
document.getElementById(
"promoInput"
);


const message =
document.getElementById(
"promoMessage"
);


const button =
document.getElementById(
"applyPromoButton"
);


const code =
input.value
.trim()
.toUpperCase();


if(!code){

message.className =
"promo-message error";


message.textContent =
"❌ اكتب كود الخصم أولاً";


return;

}


button.disabled =
true;


button.textContent =
"⏳ جاري التحقق...";


message.className =
"promo-message loading";


message.textContent =
"⏳ جاري التحقق من كود الخصم...";


try{


const data =
await checkPromoCode(
code
);


const result =
Array.isArray(data)
?
data[0]
:
data;


console.log(
"PROMO RESULT:",
result
);


/* =========================
   INVALID
========================= */

if(
!result ||
result.valid !== true
){

activePromo =
null;

promoApplied =
false;

promoDiscount =
0;

finalPrice =
originalPrice;

updatePriceDisplay();


message.className =
"promo-message error";


message.textContent =
"❌ " +
(
result?.message ||
"كود الخصم غير صحيح أو منتهي الصلاحية"
);


return;

}


/* =========================
   SAVE PROMO
========================= */

activePromo = {

code:
result.code ||
code,

type:
result.discount_type,

value:
Number(
result.discount_value
) || 0

};


/* =========================
   CALCULATE
========================= */

let discount = 0;


if(
activePromo.type ===
"percent"
){

discount =
originalPrice *
activePromo.value /
100;

}
else{

discount =
activePromo.value;

}


discount =
Math.max(
0,
Math.min(
discount,
originalPrice
)
);


promoDiscount =
Number(
discount.toFixed(2)
);


finalPrice =
Number(
(
originalPrice -
promoDiscount
)
.toFixed(2)
);


promoApplied =
true;


updatePriceDisplay();


message.className =
"promo-message success";


message.innerHTML = `

✅ تم تطبيق كود الخصم

<br>

🎁 الخصم:
${formatMoney(promoDiscount)}
جنيه

<br>

💰 السعر النهائي:
${formatMoney(finalPrice)}
جنيه

`;


/*
=====================================================
مهم جدًا:

لا يوجد هنا أي UPDATE
ولا زيادة used_count.

تطبيق الكود فقط = فحص الكود.

الاستخدام لا يتحسب إلا بعد تأكيد الدفع.
=====================================================
*/


}
catch(error){

console.error(
"PROMO ERROR:",
error
);


activePromo =
null;

promoApplied =
false;

promoDiscount =
0;

finalPrice =
originalPrice;


updatePriceDisplay();


message.className =
"promo-message error";


message.innerHTML =

"❌ تعذر التحقق من كود الخصم" +

"<br><br>" +

escapeHtml(
error.message
);

}
finally{

button.disabled =
false;

button.textContent =
"تطبيق الكود";

}

}


/* =====================================================
   AUTO PROMO FROM URL
===================================================== */

async function applyPromoFromUrl(){

if(!promoFromUrl)
return;


/*
   نحط الكود في الخانة.
*/

document.getElementById(
"promoInput"
).value =
promoFromUrl;


/*
   نتحقق منه من جديد.

   لا نعتمد على السعر القادم
   من الرابط وحده.
*/

await applyPromoCode();

}


/* =====================================================
   PHONE
===================================================== */

function validPhone(
phone
){

return /^01[0125][0-9]{8}$/.test(
phone
);

}


/* =====================================================
   ERROR
===================================================== */

function showError(
text
){

const box =
document.getElementById(
"errorMessage"
);


box.textContent =
text;


box.style.display =
"block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   CREATE ORDER NUMBER
===================================================== */

function createOrderNumber(){

const random =
Math.floor(
1000 +
Math.random() *
9000
);


return (
"WE-" +
Date.now()
.toString()
.slice(-6) +
"-" +
random
);

}


/* =====================================================
   SUBMIT ORDER
===================================================== */

async function submitOrder(){

const nameInput =
document.getElementById(
"subscriberName"
);


const phoneInput =
document.getElementById(
"phone"
);


const button =
document.getElementById(
"submitButton"
);


const errorBox =
document.getElementById(
"errorMessage"
);


const name =
nameInput.value.trim();


const phone =
phoneInput.value.trim();


errorBox.style.display =
"none";


/* =========================
   NAME
========================= */

if(!name){

showError(
"⚠️ اكتب اسم المشترك"
);

return;

}


/* =========================
   PHONE
========================= */

if(
!validPhone(phone)
){

showError(
"⚠️ اكتب رقم تليفون مصري صحيح"
);

return;

}


/* =========================
   PACKAGE
========================= */

if(
!packageGB ||
!originalPrice ||
Number.isNaN(
originalPrice
)
){

showError(
"⚠️ بيانات الباقة غير صحيحة"
);

return;

}


/* =========================
   BUTTON
========================= */

button.disabled =
true;


button.textContent =
"⏳ جاري تجهيز الطلب...";


const orderNumber =
createOrderNumber();


/* =====================================================
   FINAL PRICE
===================================================== */

const orderFinalPrice =
promoApplied
?
finalPrice
:
originalPrice;


/* =====================================================
   ORDER
===================================================== */

const orderData = {

subscriber_name:
name,

order_number:
orderNumber,

phone:
phone,

package_name:
"باقة " +
packageGB +
" جيجا",

package_gb:
Number(
packageGB
),

original_price:
Number(
originalPrice
),

final_price:
Number(
orderFinalPrice
),

promo_code:
promoApplied
?
activePromo.code
:
null,

payment_method:
"لم يتم التحويل بعد",

status:
"pending"

};


/*
   بيانات العميل الحالي.
*/

if(
orderType === "renewal" &&
customerId
){

orderData.customer_id =
Number(customerId);

}


/* =====================================================
   SEND ORDER
===================================================== */

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/orders",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(
orderData
)

}

);


const text =
await response.text();


let data = null;


try{

data =
text
?
JSON.parse(text)
:
null;

}
catch{

data = null;

}


/* =========================
   DATABASE ERROR
========================= */

if(
!response.ok
){

console.error(
"ORDER ERROR:",
response.status,
text
);


throw new Error(

data?.message ||
data?.details ||
data?.hint ||
data?.error ||
text ||
"فشل إنشاء الطلب"

);

}


/* =========================
   SUCCESS
========================= */

console.log(
"ORDER CREATED:",
data
);


document.getElementById(
"orderForm"
).style.display =
"none";


document.getElementById(
"successBox"
).style.display =
"block";


document.getElementById(
"orderNumber"
).textContent =
"رقم الطلب: " +
orderNumber;


/*
=====================================================
مهم:

هنا لا نزيد استخدام الكود.

الكود أصبح محفوظًا داخل الطلب فقط.

زيادة الاستخدام تكون بعد تأكيد الدفع.
=====================================================
*/


setTimeout(
function(){

window.location.href =
"payment.html?order=" +
encodeURIComponent(
orderNumber
);

},
800
);


}
catch(error){

console.error(
"SAVE ORDER ERROR:",
error
);


showError(
"❌ لم يتم إنشاء الطلب:\n\n" +
error.message
);


button.disabled =
false;


button.textContent =
"متابعة للدفع";

}

}


/* =====================================================
   FORMAT MONEY
===================================================== */

function formatMoney(
value
){

return Number(
value || 0
).toLocaleString(
"ar-EG",
{
maximumFractionDigits:2
}
);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
value
){

return String(
value ?? ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)
