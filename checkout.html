<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إتمام الطلب | WE Packages</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Tahoma,sans-serif;

    background:
        radial-gradient(
            circle at 100% 0%,
            #a06cf0 0%,
            transparent 38%
        ),
        linear-gradient(
            135deg,
            #f1eff9,
            #ded5f0,
            #d1c5e8
        );

    color:#19182d;
}

.container{
    width:92%;
    max-width:650px;
    margin:auto;
    padding:35px 0 70px;
}

.card{
    background:rgba(255,255,255,.75);

    border:1px solid rgba(255,255,255,.85);

    border-radius:30px;

    padding:30px 24px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 50px
        rgba(60,35,120,.14);
}

.logo{
    text-align:center;

    font-size:42px;

    margin-bottom:8px;
}

.title{
    text-align:center;

    color:#5420b8;

    font-size:30px;

    font-weight:900;

    margin-bottom:8px;
}

.subtitle{
    text-align:center;

    color:#6d6d80;

    margin-bottom:28px;

    line-height:1.7;
}

.package-summary{
    padding:22px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #5420b8,
            #9747ff
        );

    color:#fff;

    text-align:center;

    margin-bottom:25px;

    box-shadow:
        0 12px 30px
        rgba(84,32,184,.2);
}

.package-summary h2{
    margin:0 0 10px;

    font-size:26px;
}

.package-summary .gb{
    font-size:42px;

    font-weight:900;
}

.package-summary .price{
    font-size:27px;

    font-weight:bold;

    margin-top:8px;
}

.label{
    display:block;

    margin-bottom:9px;

    font-weight:bold;

    color:#353448;

    font-size:18px;
}

input{
    width:100%;

    padding:17px;

    border:1px solid #ddd;

    border-radius:16px;

    outline:none;

    font-size:18px;

    text-align:center;

    background:#fff;
}

input:focus{
    border-color:#7544cf;

    box-shadow:
        0 0 0 3px
        rgba(117,68,207,.12);
}

.hint{
    font-size:13px;

    color:#777;

    margin-top:8px;

    margin-bottom:25px;

    text-align:center;
}

.submit{
    width:100%;

    padding:17px;

    border:none;

    border-radius:17px;

    cursor:pointer;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #5420b8,
            #9747ff
        );

    font-size:19px;

    font-weight:bold;

    box-shadow:
        0 10px 25px
        rgba(84,32,184,.2);
}

.submit:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.error{
    display:none;

    margin-bottom:18px;

    padding:13px;

    border-radius:14px;

    text-align:center;

    background:#ffe2e2;

    color:#a00000;

    font-weight:bold;

    word-break:break-word;
}

.success{
    display:none;

    text-align:center;

    padding:20px;
}

.success-icon{
    font-size:55px;

    margin-bottom:10px;
}

.success h2{
    color:#5420b8;

    margin-bottom:10px;
}

.order-number{
    display:inline-block;

    margin-top:12px;

    padding:10px 18px;

    border-radius:50px;

    background:#eee6ff;

    color:#5420b8;

    font-weight:bold;
}

.back{
    display:block;

    text-align:center;

    margin-top:22px;

    color:#5420b8;

    text-decoration:none;

    font-weight:bold;
}

</style>
</head>


<body>

<div class="container">

<div class="card">


<div class="logo">
    📦
</div>


<div class="title">
    إتمام الطلب
</div>


<div class="subtitle">
    أدخل بيانات المشترك لإتمام الطلب
</div>


<!-- =========================
     PACKAGE SUMMARY
========================= -->

<div class="package-summary">

    <h2 id="packageName">
        جاري تحميل الباقة...
    </h2>

    <div
        class="gb"
        id="packageGB"
    >
        --
    </div>

    <div
        class="price"
        id="packagePrice"
    >
        --
    </div>

</div>


<!-- =========================
     ERROR
========================= -->

<div
    class="error"
    id="errorMessage"
></div>


<!-- =========================
     ORDER FORM
========================= -->

<div id="orderForm">


    <!-- SUBSCRIBER NAME -->

    <label class="label">
        👤 اسم المشترك
    </label>

    <input
        type="text"
        id="subscriberName"
        placeholder="اكتب اسم المشترك"
        autocomplete="name"
    >

    <div class="hint">
        الاسم الذي سيتم تسجيل الطلب به
    </div>


    <!-- PHONE -->

    <label class="label">
        📱 رقم التليفون
    </label>

    <input
        type="tel"
        id="phone"
        inputmode="numeric"
        maxlength="11"
        placeholder="01xxxxxxxxx"
        autocomplete="tel"
    >

    <div class="hint">
        الرقم الذي سيتم تفعيل الباقة عليه
    </div>


    <!-- SUBMIT -->

    <button
        class="submit"
        id="submitButton"
        onclick="submitOrder()"
    >
        متابعة للدفع
    </button>

</div>


<!-- =========================
     SUCCESS
========================= -->

<div
    class="success"
    id="successBox"
>

    <div class="success-icon">
        ✅
    </div>

    <h2>
        جاري تحويلك للدفع
    </h2>

    <p>
        لحظة واحدة...
    </p>

    <div
        class="order-number"
        id="orderNumber"
    ></div>

</div>


<!-- =========================
     BACK
========================= -->

<a
    href="packages.html"
    class="back"
>
    ← العودة إلى الباقات
</a>


</div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


/* =====================================================
   GET DATA FROM URL
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);


const packageGB =
params.get("package");


const price =
Number(
    params.get("price")
);


const promoCode =
params.get("promo") || "";


/* =====================================================
   DISPLAY PACKAGE
===================================================== */

if(
    !packageGB ||
    !price
){

    document.getElementById(
        "packageName"
    ).textContent =
        "لم يتم اختيار باقة";


    document.getElementById(
        "packageGB"
    ).textContent =
        "";


    document.getElementById(
        "packagePrice"
    ).textContent =
        "";

}
else{

    document.getElementById(
        "packageName"
    ).textContent =
        "باقة " +
        packageGB +
        " جيجا";


    document.getElementById(
        "packageGB"
    ).textContent =
        packageGB +
        " GB";


    document.getElementById(
        "packagePrice"
    ).textContent =
        price +
        " جنيه";

}


/* =====================================================
   PHONE VALIDATION
===================================================== */

function validPhone(phone){

    return /^01[0125][0-9]{8}$/.test(
        phone
    );

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(text){

    const error =
        document.getElementById(
            "errorMessage"
        );


    error.textContent =
        text;


    error.style.display =
        "block";

}


/* =====================================================
   CREATE ORDER NUMBER
===================================================== */

function createOrderNumber(){

    const random =
        Math.floor(
            1000 +
            Math.random() *
            9000
        );


    return (
        "WE-" +
        Date.now()
            .toString()
            .slice(-6) +
        "-" +
        random
    );

}


/* =====================================================
   CREATE ORDER
===================================================== */

async function submitOrder(){


    /* =========================
       GET NAME
    ========================= */

    const subscriberName =
        document.getElementById(
            "subscriberName"
        ).value.trim();


    /* =========================
       GET PHONE
    ========================= */

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    /* =========================
       BUTTON
    ========================= */

    const button =
        document.getElementById(
            "submitButton"
        );


    /* =========================
       ERROR BOX
    ========================= */

    const errorBox =
        document.getElementById(
            "errorMessage"
        );


    errorBox.style.display =
        "none";


    /* =========================
       NAME VALIDATION
    ========================= */

    if(
        !subscriberName
    ){

        showError(
            "❌ اكتب اسم المشترك أولاً"
        );

        return;

    }


    /* =========================
       PHONE VALIDATION
    ========================= */

    if(
        !validPhone(phone)
    ){

        showError(
            "❌ اكتب رقم تليفون مصري صحيح"
        );

        return;

    }


    /* =========================
       PACKAGE VALIDATION
    ========================= */

    if(
        !packageGB ||
        !price ||
        Number.isNaN(price)
    ){

        showError(
            "❌ بيانات الباقة غير صحيحة"
        );

        return;

    }


    /* =========================
       DISABLE BUTTON
    ========================= */

    button.disabled =
        true;


    button.textContent =
        "⏳ جاري تجهيز الطلب...";


    /* =========================
       ORDER NUMBER
    ========================= */

    const orderNumber =
        createOrderNumber();


    /* =================================================
       ORDER DATA
    ================================================= */

    const orderData = {

        subscriber_name:
            subscriberName,

        order_number:
            orderNumber,

        phone:
            phone,

        package_name:
            "باقة " +
            packageGB +
            " جيجا",

        package_gb:
            Number(packageGB),

        original_price:
            Number(price),

        final_price:
            Number(price),

        promo_code:
            promoCode,

        payment_method:
            "لم يتم التحويل بعد",

        status:
            "pending"

    };


    console.log(
        "ORDER DATA:",
        orderData
    );


    /* =================================================
       SEND TO SUPABASE
    ================================================= */

    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/orders",

            {

                method:
                    "POST",

                headers:{

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=representation"

                },

                body:
                    JSON.stringify(
                        orderData
                    )

            }

        );


        /* =================================================
           RESPONSE
        ================================================= */

        const responseText =
            await response.text();


        console.log(
            "SUPABASE STATUS:",
            response.status
        );


        console.log(
            "SUPABASE RESPONSE:",
            responseText
        );


        /* =================================================
           SUPABASE ERROR
        ================================================= */

        if(
            !response.ok
        ){

            let message =
                responseText;


            try{

                const json =
                    JSON.parse(
                        responseText
                    );


                message =
                    json.message ||
                    json.details ||
                    json.hint ||
                    json.error ||
                    responseText;

            }
            catch(e){

                console.error(
                    "Response is not JSON"
                );

            }


            showError(
                "❌ خطأ قاعدة البيانات: " +
                message
            );


            button.disabled =
                false;


            button.textContent =
                "متابعة للدفع";


            return;

        }


        /* =================================================
           SUCCESS
        ================================================= */

        console.log(
            "ORDER CREATED SUCCESSFULLY"
        );


        document.getElementById(
            "orderForm"
        ).style.display =
            "none";


        document.getElementById(
            "successBox"
        ).style.display =
            "block";


        document.getElementById(
            "orderNumber"
        ).textContent =
            "رقم الطلب: " +
            orderNumber;


        /* =================================================
           GO TO PAYMENT PAGE
        ================================================= */

        setTimeout(

            function(){

                window.location.href =
                    "payment.html?order=" +
                    encodeURIComponent(
                        orderNumber
                    );

            },

            700

        );

    }


    /* =================================================
       CONNECTION ERROR
    ================================================= */

    catch(error){

        console.error(
            "FETCH ERROR:",
            error
        );


        showError(
            "❌ تعذر الاتصال بقاعدة البيانات: " +
            error.message
        );


        button.disabled =
            false;


        button.textContent =
            "متابعة للدفع";

    }

}

</script>

</body>
</html>
