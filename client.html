<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنا عميل حالي | CASH BACK</title><style>*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#151a35,#5420b8);padding:18px;color:#172033}.wrap{max-width:570px;margin:auto;padding-top:20px}.card{background:#fff;border-radius:30px;padding:27px;box-shadow:0 25px 70px #0004}.logo{width:90px;height:90px;background:#fff;border-radius:25px;padding:8px;margin:0 auto 15px;box-shadow:0 10px 30px #0002}.logo img{width:100%;height:100%;object-fit:contain}.h{text-align:center;color:#293160;font-size:28px;font-weight:900}.sub{text-align:center;color:#7b8395;line-height:1.7;margin:9px 0 24px}.choice{display:flex;align-items:center;gap:14px;width:100%;border:2px solid #e7e3ef;background:#faf9fd;border-radius:20px;padding:18px;margin:12px 0;cursor:pointer;text-align:right}.icon{width:54px;height:54px;flex:0 0 54px;border-radius:17px;background:#eee5ff;display:grid;place-items:center;font-size:27px}.choice h2{font-size:18px;margin:0 0 5px;color:#292f62}.choice p{margin:0;color:#858b99;font-size:13px}.arrow{margin-right:auto;color:#5420b8;font-size:25px}.panel{display:none}.back{border:0;background:#eee8fb;color:#5420b8;border-radius:13px;padding:10px 15px;font-weight:bold;cursor:pointer;margin-bottom:18px}.field{margin-bottom:16px}label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}input,select{width:100%;height:51px;border:2px solid #e2e6ef;border-radius:14px;padding:0 14px;font-size:16px;outline:0;background:#fff}.price{background:#f5f1ff;border:1px solid #e2d7ff;border-radius:17px;padding:15px;margin:4px 0 18px}.price small{color:#777}.price strong{display:block;color:#5420b8;font-size:27px;margin-top:4px}.submit{width:100%;height:53px;border:0;border-radius:15px;background:linear-gradient(135deg,#5420b8,#7e3fe0);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.submit:disabled{opacity:.6}.message{display:none;text-align:center;border-radius:15px;padding:14px;margin-top:14px;font-weight:bold;line-height:1.7}.success{background:#e5f8ec;color:#08752d}.error{background:#ffe7e7;color:#a00000}.warning{background:#fff5d9;color:#795400}.renewBtn{display:block;width:100%;height:50px;border:0;border-radius:14px;background:#5420b8;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:12px}.note{text-align:center;color:#858b99;font-size:12px;line-height:1.7;margin-top:14px}</style></head>
<body><div class="wrap"><div class="card">
<div id="home"><div class="logo"><img src="logo.png" alt="CASH BACK"></div><div class="h">أنا عميل حالي</div><div class="sub">اختار الخدمة اللي عايزها</div><div class="choice" onclick="showRegister()"><div class="icon">📝</div><div><h2>تسجيل بياناتي</h2><p>لو دي أول مرة تسجل بياناتك عندنا</p></div><div class="arrow">‹</div></div><div class="choice" onclick="goRenew()"><div class="icon">🔄</div><div><h2>تجديد اشتراكي</h2><p>أنا عميل مسجل وعايز أجدد الباقة</p></div><div class="arrow">‹</div></div></div>
<div id="registerPanel" class="panel"><button class="back" onclick="backHome()">→ رجوع</button><div class="h">📝 تسجيل بياناتي</div><div class="sub">سجّل بياناتك واختار الباقة وموعد التجديد</div><div class="field"><label>👤 الاسم *</label><input id="customerName" autocomplete="name" placeholder="اكتب اسمك"></div><div class="field"><label>📱 رقم الموبايل *</label><input id="customerPhone" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>📦 الباقة *</label><select id="packageName" onchange="updatePrice()"><option value="">اختار الباقة</option><option value="20">20 جيجا</option><option value="25">25 جيجا</option><option value="30">30 جيجا</option><option value="35">35 جيجا</option><option value="40">40 جيجا</option><option value="45">45 جيجا</option><option value="50">50 جيجا</option><option value="55">55 جيجا</option><option value="60">60 جيجا</option></select></div><div class="price"><small>💰 سعر الباقة</small><strong id="price">اختار الباقة أولًا</strong></div><div class="field"><label>📅 موعد التجديد *</label><select id="renewalType"><option value="">اختار الموعد</option><option value="day_1">يوم 1 من كل شهر</option><option value="day_16">يوم 16 من كل شهر</option></select></div><div id="successMessage" class="message success"></div><div id="errorMessage" class="message error"></div><button id="renewButton" class="renewBtn" style="display:none" onclick="goRenew()">🔄 تجديد الاشتراك</button><button id="submitButton" class="submit" onclick="registerCustomer()">✅ تسجيل البيانات</button><div class="note">بياناتك تُستخدم لتسجيل اشتراكك فقط.</div></div>
</div></div>
<script>
const URL='https://pgvbynefhqmyzjtccttl.supabase.co',KEY='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';const prices={20:270,25:300,30:340,35:380,40:430,45:450,50:480,55:520,60:570};const $=id=>document.getElementById(id);function cleanPhone(v){return String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'')}function validPhone(v){return /^01[0125][0-9]{8}$/.test(v)}function showRegister(){$('home').style.display='none';$('registerPanel').style.display='block'}function backHome(){$('home').style.display='block';$('registerPanel').style.display='none';clearMessages()}function goRenew(){location.href='renew.html'}function updatePrice(){const gb=Number($('packageName').value);$('price').textContent=prices[gb]?prices[gb].toLocaleString('ar-EG')+' جنيه':'اختار الباقة أولًا'}function clearMessages(){$('successMessage').style.display='none';$('errorMessage').style.display='none';$('renewButton').style.display='none'}function msg(type,text){const el=$(type==='error'?'errorMessage':'successMessage');el.textContent=(type==='error'?'❌ ':'')+text;el.style.display='block'}function existingCustomer(){clearMessages();const el=$('successMessage');el.className='message warning';el.textContent='⚠️ الرقم ده مسجل عندنا بالفعل كعميل حالي. مش محتاج تسجل من جديد، استخدم تجديد الاشتراك.';el.style.display='block';$('renewButton').style.display='block'}async function rpc(body){const r=await fetch(URL+'/rest/v1/rpc/register_public_customer',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch{}if(!r.ok){const detail=JSON.stringify(d||text||'').toLowerCase();if(r.status===409||detail.includes('duplicate key')||detail.includes('customers_phone_key')||detail.includes('already exists')){const e=new Error('EXISTING_CUSTOMER');e.code='EXISTING_CUSTOMER';throw e}throw new Error(d?.message||d?.details||d?.hint||text||'حدث خطأ أثناء التسجيل')}return d}async function registerCustomer(){clearMessages();$('successMessage').className='message success';const name=$('customerName').value.trim(),phone=cleanPhone($('customerPhone').value),gb=Number($('packageName').value),renewalType=$('renewalType').value;if(name.length<2)return msg('error','اكتب اسمك');if(!validPhone(phone))return msg('error','اكتب رقم موبايل مصري صحيح مكون من 11 رقم');if(!prices[gb])return msg('error','اختار الباقة');if(!['day_1','day_16'].includes(renewalType))return msg('error','اختار موعد التجديد');const b=$('submitButton');b.disabled=true;b.textContent='⏳ جاري تسجيل البيانات...';try{await rpc({p_name:name,p_phone:phone,p_package_gb:gb,p_renewal_type:renewalType});msg('success','تم تسجيل بياناتك بنجاح. هنراجع البيانات ونتابع معاك الاشتراك.');$('customerName').value='';$('customerPhone').value='';$('packageName').value='';$('renewalType').value='';$('price').textContent='اختار الباقة أولًا'}catch(e){if(e.code==='EXISTING_CUSTOMER')existingCustomer();else msg('error',e.message)}finally{b.disabled=false;b.textContent='✅ تسجيل البيانات'}}
</script></body></html>
