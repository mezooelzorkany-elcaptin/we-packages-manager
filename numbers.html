<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>الأرقام الأساسية | WE Packages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(circle at 100% 0%,#9b63ed 0%,transparent 38%),
        linear-gradient(135deg,#f1eef9,#ded5f0,#d2c6e8);
    min-height:100vh;
    color:#19182d;
}

button,input{
    font-family:inherit;
}

.container{
    width:94%;
    max-width:1050px;
    margin:auto;
    padding:18px 0 60px;
}

/* HEADER */

.navigation{
    margin-bottom:12px;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 17px;
    border-radius:15px;
    background:#e8ddff;
    color:#5420b8;
    text-decoration:none;
    font-weight:bold;
}

.header{
    text-align:center;
    padding:24px 18px;
    margin-bottom:15px;
    background:rgba(255,255,255,.8);
    border-radius:25px;
    box-shadow:0 12px 35px rgba(60,35,120,.1);
}

.header h1{
    margin:0 0 7px;
    color:#5420b8;
    font-size:29px;
}

.header p{
    margin:0;
    color:#777;
}

/* TOP */

.top-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:15px;
}

.top-action{
    height:55px;
    border:0;
    border-radius:17px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.add-number-btn{
    background:linear-gradient(135deg,#5420b8,#9747ff);
    color:white;
}

.refresh-btn{
    background:white;
    color:#5420b8;
    border:2px solid #e5dcf7;
}

/* SEARCH */

.search-box{
    background:rgba(255,255,255,.8);
    border-radius:20px;
    padding:13px;
    margin-bottom:15px;
}

.search{
    width:100%;
    height:50px;
    border:2px solid #e4dff0;
    border-radius:15px;
    padding:0 16px;
    font-size:16px;
    outline:none;
}

/* GROUP */

.group{
    margin-bottom:14px;
    border-radius:23px;
    overflow:hidden;
    background:rgba(255,255,255,.8);
    box-shadow:0 10px 30px rgba(60,35,120,.1);
}

.group-header{
    width:100%;
    border:0;
    background:white;
    min-height:72px;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    text-align:right;
}

.group-info{
    display:flex;
    align-items:center;
    gap:13px;
}

.group-icon{
    width:45px;
    height:45px;
    border-radius:14px;
    background:#eee4ff;
    color:#5420b8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.group-title{
    font-size:19px;
    font-weight:900;
}

.group-count{
    color:#888;
    font-size:13px;
    margin-top:3px;
}

.arrow{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#f1ecfa;
    color:#5420b8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    transition:.25s;
}

.group.open .arrow{
    transform:rotate(180deg);
}

.group-content{
    display:none;
    padding:0 12px 12px;
}

.group.open .group-content{
    display:block;
}

/* NUMBER CARD */

.number-card{
    background:#fdfcff;
    border:1px solid #eee8f7;
    border-radius:20px;
    padding:17px;
    margin-top:10px;
}

.number-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.number{
    color:#5420b8;
    font-size:22px;
    font-weight:900;
    direction:ltr;
}

.status{
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status.active{
    background:#dff8e8;
    color:#08752d;
}

.status.inactive{
    background:#ffe3e3;
    color:#a00000;
}

/* PACKAGE SUMMARY */

.package-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.package-box{
    background:#f5f1fc;
    border-radius:17px;
    padding:15px;
    text-align:center;
}

.package-box small{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:7px;
}

.package-box strong{
    font-size:20px;
    color:#5420b8;
}

.package-box.remaining strong{
    color:#08752d;
}

.package-box.used strong{
    color:#d97706;
}

/* CUSTOMERS */

.customer-summary{
    margin-top:14px;
    background:#f5f1fc;
    border-radius:17px;
    padding:14px;
}

.customer-summary-title{
    font-size:14px;
    color:#777;
    font-weight:bold;
    margin-bottom:10px;
}

.customer-count{
    display:inline-flex;
    background:#e8ddff;
    color:#5420b8;
    border-radius:12px;
    padding:8px 11px;
    font-weight:900;
    margin-bottom:10px;
}

.customers-list{
    display:grid;
    gap:8px;
}

.customer-row{
    background:white;
    border-radius:13px;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.customer-name{
    font-weight:bold;
}

.customer-phone{
    color:#777;
    font-size:13px;
    margin-top:5px;
    direction:ltr;
    text-align:right;
}

.customer-gb{
    background:#eee4ff;
    color:#5420b8;
    padding:8px 10px;
    border-radius:10px;
    font-weight:bold;
    white-space:nowrap;
}

.no-customers{
    color:#999;
    padding:8px 0;
}

/* DETAILS */

.number-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:13px;
}

.detail{
    background:#f7f6fa;
    border-radius:13px;
    padding:11px;
}

.detail-title{
    font-size:11px;
    color:#888;
    margin-bottom:5px;
}

.detail-value{
    font-weight:bold;
}

/* BUTTONS */

.number-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:13px;
}

.number-action{
    height:45px;
    border:0;
    border-radius:13px;
    font-weight:bold;
    cursor:pointer;
}

.edit-btn{
    background:#e8ddff;
    color:#5420b8;
}

.delete-btn{
    background:#ffe1e1;
    color:#a00000;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:28px 15px;
    color:#777;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(20,15,35,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:9999;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:94vh;
    overflow:auto;
    background:white;
    border-radius:25px;
    padding:22px;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modal-head h2{
    margin:0;
    color:#5420b8;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:#f0eef4;
    cursor:pointer;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-weight:bold;
    font-size:13px;
    color:#555;
    margin-bottom:7px;
}

.field input{
    width:100%;
    height:50px;
    border:2px solid #e4e0eb;
    border-radius:14px;
    padding:0 14px;
    font-size:16px;
    outline:none;
}

.hint{
    color:#888;
    font-size:12px;
    margin-top:6px;
}

.quick-options,
.status-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.quick-option,
.status-option{
    min-height:50px;
    border:2px solid #e4e0eb;
    background:#faf9fc;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
}

.quick-option.selected{
    border-color:#5420b8;
    background:#eee4ff;
    color:#5420b8;
}

.status-option.selected.active-option{
    border-color:#1a9b4a;
    background:#e4f8ec;
    color:#08752d;
}

.status-option.selected.inactive-option{
    border-color:#c73542;
    background:#fde8ea;
    color:#a00000;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.save,
.cancel{
    height:50px;
    border:0;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
}

.save{
    background:#5420b8;
    color:white;
}

.cancel{
    background:#eee;
}

.message{
    text-align:center;
    font-weight:bold;
    margin-top:12px;
}

/* TOAST */

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#24203a;
    color:white;
    padding:13px 20px;
    border-radius:15px;
    z-index:10000;
    opacity:0;
    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:600px){

    .top-actions{
        grid-template-columns:1fr;
    }

    .package-summary{
        grid-template-columns:1fr 1fr;
    }

    .customer-row{
        align-items:flex-start;
    }

    .number-details{
        grid-template-columns:1fr 1fr;
    }

    .modal-actions{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="navigation">

        </a>

    <div class="header">

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let numbers = [];

let customers = [];

let selectedGroup = 1;

let selectedStatus = "active";


/* =====================================================
   LOAD
===================================================== */

async function loadData(){

    document.getElementById("content1").innerHTML =
        `<div class="empty">⏳ جاري تحميل البيانات...</div>`;

    document.getElementById("content16").innerHTML =
        `<div class="empty">⏳ جاري تحميل البيانات...</div>`;


    try{

        const numbersResult =
            await supabaseClient
                .from("primary_numbers")
                .select("*")
                .order("id",{ascending:false});


        if(numbersResult.error)
            throw numbersResult.error;


        numbers =
            Array.isArray(numbersResult.data)
            ? numbersResult.data
            : [];


        const customersResult =
            await supabaseClient
                .from("customers")
                .select(
    "subscriber_name,internal_name,phone,primary_number,allocated_gb,deleted_at"
)
                .is("deleted_at",null);


        if(customersResult.error){

            console.error(
                customersResult.error
            );

            customers = [];

        }else{

            customers =
                Array.isArray(
                    customersResult.data
                )
                ?
                customersResult.data
                :
                [];

        }


        renderNumbers();

    }
    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        const html =
        `
        <div class="empty">

            ❌ حصل خطأ في تحميل البيانات

            <br><br>

            ${escapeHtml(error.message)}

        </div>
        `;


        document.getElementById(
            "content1"
        ).innerHTML = html;


        document.getElementById(
            "content16"
        ).innerHTML = html;

    }

}


/* =====================================================
   GROUP
===================================================== */

function getGroup(number){

    const notes =
        String(number.notes || "");


    const match =
        notes.match(
            /\[GROUP:(1|16)\]/
        );


    return match
        ? Number(match[1])
        : 1;

}


/* =====================================================
   TOTAL PACKAGE GB
===================================================== */

/*
   إجمالي الباقة بيتخزن داخل notes
   بالشكل:

   [GROUP:1] [TOTAL_GB:200]

   وده عشان مش محتاجين نضيف عمود جديد
   في قاعدة البيانات.
*/

function getTotalGB(number){

    const notes =
        String(number.notes || "");


    const match =
        notes.match(
            /\[TOTAL_GB:([0-9]+(?:\.[0-9]+)?)\]/
        );


    if(!match)
        return 0;


    const value =
        Number(match[1]);


    return Number.isFinite(value)
        ? value
        : 0;

}


/* =====================================================
   CLEAN NOTES
===================================================== */

function getCleanNotes(number){

    return String(
        number.notes || ""
    )
    .replace(
        /\[GROUP:(1|16)\]\s*/g,
        ""
    )
    .replace(
        /\[TOTAL_GB:[0-9]+(?:\.[0-9]+)?\]\s*/g,
        ""
    )
    .trim();

}


/* =====================================================
   BUILD NOTES
===================================================== */

function buildNotes(
    notes,
    group,
    totalGB
){

    const clean =
        String(notes || "")
        .replace(
            /\[GROUP:(1|16)\]\s*/g,
            ""
        )
        .replace(
            /\[TOTAL_GB:[0-9]+(?:\.[0-9]+)?\]\s*/g,
            ""
        )
        .trim();


    let result =
        `[GROUP:${group}] [TOTAL_GB:${totalGB}]`;


    if(clean)
        result += " " + clean;


    return result;

}


/* =====================================================
   LINKED CUSTOMERS
===================================================== */

function getLinkedCustomers(
    primaryNumber
){

    const primary =
        cleanPhone(primaryNumber);


    if(!primary)
        return [];


    return customers.filter(
        customer => {

            return (
                cleanPhone(
                    customer.primary_number
                ) === primary
            );

        }
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderNumbers(){

    const search =
        String(
            document.getElementById(
                "search"
            ).value || ""
        )
        .trim()
        .toLowerCase();


    const filtered =
        numbers.filter(
            number => {

                const linked =
                    getLinkedCustomers(
                        number.phone
                    );


                const customerText =
                    linked
                    .map(
                        c =>
                        `${c.subscriber_name || ""} ${c.phone || ""}`
                    )
                    .join(" ")
                    .toLowerCase();


                const phone =
                    String(
                        number.phone || ""
                    )
                    .toLowerCase();


                const notes =
                    getCleanNotes(
                        number
                    )
                    .toLowerCase();


                return (
                    !search ||
                    phone.includes(search) ||
                    notes.includes(search) ||
                    customerText.includes(search)
                );

            }
        );


    const day1 =
        filtered.filter(
            n => getGroup(n) === 1
        );


    const day16 =
        filtered.filter(
            n => getGroup(n) === 16
        );


    document.getElementById(
        "count1"
    ).textContent =
        `${day1.length} ${day1.length === 1 ? "رقم" : "أرقام"}`;


    document.getElementById(
        "count16"
    ).textContent =
        `${day16.length} ${day16.length === 1 ? "رقم" : "أرقام"}`;


    renderGroup(
        "content1",
        day1
    );


    renderGroup(
        "content16",
        day16
    );

}


/* =====================================================
   RENDER GROUP
===================================================== */

function renderGroup(
    elementId,
    list
){

    const element =
        document.getElementById(
            elementId
        );


    if(!list.length){

        element.innerHTML =
        `
        <div class="empty">

            <div style="font-size:35px">
                📭
            </div>

            لا توجد أرقام هنا

        </div>
        `;

        return;

    }


    element.innerHTML =
        list.map(
            renderNumberCard
        ).join("");

}


/* =====================================================
   NUMBER CARD
===================================================== */

function renderNumberCard(
    number
){

    const linked =
        getLinkedCustomers(
            number.phone
        );


    const totalGB =
        getTotalGB(number);


    const distributedGB =
        linked.reduce(
            (sum,customer) => {

                const gb =
                    Number(
                        customer.allocated_gb
                    ) || 0;


                return sum + gb;

            },
            0
        );


    const remainingGB =
        Math.max(

</div>

${

/* =====================================================
   ADD
===================================================== */

function openAddModal(){

    document.getElementById(
        "modalTitle"
    ).textContent =
        "➕ إضافة رقم";


    document.getElementById(
        "editId"
    ).value = "";


    document.getElementById(
        "phoneInput"
    ).value = "";


    document.getElementById(
        "totalGBInput"
    ).value = "";


    document.getElementById(
        "notesInput"
    ).value = "";


    selectGroup(1);

    selectStatus("active");


    document.getElementById(
        "modalMessage"
    ).textContent = "";


    document.getElementById(
        "numberModal"
    ).classList.add("show");

}


/* =====================================================
   EDIT
===================================================== */

function openEdit(id){

    const number =
        numbers.find(
            n =>
            Number(n.id) ===
            Number(id)
        );


    if(!number){

        showToast(
            "❌ الرقم غير موجود"
        );

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "✏️ تعديل الرقم";


    document.getElementById(
        "editId"
    ).value =
        number.id;


    document.getElementById(
        "phoneInput"
    ).value =
        number.phone || "";


    document.getElementById(
        "totalGBInput"
    ).value =
        getTotalGB(number) || "";


    document.getElementById(
        "notesInput"
    ).value =
        getCleanNotes(number);


    selectGroup(
        getGroup(number)
    );


    selectStatus(
        number.is_active === false
        ? "inactive"
        : "active"
    );


    document.getElementById(
        "modalMessage"
    ).textContent = "";


    document.getElementById(
        "numberModal"
    ).classList.add("show");

}


/* =====================================================
   GROUP
===================================================== */

function selectGroup(group){

    selectedGroup =
        Number(group) === 16
        ? 16
        : 1;


    document.getElementById(
        "groupDay1Btn"
    ).classList.toggle(
        "selected",
        selectedGroup === 1
    );


    document.getElementById(
        "groupDay16Btn"
    ).classList.toggle(
        "selected",
        selectedGroup === 16
    );

}


/* =====================================================
   STATUS
===================================================== */

function selectStatus(status){

    selectedStatus =
        status === "inactive"
        ? "inactive"
        : "active";


    document.getElementById(
        "activeBtn"
    ).classList.toggle(
        "selected",
        selectedStatus === "active"
    );


    document.getElementById(
        "inactiveBtn"
    ).classList.toggle(
        "selected",
        selectedStatus === "inactive"
    );

}


/* =====================================================
   SAVE
===================================================== */

async function saveNumber(){

    const message =
        document.getElementById(
            "modalMessage"
        );


    let phone =
        cleanPhone(
            document.getElementById(
                "phoneInput"
            ).value
        );


    const totalGB =
        Number(
            document.getElementById(
                "totalGBInput"
            ).value
        );


    const notes =
        document.getElementById(
            "notesInput"
        ).value.trim();


    const editId =
        document.getElementById(
            "editId"
        ).value;


    if(
        !/^01[0125][0-9]{8}$/.test(phone)
    ){

        message.style.color =
            "#a00000";

        message.textContent =
            "❌ اكتب رقم مصري صحيح مكون من 11 رقم";

        return;

    }


    if(
        !Number.isFinite(totalGB) ||
        totalGB <= 0
    ){

        message.style.color =
            "#a00000";

        message.textContent =
            "❌ اكتب إجمالي الباقة بالجيجا";

        return;

    }


    message.style.color =
        "#555";

    message.textContent =
        "⏳ جاري الحفظ...";


    try{

        const savedNotes =
            buildNotes(
                notes,
                selectedGroup,
                totalGB
            );


        const payload = {

            phone:phone,

            notes:savedNotes,

            is_active:
                selectedStatus === "active"

        };


        /* EDIT */

        if(editId){

            const result =
                await supabaseClient
                    .from("primary_numbers")
                    .update(payload)
                    .eq("id",editId);


            if(result.error){

                if(
                    result.error.code === "23505"
                ){

                    throw new Error(
                        "الرقم موجود بالفعل."
                    );

                }

                throw result.error;

            }


            showToast(
                "✅ تم تعديل الرقم وإجمالي الباقة"
            );

        }


        /* ADD */

        else{

            const existing =
                await supabaseClient
                    .from("primary_numbers")
                    .select("id")
                    .eq("phone",phone)
                    .limit(1);


            if(existing.error)
                throw existing.error;


            if(
                existing.data &&
                existing.data.length
            ){

                throw new Error(
                    "الرقم موجود بالفعل."
                );

            }


            const result =
                await supabaseClient
                    .from("primary_numbers")
                    .insert(payload);


            if(result.error){

                if(
                    result.error.code === "23505"
                ){

                    throw new Error(
                        "الرقم موجود بالفعل."
                    );

                }

                throw result.error;

            }


            showToast(
                "✅ تم إضافة الرقم"
            );

        }


        await loadData();

        closeModal();


    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        message.style.color =
            "#a00000";

        message.textContent =
            "❌ " +
            error.message;

    }

}


/* =====================================================
   DELETE
===================================================== */

async function deleteNumber(id){

    const number =
        numbers.find(
            n =>
            Number(n.id) ===
            Number(id)
        );


    if(!number)
        return;


    const linked =
        getLinkedCustomers(
            number.phone
        );


    if(linked.length){

        alert(
            "⚠️ لا يمكن حذف الرقم الآن.\n\n" +
            "الرقم مرتبط بـ " +
            linked.length +
            " عميل.\n\n" +
            "انقل العملاء لرقم آخر أولًا."
        );

        return;

    }


    if(
        !confirm(
            "⚠️ حذف الرقم\n\n" +
            number.phone +
            "\n\nهل أنت متأكد؟"
        )
    ){

        return;

    }


    try{

        const result =
            await supabaseClient
                .from("primary_numbers")
                .delete()
                .eq("id",id);


        if(result.error)
            throw result.error;


        showToast(
            "✅ تم حذف الرقم"
        );


        await loadData();

    }
    catch(error){

        alert(
            "❌ لم يتم حذف الرقم:\n\n" +
            error.message
        );

    }

}


/* =====================================================
   CLOSE
===================================================== */

function closeModal(){

    document.getElementById(
        "numberModal"
    ).classList.remove("show");

}


/* =====================================================
   GROUP TOGGLE
===================================================== */

function toggleGroup(id){

    document.getElementById(
        id
    ).classList.toggle("open");

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderNumbers
    );


/* =====================================================
   HELPERS
===================================================== */

function cleanPhone(value){

    return normalizeArabicNumbers(value)
        .replace(/\D/g,"");

}


function normalizeArabicNumbers(value){

    return String(value || "")
        .replace(
            /[٠-٩]/g,
            d =>
            "٠١٢٣٤٥٦٧٨٩".indexOf(d)
        );

}


function formatGB(value){

    const n =
        Number(value) || 0;


    if(Number.isInteger(n))
        return String(n);


    return n.toFixed(2);

}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.classList.add("show");


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {
                toast.classList.remove("show");
            },
            2500
        );

}


/* =====================================================
   CLOSE OUTSIDE
===================================================== */

document
    .getElementById("numberModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){
                closeModal();
            }

        }
    );


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){
            closeModal();
        }

    }
);


/* =====================================================
   START
===================================================== */

loadData();

</script>
