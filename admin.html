<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WE Packages - الأكواد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;min-height:100vh;background:radial-gradient(circle at 100% 0%,#a568f0 0%,transparent 38%),linear-gradient(135deg,#f2effb,#ded5f0,#d2c6e8);color:#19182d}
.container{width:92%;max-width:900px;margin:auto;padding:30px 0 70px}
.glass{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:26px;backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(60,35,120,.13)}
input,select{width:100%;padding:15px;margin-bottom:14px;border:1px solid #ddd;border-radius:15px;outline:none;background:#fff;font-size:16px}
button{border:0;cursor:pointer;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:bold}
.add-btn,.save-edit{width:100%;color:#fff;background:linear-gradient(135deg,#5420b8,#9747ff)}
.header{text-align:center;padding:28px;margin-bottom:22px}
.header h1{margin:0 0 8px;color:#5420b8;font-size:32px}
.header p{margin:0;color:#707080}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px;margin-bottom:22px}
.topbar h2{margin:0;color:#5420b8}
.customers-navigation{display:flex;justify-content:flex-start;margin-bottom:14px}
.customers-top-btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 24px;border-radius:15px;background:#e8ddff;color:#5420b8;text-decoration:none;font-size:17px;font-weight:bold;border:1px solid rgba(84,32,184,.12)}
.form-box,.edit-box{padding:25px;margin-bottom:25px}
.form-box h3,.edit-box h3{margin-top:0;color:#5420b8}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.edit-box{display:none;border:2px solid rgba(117,68,207,.2)}
.edit-buttons,.actions{display:flex;gap:10px;flex-wrap:wrap}
.save-edit,.cancel-edit{flex:1}
.cancel-edit{background:#eee;color:#333}
.codes{display:grid;gap:18px}
.code-card{padding:23px}
.code-name{font-size:26px;font-weight:900;color:#5420b8;margin-bottom:12px}
.info{line-height:2;color:#555}
.usage{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:12px;background:#f0e7ff;color:#5420b8;font-weight:bold}
.usage.finished{background:#ffe0e0;color:#a00000}
.badge{display:inline-block;padding:6px 13px;border-radius:50px;font-size:13px;font-weight:bold}
.active{background:#d9fbe5;color:#08752d}
.inactive{background:#ffe0e0;color:#a00000}
.expired{background:#fff0d5;color:#9a5a00}
.actions button{flex:1;min-width:110px}
.edit{background:#e8ddff;color:#5420b8}
.toggle{background:#e5f5ff;color:#126c9e}
.delete{background:#ffe2e2;color:#a00000}
.empty{text-align:center;padding:40px;color:#777}
.message{text-align:center;margin-top:14px;font-weight:bold;line-height:1.7}
@media(max-width:600px){
.row{grid-template-columns:1fr}
.topbar{flex-direction:column}
.topbar button{width:100%}
.actions,.edit-buttons{flex-direction:column}
.actions button{width:100%}
}
</style>
</head>

<body>

<div class="container">

<div class="customers-navigation">
<a href="customers.html" class="customers-top-btn">
👥 العملاء
</a>
</div>

<div class="header glass">
<h1>WE Packages 💜</h1>
<p>إدارة أكواد الخصم</p>
</div>

<div class="topbar glass">
<h2>🎟️ الأكواد</h2>
</div>

<div class="form-box glass">

<h3>➕ إضافة كود جديد</h3>

<input
type="text"
id="newCode"
placeholder="مثال: MEZOO30"
>

<div class="row">

<select id="newType">
<option value="percent">نسبة مئوية %</option>
<option value="fixed">مبلغ ثابت جنيه</option>
</select>

<input
type="number"
id="newValue"
placeholder="قيمة الخصم"
min="1"
>

</div>

<div class="row">

<input
type="number"
id="newMaxUses"
placeholder="عدد مرات الاستخدام"
min="1"
value="1"
>

<input
type="datetime-local"
id="newExpiry"
>

</div>

<small style="display:block;color:#777;margin:-5px 0 15px">
عدد مرات الاستخدام + تاريخ الانتهاء
</small>

<button
class="add-btn"
onclick="addCode()"
>
إضافة الكود
</button>

<div
id="formMessage"
class="message"
></div>

</div>


<div
id="editBox"
class="edit-box glass"
>

<h3>✏️ تعديل الكود</h3>

<input
type="hidden"
id="editId"
>

<input
type="text"
id="editCode"
placeholder="اسم الكود"
>

<div class="row">

<select id="editType">
<option value="percent">نسبة مئوية %</option>
<option value="fixed">مبلغ ثابت جنيه</option>
</select>

<input
type="number"
id="editValue"
placeholder="قيمة الخصم"
min="1"
>

</div>

<div class="row">

<input
type="number"
id="editMaxUses"
placeholder="عدد مرات الاستخدام"
min="1"
>

<input
type="datetime-local"
id="editExpiry"
>

</div>

<div
style="
margin:5px 0 15px;
padding:12px;
border-radius:12px;
background:#f0e7ff;
color:#5420b8;
font-weight:bold;
text-align:center;
"
>
📊 الاستخدام الحالي:
<span id="editUsedCount">0</span>
</div>

<div class="edit-buttons">

<button
class="save-edit"
onclick="saveEdit()"
>
حفظ التعديل
</button>

<button
class="cancel-edit"
onclick="cancelEdit()"
>
إلغاء
</button>

</div>

<div
id="editMessage"
class="message"
></div>

</div>


<div
id="codesList"
class="codes"
></div>

</div>


<script>

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


function escapeHtml(value){

return String(value??"")
.replace(
/[&<>"']/g,
c =>
({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);

}


async function loadCodes(){

const list =
document.getElementById(
"codesList"
);

list.innerHTML =
'<div class="empty glass">⏳ جاري تحميل الأكواد...</div>';

try{

const result =
await supabaseClient
.from("promo_codes")
.select("*")
.order(
"id",
{ascending:false}
);

if(result.error)
throw result.error;

const data =
result.data || [];

if(!data.length){

list.innerHTML =
'<div class="empty glass">لا توجد أكواد حتى الآن 🎟️</div>';

return;

}

list.innerHTML = "";

data.forEach(
code => {

const card =
document.createElement(
"div"
);

card.className =
"code-card glass";


const maxUses =
Number(code.max_uses)||1;

const usedCount =
Number(code.used_count)||0;

const remaining =
Math.max(
maxUses-usedCount,
0
);

const finished =
usedCount>=maxUses;


let expiryText =
"بدون تاريخ انتهاء";

let expired =
false;


if(code.expires_at){

const expiry =
new Date(
code.expires_at
);

expiryText =
expiry.toLocaleString(
"ar-EG"
);

expired =
expiry<=new Date();

}


let statusText;
let statusClass;


if(expired){

statusText =
"🟠 منتهي";

statusClass =
"expired";

}
else if(finished){

statusText =
"🔴 انتهت الاستخدامات";

statusClass =
"inactive";

}
else if(code.is_active){

statusText =
"🟢 فعال";

statusClass =
"active";

}
else{

statusText =
"🔴 متوقف";

statusClass =
"inactive";

}


const discount =
code.discount_type==="percent"

?
Number(
code.discount_value
)+"%"

:
Number(
code.discount_value
)+" جنيه";


card.innerHTML = `

<div class="code-name">
${escapeHtml(code.code)}
</div>

<div class="info">

💰 الخصم:
<strong>
${escapeHtml(discount)}
</strong>

<br>

🔢 الاستخدامات:
<strong>
${usedCount} / ${maxUses}
</strong>

<br>

🟣 المتبقي:
<strong>
${remaining}
</strong>

<div class="${
finished
?
"usage finished"
:
"usage"
}">

${
finished
?
"❌ انتهت كل الاستخدامات"
:
"✅ متبقي "+remaining+" استخدام"
}

</div>

<br>

📅 الانتهاء:
<strong>
${escapeHtml(expiryText)}
</strong>

<br><br>

<span
class="badge ${statusClass}"
>
${statusText}
</span>

</div>

<div class="actions">

<button
class="edit"
onclick="openEdit(${Number(code.id)})"
>
✏️ تعديل
</button>

<button
class="toggle"
onclick="toggleCode(
${Number(code.id)},
${!!code.is_active}
)"
>
${
code.is_active
?
"⏸️ إيقاف"
:
"▶️ تفعيل"
}
</button>

<button
class="delete"
onclick="deleteCode(${Number(code.id)})"
>
🗑️ حذف
</button>

</div>

`;

list.appendChild(card);

});

}
catch(error){

list.innerHTML =
'<div class="empty glass">❌ حصل خطأ<br><br>'+
escapeHtml(error.message)+
'</div>';

}

}


async function addCode(){

const message =
document.getElementById(
"formMessage"
);

const code =
document.getElementById(
"newCode"
)
.value
.trim()
.toUpperCase();

const type =
document.getElementById(
"newType"
).value;

const value =
Number(
document.getElementById(
"newValue"
).value
);

const maxUses =
Number(
document.getElementById(
"newMaxUses"
).value
);

const expiry =
document.getElementById(
"newExpiry"
).value;


if(
!code||
!value||
value<1||
!maxUses||
maxUses<1
){

message.style.color =
"#b00020";

message.textContent =
"❌ اكتب كل البيانات المطلوبة";

return;

}


try{

const result =
await supabaseClient
.from("promo_codes")
.insert({

code:code,

discount_type:type,

discount_value:value,

max_uses:maxUses,

used_count:0,

expires_at:
expiry
?
new Date(
expiry
).toISOString()
:
null,

is_active:true

});


if(result.error)
throw result.error;


message.style.color =
"#08752d";

message.textContent =
"✅ تم إضافة الكود";


document.getElementById(
"newCode"
).value = "";

document.getElementById(
"newValue"
).value = "";

document.getElementById(
"newMaxUses"
).value = "1";

document.getElementById(
"newExpiry"
).value = "";


loadCodes();


}
catch(error){

message.style.color =
"#b00020";

message.textContent =
"❌ "+error.message;

}

}


function toLocalInput(value){

if(!value)
return "";

const d =
new Date(value);

if(
Number.isNaN(
d.getTime()
)
)
return "";

const pad =
n =>
String(n)
.padStart(2,"0");

return (
d.getFullYear()+
"-"+
pad(d.getMonth()+1)+
"-"+
pad(d.getDate())+
"T"+
pad(d.getHours())+
":"+
pad(d.getMinutes())
);

}


async function openEdit(id){

const result =
await supabaseClient
.from("promo_codes")
.select("*")
.eq("id",id)
.single();


if(
result.error||
!result.data
){

alert(
"❌ تعذر تحميل الكود"
);

return;

}


const data =
result.data;


document.getElementById(
"editId"
).value =
data.id;

document.getElementById(
"editCode"
).value =
data.code||"";

document.getElementById(
"editType"
).value =
data.discount_type||
"percent";

document.getElementById(
"editValue"
).value =
data.discount_value??"";

document.getElementById(
"editMaxUses"
).value =
data.max_uses??1;

document.getElementById(
"editExpiry"
).value =
toLocalInput(
data.expires_at
);

document.getElementById(
"editUsedCount"
).textContent =
data.used_count||0;

document.getElementById(
"editMessage"
).textContent =
"";


const box =
document.getElementById(
"editBox"
);

box.style.display =
"block";

box.scrollIntoView({
behavior:"smooth",
block:"start"
});

}


function cancelEdit(){

document.getElementById(
"editBox"
).style.display =
"none";

document.getElementById(
"editMessage"
).textContent =
"";

}


async function saveEdit(){

const message =
document.getElementById(
"editMessage"
);

const id =
Number(
document.getElementById(
"editId"
).value
);

const code =
document.getElementById(
"editCode"
).value
.trim()
.toUpperCase();

const type =
document.getElementById(
"editType"
).value;

const value =
Number(
document.getElementById(
"editValue"
).value
);

const maxUses =
Number(
document.getElementById(
"editMaxUses"
).value
);

const expiry =
document.getElementById(
"editExpiry"
).value;


if(
!id||
!code||
!value||
value<1||
!maxUses||
maxUses<1
){

message.style.color =
"#b00020";

message.textContent =
"❌ اكتب كل البيانات المطلوبة";

return;

}


const result =
await supabaseClient
.from("promo_codes")
.update({

code:code,

discount_type:type,

discount_value:value,

max_uses:maxUses,

expires_at:
expiry
?
new Date(
expiry
).toISOString()
:
null

})
.eq(
"id",
id
);


if(result.error){

message.style.color =
"#b00020";

message.textContent =
"❌ "+result.error.message;

return;

}


message.style.color =
"#08752d";

message.textContent =
"✅ تم حفظ التعديل";


await loadCodes();


setTimeout(
cancelEdit,
600
);

}


async function toggleCode(
id,
current
){

const result =
await supabaseClient
.from("promo_codes")
.update({
is_active:!current
})
.eq(
"id",
id
);


if(result.error){

alert(
"❌ "+result.error.message
);

return;

}


loadCodes();

}


async function deleteCode(id){

if(
!confirm(
"هل أنت متأكد من حذف هذا الكود؟"
)
)
return;


const result =
await supabaseClient
.from("promo_codes")
.delete()
.eq(
"id",
id
);


if(result.error){

alert(
"❌ "+result.error.message
);

return;

}


loadCodes();

}


loadCodes();

</script>

<script>

(function(){

  const currentPage =
    location.pathname
      .split("/")
      .pop()
      .toLowerCase();


  document
    .querySelectorAll(
      "#adminBottomNav a"
    )
    .forEach(function(link){

      const page =
        link
          .getAttribute("data-page")
          .toLowerCase();


      if(page === currentPage){

        link.classList.add(
          "active"
        );

      }

    });

})();

</script>
