<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const ADMIN_EMAIL =
"mezooelzorkany@gmail.com";



/* =========================
   LOGIN
========================= */

async function login(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    message.style.color =
        "#555";


    message.textContent =
        "⏳ جاري تسجيل الدخول...";


    const {
        data,
        error
    } =
    await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ البريد أو كلمة المرور غير صحيحة";

        return;

    }


    if(
        !data.user ||
        data.user.email !== ADMIN_EMAIL
    ){

        await supabaseClient.auth.signOut();

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ غير مسموح بهذا الحساب";

        return;

    }


    showAdmin();

}



/* =========================
   CHECK SESSION
========================= */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth
        .getSession();


    const session =
        data.session;


    if(
        session &&
        session.user &&
        session.user.email === ADMIN_EMAIL
    ){

        showAdmin();

    }

}



/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

    document.getElementById(
        "loginBox"
    ).style.display =
        "none";


    document.getElementById(
        "adminPanel"
    ).style.display =
        "block";


    loadCodes();

}



/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}



/* =========================
   LOAD CODES
========================= */

async function loadCodes(){

    const list =
        document.getElementById(
            "codesList"
        );


    list.innerHTML =
        '<div class="empty glass">⏳ جاري تحميل الأكواد...</div>';


    const {
        data,
        error
    } =
    await supabaseClient
        .from("promo_codes")
        .select("*")
        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML =
        `<div class="empty glass">

            ❌ حصل خطأ

            <br>

            ${escapeHtml(error.message)}

        </div>`;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        list.innerHTML =
        `<div class="empty glass">

            لا توجد أكواد حتى الآن 🎟️

        </div>`;

        return;

    }


    list.innerHTML = "";


    data.forEach(
        function(code){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "code-card glass";


            const discount =
                code.discount_type === "percent"

                ? code.discount_value + "%"

                : code.discount_value + " جنيه";


            const maxUses =
                Number(code.max_uses) || 1;


            const usedCount =
                Number(code.used_count) || 0;


            const remaining =
                Math.max(
                    maxUses - usedCount,
                    0
                );


            const usesFinished =
                usedCount >= maxUses;


            let expiryText =
                "بدون تاريخ انتهاء";


            let expired =
                false;


            if(code.expires_at){

                const expiry =
                    new Date(
                        code.expires_at
                    );


                expiryText =
                    expiry.toLocaleString(
                        "ar-EG"
                    );


                if(
                    expiry <= new Date()
                ){

                    expired = true;

                }

            }


            let statusText;

            let statusClass;


            if(expired){

                statusText =
                    "🟠 منتهي";

                statusClass =
                    "expired";

            }

            else if(usesFinished){

                statusText =
                    "🔴 انتهت الاستخدامات";

                statusClass =
                    "inactive";

            }

            else if(code.is_active){

                statusText =
                    "🟢 فعال";

                statusClass =
                    "active";

            }

            else{

                statusText =
                    "🔴 متوقف";

                statusClass =
                    "inactive";

            }


            const usageClass =
                usesFinished
                ? "usage finished"
                : "usage";


            card.innerHTML = `

                <div class="code-name">

                    ${escapeHtml(code.code)}

                </div>


                <div class="info">

                    💰 الخصم:

                    <strong>
                        ${discount}
                    </strong>


                    <br>


                    🔢 الاستخدامات:

                    <strong>
                        ${usedCount} / ${maxUses}
                    </strong>


                    <br>


                    🟣 المتبقي:

                    <strong>
                        ${remaining}
                    </strong>


                    <div class="${usageClass}">

                        ${usesFinished

                            ? "❌ انتهت كل الاستخدامات"

                            : "✅ متبقي " +
                              remaining +
                              " استخدام"

                        }

                    </div>


                    <br>


                    📅 الانتهاء:

                    <strong>
                        ${expiryText}
                    </strong>


                    <br><br>


                    <span
                        class="badge ${statusClass}"
                    >
                        ${statusText}
                    </span>

                </div>


                <div class="actions">

                    <button
                        class="edit"
                        onclick="openEdit(${code.id})"
                    >
                        ✏️ تعديل
                    </button>


                    <button
                        class="toggle"
                        onclick="toggleCode(
                            ${code.id},
                            ${code.is_active}
                        )"
                    >

                        ${code.is_active
                            ? "⏸️ إيقاف"
                            : "▶️ تفعيل"
                        }

                    </button>


                    <button
                        class="delete"
                        onclick="deleteCode(${code.id})"
                    >
                        🗑️ حذف
                    </button>

                </div>

            `;


            list.appendChild(card);

        }
    );

}



/* =========================
   ADD CODE
========================= */

async function addCode(){

    const code =
        document.getElementById(
            "newCode"
        ).value
        .trim()
        .toUpperCase();


    const type =
        document.getElementById(
            "newType"
        ).value;


    const value =
        Number(
            document.getElementById(
                "newValue"
            ).value
        );


    const maxUses =
        Number(
            document.getElementById(
                "newMaxUses"
            ).value
        );


    const expiry =
        document.getElementById(
            "newExpiry"
        ).value;


    const message =
        document.getElementById(
            "formMessage"
        );


    if(!code){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ اكتب الكود";

        return;

    }


    if(
        !value ||
        value <= 0
    ){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ اكتب قيمة خصم صحيحة";

        return;

    }


    if(
        type === "percent" &&
        value > 100
    ){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ النسبة لا يمكن أن تتجاوز 100%";

        return;

    }


    if(
        !maxUses ||
        maxUses < 1
    ){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ اكتب عدد استخدامات صحيح";

        return;

    }


    let expiresAt = null;


    if(expiry){

        const expiryDate =
            new Date(expiry);


        if(
            isNaN(
                expiryDate.getTime()
            )
        ){

            message.style.color =
                "#b00020";

            message.textContent =
                "❌ تاريخ الانتهاء غير صحيح";

            return;

        }


        expiresAt =
            expiryDate.toISOString();

    }


    const {
        error
    } =
    await supabaseClient
        .from("promo_codes")
        .insert({

            code:code,

            discount_type:type,

            discount_value:value,

            max_uses:maxUses,

            used_count:0,

            is_active:true,

            expires_at:expiresAt

        });


    if(error){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ " +
            error.message;

        return;

    }


    message.style.color =
        "#08752d";

    message.textContent =
        "✅ تم إضافة الكود";


    document.getElementById(
        "newCode"
    ).value = "";


    document.getElementById(
        "newValue"
    ).value = "";


    document.getElementById(
        "newMaxUses"
    ).value = "1";


    document.getElementById(
        "newExpiry"
    ).value = "";


    loadCodes();

}



/* =========================
   OPEN EDIT
========================= */

async function openEdit(id){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("promo_codes")
        .select("*")
        .eq(
            "id",
            id
        )
        .single();


    if(error){

        alert(
            "❌ حصل خطأ: " +
            error.message
        );

        return;

    }


    document.getElementById(
        "editId"
    ).value =
        data.id;


    document.getElementById(
        "editCode"
    ).value =
        data.code;


    document.getElementById(
        "editType"
    ).value =
        data.discount_type;


    document.getElementById(
        "editValue"
    ).value =
        data.discount_value;


    document.getElementById(
        "editMaxUses"
    ).value =
        data.max_uses || 1;


    document.getElementById(
        "editUsedCount"
    ).textContent =
        data.used_count || 0;


    if(data.expires_at){

        const date =
            new Date(
                data.expires_at
            );


        const localDate =
            new Date(
                date.getTime() -
                date.getTimezoneOffset() *
                60000
            )
            .toISOString()
            .slice(
                0,
                16
            );


        document.getElementById(
            "editExpiry"
        ).value =
            localDate;

    }

    else{

        document.getElementById(
            "editExpiry"
        ).value = "";

    }


    document.getElementById(
        "editBox"
    ).style.display =
        "block";


    document.getElementById(
        "editBox"
    ).scrollIntoView({

        behavior:"smooth",

        block:"center"

    });

}

   SAVE EDIT
========================= */

        );

    if(!code){

        message.style.color =

    if(

    ){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ النسبة لا يمكن أن تتجاوز 100%";

        return;

    }


    if(
        !maxUses ||
        maxUses < 1
    ){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ عدد الاستخدامات غير صحيح";

        return;

    }


    let expiresAt = null;


    if(expiry){

        const expiryDate =
            new Date(expiry);


        if(
            isNaN(
                expiryDate.getTime()
            )
        ){

            message.style.color =
                "#b00020";

            message.textContent =
                "❌ تاريخ الانتهاء غير صحيح";

            return;

        }


        expiresAt =
            expiryDate.toISOString();

    }


    /*
       مهم:
       لا نعدل used_count هنا.
       العدد المستخدم يفضل كما هو.
    */

    const {
        error
    } =
    await supabaseClient
        .from("promo_codes")
        .update({

            code:code,

            discount_type:type,

            discount_value:value,

            max_uses:maxUses,

            expires_at:expiresAt

        })
        .eq(
            "id",
            id
        );


    if(error){

        message.style.color =
            "#b00020";

        message.textContent =
            "❌ " +
            error.message;

        return;

    }


    message.style.color =
        "#08752d";

    message.textContent =
        "✅ تم حفظ التعديل";


    setTimeout(
        function(){

            cancelEdit();

            loadCodes();

        },
        700
    );

}



/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

    document.getElementById(
        "editBox"
    ).style.display =
        "none";


    document.getElementById(
        "editMessage"
    ).textContent =
        "";

}



/* =========================
   TOGGLE
========================= */

async function toggleCode(
    id,
    currentStatus
){

    const {
        error
    } =
    await supabaseClient
        .from("promo_codes")
        .update({

            is_active:
                !currentStatus

        })
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "❌ " +
            error.message
        );

        return;

    }


    loadCodes();

}



/* =========================
   DELETE
========================= */

async function deleteCode(id){

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا الكود؟"
        );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("promo_codes")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "❌ " +
            error.message
        );

        return;

    }


    loadCodes();

}



/* =========================
   SECURITY
========================= */

function escapeHtml(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
