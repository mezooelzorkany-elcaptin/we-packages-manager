<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة أكواد الخصم | WE Packages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at 100% 0%,#9b63ed 0%,transparent 38%),
    linear-gradient(135deg,#f0eef9,#ded5f0,#d1c5e8);
  min-height:100vh;
  color:#19182d;
}
.container{width:92%;max-width:900px;margin:auto;padding:30px 0 70px}
.glass{
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.85);
  border-radius:26px;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 45px rgba(60,35,120,.12);
}
#loginBox{max-width:500px;margin:70px auto;padding:35px 25px}
.login-title{text-align:center;font-size:28px;font-weight:900;color:#5420b8;margin-bottom:25px}
input,select{
  width:100%;padding:15px;margin-bottom:14px;border:1px solid #ddd;
  border-radius:15px;outline:none;background:#fff;font-size:16px;
}
input:focus,select:focus{
  border-color:#7544cf;
  box-shadow:0 0 0 3px rgba(117,68,207,.12)
}
button{
  border:none;
  cursor:pointer;
  border-radius:14px;
  padding:14px 18px;
  font-size:16px;
  font-weight:bold
}
.primary,.add-btn,.save-edit{
  color:#fff;
  background:linear-gradient(135deg,#5420b8,#9747ff)
}
.primary{width:100%}
.message{text-align:center;margin-top:14px;font-weight:bold}
#adminPanel{display:none}

.customers-navigation{
  width:100%;
  display:flex;
  justify-content:flex-start;
  margin-bottom:14px;
}
.customers-top-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 22px;
  border-radius:15px;
  background:#e8ddff;
  color:#5420b8;
  text-decoration:none;
  font-size:17px;
  font-weight:bold;
  border:1px solid rgba(84,32,184,.12);
  box-shadow:0 6px 18px rgba(84,32,184,.10);
  transition:.2s;
}
.customers-top-btn:hover{
  transform:translateY(-2px);
  opacity:.9
}

.header{
  text-align:center;
  padding:28px;
  margin-bottom:22px
}
.header h1{
  margin:0 0 8px;
  color:#5420b8;
  font-size:32px
}
.header p{
  margin:0;
  color:#707080
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:20px;
  margin-bottom:22px
}
.topbar h2{
  margin:0;
  color:#5420b8
}
.logout{
  background:#eee;
  color:#333
}
.form-box,.edit-box{
  padding:25px;
  margin-bottom:25px
}
.form-box h3,.edit-box h3{
  margin-top:0;
  color:#5420b8
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
.add-btn{
  width:100%
}
.edit-box{
  display:none;
  border:2px solid rgba(117,68,207,.2)
}
.edit-buttons{
  display:flex;
  gap:10px
}
.save-edit,.cancel-edit{
  flex:1
}
.cancel-edit{
  background:#eee;
  color:#333
}
.codes{
  display:grid;
  gap:18px
}
.code-card{
  padding:23px
}
.code-name{
  font-size:26px;
  font-weight:900;
  color:#5420b8;
  margin-bottom:12px
}
.info{
  line-height:2;
  color:#555
}
.usage{
  display:inline-block;
  margin-top:6px;
  padding:6px 12px;
  border-radius:12px;
  background:#f0e7ff;
  color:#5420b8;
  font-weight:bold
}
.usage.finished{
  background:#ffe0e0;
  color:#a00000
}
.badge{
  display:inline-block;
  padding:6px 13px;
  border-radius:50px;
  font-size:13px;
  font-weight:bold
}
.active{
  background:#d9fbe5;
  color:#08752d
}
.inactive{
  background:#ffe0e0;
  color:#a00000
}
.expired{
  background:#fff0d5;
  color:#9a5a00
}
.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap
}
.actions button{
  flex:1;
  min-width:110px
}
.edit{
  background:#e8ddff;
  color:#5420b8
}
.toggle{
  background:#e5f5ff;
  color:#126c9e
}
.delete{
  background:#ffe2e2;
  color:#a00000
}
.empty{
  text-align:center;
  padding:40px;
  color:#777
}

@media(max-width:600px){
  .container{width:94%}
  .row{
    grid-template-columns:1fr;
    gap:0
  }
  .topbar{
    flex-direction:column
  }
  .topbar button{
    width:100%
  }
  .header h1{
    font-size:27px
  }
  .actions,.edit-buttons{
    flex-direction:column
  }
  .actions button{
    width:100%
  }
  .customers-navigation{
    justify-content:flex-start
  }
}
</style>
</head>

<body>

<div class="container">

  <div id="loginBox" class="glass">

    <div class="login-title">
      🔐 لوحة إدارة الأكواد
    </div>

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني"
      value="mezooelzorkany@gmail.com"
    >

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور"
    >

    <button class="primary" onclick="login()">
      تسجيل الدخول
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <div id="adminPanel">

    <!-- زر العملاء فوق الأكواد -->
    <div class="customers-navigation">

      <a
        href="customers.html"
        class="customers-top-btn"
      >
        👥 العملاء
      </a>

    </div>


    <div class="header glass">

      <h1>
        WE Packages 💜
      </h1>

      <p>
        إدارة أكواد الخصم
      </p>

    </div>


    <div class="topbar glass">

      <h2>
        🎟️ الأكواد
      </h2>

      <button
        class="logout"
        onclick="logout()"
      >
        تسجيل الخروج
      </button>

    </div>


    <!-- إضافة كود -->

    <div class="form-box glass">

      <h3>
        ➕ إضافة كود جديد
      </h3>

      <input
        type="text"
        id="newCode"
        placeholder="مثال: MEZOO30"
      >

      <div class="row">

        <select id="newType">

          <option value="percent">
            نسبة مئوية %
          </option>

          <option value="fixed">
            مبلغ ثابت جنيه
          </option>

        </select>

        <input
          type="number"
          id="newValue"
          placeholder="قيمة الخصم"
          min="1"
        >

      </div>


      <div class="row">

        <input
          type="number"
          id="newMaxUses"
          placeholder="عدد مرات الاستخدام"
          min="1"
          value="1"
        >

        <input
          type="datetime-local"
          id="newExpiry"
        >

      </div>


      <small style="display:block;color:#777;margin:-5px 0 15px">

        عدد مرات الاستخدام المسموح بها + تاريخ الانتهاء

      </small>


      <button
        class="add-btn"
        onclick="addCode()"
      >
        إضافة الكود
      </button>

      <div
        id="formMessage"
        class="message"
      ></div>

    </div>


    <!-- تعديل كود -->

    <div
      id="editBox"
      class="edit-box glass"
    >

      <h3
