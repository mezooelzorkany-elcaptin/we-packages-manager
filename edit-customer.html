<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعديل العميل | CASH BACK</title>
<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f7f6fb;color:#1d2435}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #eee;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0000000b}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:24px;font-weight:900;color:#5420b8}.back,.save{border:0;border-radius:12px;padding:11px 16px;font-weight:bold;cursor:pointer}.back{background:#eee4ff;color:#5420b8}.save{background:#5420b8;color:#fff;width:100%;margin-top:8px}.field{margin:12px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;height:47px;border:1px solid #ddd;border-radius:12px;padding:0 12px;background:#fff;outline:none}.msg{text-align:center;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}html.dark-mode body{background:#0f172a!important;color:#f8fafc!important}html.dark-mode .card{background:#1e293b!important;border-color:#334155!important}html.dark-mode input,html.dark-mode select{background:#334155!important;color:#f8fafc!important;border-color:#475569!important}html.dark-mode .back{background:#293449!important;color:#fff!important}
</style>
</head>
<body><main class="wrap"><div class="top"><div class="title">✏️ تعديل بيانات العميل</div><button class="back" onclick="location.href='customers-list.html'">← العملاء</button></div><section class="card"><div id="msg" class="msg">⏳ جاري تحميل بيانات العميل...</div><form id="form" style="display:none"><div class="grid"><div class="field"><label>اسم العميل *</label><input id="name" required></div><div class="field"><label>الاسم عندي</label><input id="internal"></div><div class="field"><label>رقم العميل *</label><input id="phone" inputmode="numeric" required></div><div class="field"><label>الرقم الأساسي</label><input id="primary" inputmode="numeric"></div><div class="field"><label>الجيجا</label><input id="gb" type="number" step=".01"></div><div class="field"><label>الباقة</label><select id="package"><option value="">اختر الباقة</option><option>20 جيجا</option><option>25 جيجا</option><option>30 جيجا</option><option>35 جيجا</option><option>40 جيجا</option><option>45 جيجا</option><option>50 جيجا</option><option>55 جيجا</option><option>60 جيجا</option></select></div><div class="field"><label>السعر</label><input id="price" type="number"></div><div class="field"><label>الخصم</label><input id="discount" type="number" step=".01"></div><div class="field"><label>كود الخصم</label><input id="promo"></div><div class="field"><label>طريقة الدفع</label><select id="payment"><option value="">غير محدد</option><option>Vodafone Cash</option><option>Etisalat Cash</option><option>WE Pay</option><option>Orange Cash</option><option>InstaPay</option><option>الدفع النقدي</option><option>كاش</option><option>تحويل بنكي</option></select></div><div class="field"><label>الحالة</label><select id="status"><option value="active">🟢 نشط</option><option value="inactive">🔴 موقوف</option></select></div><div class="field"><label>نظام التجديد</label><select id="renewalType"><option value="day_1">يوم 1</option><option value="day_16">يوم 16</option><option value="custom">تاريخ مخصص</option></select></div><div class="field"><label>يوم التجديد</label><input id="renewalDay" type="number" min="1" max="31"></div><div class="field"><label>التجديد القادم *</label><input id="next" type="date" required></div><div class="field"><label>عدد الطلبات</label><input id="orders" type="number" min="0"></div></div><button class="save" type="submit">💾 حفظ التعديلات</button></form></section></main>
<script>
const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY',ADMIN='mezooelzorkany@gmail.com';const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=x=>document.getElementById(x);const id=new URLSearchParams(location.search).get('id');let row;
function clean(v){return String(v||'').replace(/\D/g,'')}function date(v){const m=String(v||'').match(/\d{4}-\d{2}-\d{2}/);return m?m[0]:''}
async function load(){try{if(!id)throw Error('لم يتم تحديد العميل');const s=await db.auth.getSession(),session=s.data.session;if(!session||String(session.user?.email||'').toLowerCase()!==ADMIN.toLowerCase())throw Error('جلسة الإدارة غير موجودة');const r=await fetch(U+'/rest/v1/customers?id=eq.'+encodeURIComponent(id)+'&deleted_at=is.null&limit=1',{headers:{apikey:K,Authorization:'Bearer '+session.access_token}});const d=await r.json();if(!r.ok||!d.length)throw Error('العميل غير موجود');row=d[0];$('name').value=row.subscriber_name||'';$('internal').value=row.internal_name||'';$('phone').value=row.phone||'';$('primary').value=row.primary_number||'';$('gb').value=row.allocated_gb??'';$('package').value=row.package_name||'';$('price').value=row.last_price??'';$('discount').value=row.discount_amount??0;$('promo').value=row.promo_code||'';$('payment').value=row.payment_method||'';$('status').value=row.status||'active';$('renewalType').value=row.renewal_type||'day_1';$('renewalDay').value=row.renewal_day||'';$('next').value=date(row.next_renewal_date);$('orders').value=row.total_orders??0;$('msg').style.display='none';$('form').style.display='block'}catch(e){$('msg').innerHTML='❌ '+e.message+'<br><br><button class="back" onclick="location.href=\'customers-list.html\'">← الرجوع للعملاء</button>'}}
$('form').onsubmit=async e=>{e.preventDefault();try{const s=await db.auth.getSession(),session=s.data.session;if(!session)throw Error('انتهت جلسة الإدارة');const phone=clean($('phone').value),primary=clean($('primary').value);if(!/^01[0125]\d{8}$/.test(phone))throw Error('رقم العميل غير صحيح');if(primary&&!/^01[0125]\d{8}$/.test(primary))throw Error('الرقم الأساسي غير صحيح');const body={subscriber_name:$('name').value.trim(),internal_name:$('internal').value.trim()||null,phone,primary_number:primary||null,allocated_gb:Number($('gb').value)||0,package_name:$('package').value||null,last_price:Number($('price').value)||0,discount_amount:Number($('discount').value)||0,promo_code:$('promo').value.trim().toUpperCase()||null,payment_method:$('payment').value||null,status:$('status').value,renewal_type:$('renewalType').value,renewal_day:Number($('renewalDay').value)||null,next_renewal_date:$('next').value,total_orders:Number($('orders').value)||0,updated_at:new Date().toISOString()};const r=await fetch(U+'/rest/v1/customers?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{apikey:K,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw Error((await r.text())||'تعذر حفظ التعديل');alert('✅ تم تعديل بيانات العميل بنجاح');location.href='customers-list.html'}catch(e){alert('❌ '+e.message)}};load();
</script></body></html>
