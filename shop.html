<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASH BACK محل</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f5e6b0;font-family:Arial,Tahoma,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 5%;border-bottom:1px solid #5e4a20;background:#14130f}header strong{font-size:24px;color:#e7c66c}button,input,select,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #5e4a20;background:#171612;color:#f8e9b8}button{cursor:pointer;background:#b18a2d;color:#080808;font-weight:bold;border:0}.secondary{background:#25231c;color:#f3dfa0;border:1px solid #665329}.wrap{max-width:1150px;margin:24px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#151511;border:1px solid #4d401f;border-radius:15px;padding:17px}.big{font-size:27px;margin-top:12px;color:#f1d37c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button.active{background:#f2d37a}form{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}form input,form select{flex:1;min-width:145px}table{width:100%;border-collapse:collapse;margin-top:12px;background:#141411}th,td{text-align:right;padding:11px;border-bottom:1px solid #39301b}th{color:#e6c76f}#message{margin:12px 0;color:#f4d986}.muted{color:#bdb49a}.hidden{display:none!important}@media(max-width:600px){header{padding:14px}th,td{padding:8px;font-size:13px}}
</style></head><body>
<header><strong>◉ CASH BACK محل</strong><div><button class="secondary" onclick="location.href='customers.html'">رجوع لاختيار النظام</button> <button class="secondary" onclick="logout()">تسجيل الخروج</button></div></header>
<div class="wrap"><div id="message">جاري التحقق من تسجيل الدخول...</div><div id="shop" class="hidden">
<div class="grid"><div class="card">إجمالي المصروفات المسجلة<div id="totalExpenses" class="big">0 ج.م</div></div><div class="card">عدد العملاء<div id="customerCount" class="big">0</div></div><div class="card">عدد الحسابات<div id="accountCount" class="big">0</div></div></div>
<div class="tabs"><button class="active" onclick="tab('customers',this)">العملاء</button><button class="secondary" onclick="tab('accounts',this)">الحسابات</button><button class="secondary" onclick="tab('operations',this)">العمليات</button><button class="secondary" onclick="tab('expenses',this)">المصروفات</button></div>
<section id="customersPanel" class="card"><h2>إضافة عميل</h2><form onsubmit="addCustomer(event)"><input id="customerName" required placeholder="اسم العميل"><input id="customerPhone" placeholder="رقم الهاتف"><input id="customerNotes" placeholder="ملاحظات"><button>حفظ العميل</button></form><div id="customersTable"></div></section>
<section id="accountsPanel" class="card hidden"><h2>إضافة حساب / خزنة</h2><form onsubmit="addAccount(event)"><input id="accountName" required placeholder="اسم الحساب"><input id="accountBalance" type="number" step=".01" value="0" placeholder="الرصيد الافتتاحي"><button>حفظ الحساب</button></form><div id="accountsTable"></div></section>
<section id="operationsPanel" class="card hidden"><h2>تسجيل عملية</h2><form onsubmit="addOperation(event)"><select id="opType"><option value="sale">بيع</option><option value="purchase">شراء</option><option value="income">إيراد</option><option value="expense">مصروف</option><option value="customer_payment">تحصيل من عميل</option><option value="customer_credit">مبلغ على عميل</option><option value="transfer">تحويل</option></select><input id="opAmount" required type="number" min="0.01" step=".01" placeholder="المبلغ"><select id="opAccount"><option value="">الحساب (اختياري)</option></select><select id="opCustomer"><option value="">العميل (اختياري)</option></select><input id="opDescription" placeholder="البيان"><input id="opDate" type="date"><button>تسجيل العملية</button></form><div id="operationsTable"></div></section>
<section id="expensesPanel" class="card hidden"><h2>تسجيل مصروف</h2><form onsubmit="addExpense(event)"><input id="expenseTitle" required placeholder="اسم المصروف"><input id="expenseAmount" required type="number" min=".01" step=".01" placeholder="المبلغ"><select id="expenseAccount"><option value="">الحساب (اختياري)</option></select><input id="expenseDate" type="date"><input id="expenseNotes" placeholder="ملاحظات"><button>حفظ المصروف</button></form><div id="expensesTable"></div></section>
</div></div>
<script>
const URL='https://pgvbynefhqmyzjtccttl.supabase.co';
const KEY='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';
const ADMIN='mezooelzorkany@gmail.com';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let customers=[],accounts=[];
const $=id=>document.getElementById(id), money=n=>(Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
function msg(s){$('message').textContent=s}
async function init(){
 try{
  if(!window.supabase||!window.supabase.createClient){msg('مكتبة تسجيل الدخول لم يتم تحميلها. جرّب فتح الصفحة بعد تحديثها.');return;}
  const result=await Promise.race([db.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('التحقق من تسجيل الدخول تأخر. حدّث الصفحة ثم سجّل الدخول من جديد.')),8000))]);
  if(result.error) throw result.error;
  if(!result.data.session){
   msg('جلسة الدخول غير موجودة. ارجع للموقع الرئيسي وسجّل الدخول ثم افتح المحل.');
   return;
  }
  if(String(result.data.session.user.email||'').toLowerCase()!==ADMIN){
   msg('الحساب الحالي غير مصرح له. ارجع وسجّل بحساب الإدارة.');
   return;
  }
  $('shop').classList.remove('hidden');
  msg('تم التحقق من الدخول. جاري تحميل بيانات المحل...');
  $('opDate').value=new Date().toISOString().slice(0,10);
  $('expenseDate').value=$('opDate').value;
  await refresh();
  msg('نظام المحل جاهز.');
 }catch(e){
  msg('حصل خطأ: '+(e && e.message ? e.message : String(e)));
  console.error(e);
 }
}
async function refresh(){await Promise.all([loadCustomers(),loadAccounts(),loadOperations(),loadExpenses()]);$('customerCount').textContent=customers.length;$('accountCount').textContent=accounts.length}
async function loadCustomers(){const {data,error}=await db.from('cb_customers').select('*').order('created_at',{ascending:false});if(error)throw error;customers=data||[];$('customersTable').innerHTML=table(['الاسم','الهاتف','ملاحظات'],customers.map(x=>[esc(x.name),esc(x.phone||''),esc(x.notes||'')]));fillSelects()}
async function loadAccounts(){const {data,error}=await db.from('cb_accounts').select('*').order('created_at',{ascending:false});if(error)throw error;accounts=data||[];$('accountsTable').innerHTML=table(['الحساب','الرصيد الافتتاحي'],accounts.map(x=>[esc(x.name),money(x.opening_balance)]));fillSelects()}
async function loadOperations(){const {data,error}=await db.from('cb_operations').select('*').order('created_at',{ascending:false}).limit(100);if(error)throw error;$('operationsTable').innerHTML=table(['النوع','المبلغ','البيان','التاريخ'],(data||[]).map(x=>[label(x.operation_type),money(x.amount),esc(x.description),esc(x.operation_date)]))}
async function loadExpenses(){const {data,error}=await db.from('cb_expenses').select('*').order('created_at',{ascending:false}).limit(100);if(error)throw error;const rows=data||[];$('totalExpenses').textContent=money(rows.reduce((s,x)=>s+Number(x.amount||0),0));$('expensesTable').innerHTML=table(['المصروف','المبلغ','التاريخ','ملاحظات'],rows.map(x=>[esc(x.title),money(x.amount),esc(x.expense_date),esc(x.notes||'')]))}
function fillSelects(){for(const id of ['opAccount','expenseAccount']){const el=$(id),v=el.value;el.innerHTML='<option value="">الحساب (اختياري)</option>'+accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('');el.value=v}const el=$('opCustomer'),v=el.value;el.innerHTML='<option value="">العميل (اختياري)</option>'+customers.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('');el.value=v}
async function addCustomer(e){e.preventDefault();try{const {error}=await db.from('cb_customers').insert({name:$('customerName').value.trim(),phone:$('customerPhone').value.trim()||null,notes:$('customerNotes').value.trim()||null});if(error)throw error;e.target.reset();await loadCustomers();$('customerCount').textContent=customers.length;msg('تم حفظ العميل')}catch(x){msg('لم يتم الحفظ: '+x.message)}}
async function addAccount(e){e.preventDefault();try{const {error}=await db.from('cb_accounts').insert({name:$('accountName').value.trim(),opening_balance:Number($('accountBalance').value||0)});if(error)throw error;e.target.reset();$('accountBalance').value='0';await loadAccounts();$('accountCount').textContent=accounts.length;msg('تم حفظ الحساب')}catch(x){msg('لم يتم الحفظ: '+x.message)}}
async function addOperation(e){e.preventDefault();try{const {error}=await db.from('cb_operations').insert({operation_type:$('opType').value,amount:Number($('opAmount').value),account_id:$('opAccount').value||null,customer_id:$('opCustomer').value||null,description:$('opDescription').value.trim(),operation_date:$('opDate').value||new Date().toISOString().slice(0,10)});if(error)throw error;e.target.reset();$('opDate').value=new Date().toISOString().slice(0,10);await loadOperations();msg('تم تسجيل العملية')}catch(x){msg('لم يتم التسجيل: '+x.message)}}
async function addExpense(e){e.preventDefault();try{const {error}=await db.from('cb_expenses').insert({title:$('expenseTitle').value.trim(),amount:Number($('expenseAmount').value),account_id:$('expenseAccount').value||null,expense_date:$('expenseDate').value||new Date().toISOString().slice(0,10),notes:$('expenseNotes').value.trim()||null});if(error)throw error;e.target.reset();$('expenseDate').value=new Date().toISOString().slice(0,10);await loadExpenses();msg('تم حفظ المصروف')}catch(x){msg('لم يتم الحفظ: '+x.message)}}
function tab(name,btn){for(const n of ['customers','accounts','operations','expenses'])$(n+'Panel').classList.toggle('hidden',n!==name);document.querySelectorAll('.tabs button').forEach(b=>{b.classList.add('secondary');b.classList.remove('active')});btn.classList.add('active');btn.classList.remove('secondary')}
function table(head,rows){if(!rows.length)return '<p class="muted">لا توجد بيانات حتى الآن.</p>';return '<div style="overflow:auto"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function label(s){return ({sale:'بيع',purchase:'شراء',income:'إيراد',expense:'مصروف',customer_payment:'تحصيل من عميل',customer_credit:'مبلغ على عميل',transfer:'تحويل'})[s]||s}
async function logout(){await db.auth.signOut();location.href='customers.html'}
init();
</script></body></html>
