name: CASH BACK Android APK

on:
  push:
    branches: [cash-back-admin-android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cash-back-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Add CASH BACK native printer bridge
        run: |
          mkdir -p android/app/src/main/java/com/cashback/admin
          cp native/CashBackPrinterPlugin.java android/app/src/main/java/com/cashback/admin/CashBackPrinterPlugin.java
          cat > android/app/src/main/java/com/cashback/admin/MainActivity.java <<'JAVA'
          package com.cashback.admin;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(CashBackPrinterPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp ../logo.png android/app/src/main/res/drawable/cash_back_logo.png
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/cash_back_logo"|' android/app/src/main/AndroidManifest.xml
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cash-back-admin-debug-apk
          path: cash-back-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
