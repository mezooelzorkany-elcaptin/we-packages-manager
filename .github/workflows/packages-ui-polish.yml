name: Packages UI Polish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[packages-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Polish packages page
        shell: python
        run: |
          from pathlib import Path

          p = Path("packages.html")
          s = p.read_text(encoding="utf-8")

          css = r"""
<style id="cashbackThemeStyle">
.brand-bar{width:92%;max-width:700px;margin:22px auto 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand-logo{width:72px;height:72px;object-fit:contain;border-radius:20px;background:rgba(255,255,255,.82);padding:7px;box-shadow:0 10px 30px rgba(60,40,120,.16);border:1px solid rgba(255,255,255,.7)}
.brand-name{font-size:20px;font-weight:900;flex:1;text-align:right}
.theme-toggle{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.62);color:#35205f;border-radius:16px;min-width:52px;height:52px;font-size:23px;cursor:pointer;box-shadow:0 8px 25px rgba(60,40,120,.12)}
.theme-toggle:active{transform:scale(.96)}
body.theme-light{background:radial-gradient(circle at 100% 0%,#b184ff 0%,#9d6cf1 22%,transparent 55%),linear-gradient(135deg,#f7f4fc 0%,#eee8fa 45%,#e4dcf4 100%);color:#171b35}
body.theme-dark{background:radial-gradient(circle at 100% 0%,#57318e 0%,#38215f 25%,transparent 58%),linear-gradient(135deg,#090b14 0%,#111326 45%,#17152a 100%);color:#f5f3ff}
body.theme-dark .header h1{color:#fff}
body.theme-dark .header p{color:#d7d1e7}
body.theme-dark .badge-top{background:rgba(30,25,48,.72);color:#e6d8ff;border-color:rgba(255,255,255,.16)}
body.theme-dark .promo{background:rgba(31,24,49,.62);border-color:rgba(255,255,255,.13);box-shadow:0 18px 45px rgba(0,0,0,.3)}
body.theme-dark .brand-logo{background:#fff}
body.theme-dark .theme-toggle{background:rgba(34,28,54,.85);color:#fff;border-color:rgba(255,255,255,.18)}
body.theme-dark .home-button{box-shadow:0 12px 35px rgba(0,0,0,.3)}
@media(max-width:600px){.brand-bar{margin-top:16px}.brand-logo{width:62px;height:62px;border-radius:17px}.brand-name{font-size:17px}.theme-toggle{width:50px;min-width:50px;height:50px}}
</style>
"""

          if 'id="cashbackThemeStyle"' not in s:
              marker = "</head>"
              if marker not in s:
                  raise SystemExit("packages.html: </head> not found")
              s = s.replace(marker, css + "\n" + marker, 1)

          header = """<div class="brand-bar">
    <img class="brand-logo" src="logo.png" alt="CASH BACK">
    <div class="brand-name">CASH BACK</div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="تغيير المظهر">🌙</button>
</div>

"""
          if 'id="themeToggle"' not in s:
              marker = '<header class="header">'
              if marker not in s:
                  raise SystemExit("packages.html: header marker not found")
              s = s.replace(marker, header + marker, 1)

          js = r"""
<script id="cashbackThemeScript">
(function(){
  const key='cashback_packages_theme';
  const body=document.body;
  const btn=document.getElementById('themeToggle');
  if(!btn) return;
  let theme=localStorage.getItem(key)||'light';
  function render(){
    body.classList.toggle('theme-dark',theme==='dark');
    body.classList.toggle('theme-light',theme!=='dark');
    btn.textContent=theme==='dark'?'☀️':'🌙';
    btn.title=theme==='dark'?'الوضع الفاتح':'الوضع الداكن';
  }
  btn.addEventListener('click',function(){
    theme=theme==='dark'?'light':'dark';
    localStorage.setItem(key,theme);
    render();
  });
  render();
})();
</script>
"""
          if 'id="cashbackThemeScript"' not in s:
              marker = "</body>"
              if marker not in s:
                  raise SystemExit("packages.html: </body> not found")
              s = s.replace(marker, js + "\n" + marker, 1)

          p.write_text(s, encoding="utf-8")
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Polish packages page branding and theme [packages-ui]"
          git push
