<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>تجديد الباقة | WE Packages</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,#a568f0 0%,transparent 35%),
linear-gradient(135deg,#f7f4ff,#e5ddf4,#d8ccea);
color:#19182d
}

.container{
width:92%;
max-width:650px;
margin:auto
}

.page{
min-height:100vh;
display:flex;
align-items:center;
padding:25px 0
}

.box{
width:100%;
background:rgba(255,255,255,.8);
border:1px solid rgba(255,255,255,.95);
border-radius:30px;
padding:30px 25px;
box-shadow:0 20px 55px rgba(60,35,120,.13);
backdrop-filter:blur(18px)
}

.back{
display:inline-block;
color:#5420b8;
text-decoration:none;
font-weight:bold;
margin-bottom:20px
}

.title{
text-align:center;
margin-bottom:25px
}

.title .icon{
font-size:45px
}

.title h1{
margin:8px 0;
color:#5420b8;
font-size:30px
}

.title p{
margin:0;
color:#777;
line-height:1.7
}

label{
display:block;
font-weight:bold;
margin-bottom:8px
}

input{
width:100%;
height:52px;
border:2px solid #e0dbea;
border-radius:15px;
padding:0 16px;
font-size:17px;
outline:none;
background:white;
margin-bottom:12px
}

input:focus{
border-color:#7544cf;
box-shadow:0 0 0 3px rgba(117,68,207,.1)
}

.search-btn{
width:100%;
height:52px;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#5420b8,#9747ff);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer
}

.message{
text-align:center;
margin-top:15px;
font-weight:bold;
line-height:1.7
}

.customer{
display:none;
margin-top:25px
}

.customer-card{
background:white;
border-radius:23px;
padding:22px;
box-shadow:0 8px 25px rgba(60,35,120,.08)
}

.customer-name{
font-size:25px;
font-weight:900;
color:#5420b8;
margin-bottom:18px
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.info-box{
background:#f7f5fb;
border-radius:15px;
padding:14px
}

.info-box small{
display:block;
color:#888;
margin-bottom:6px
}

.info-box strong{
font-size:16px
}

.renew-btn{
width:100%;
margin-top:20px;
height:55px;
border:0;
border-radius:16px;
background:linear-gradient(135deg,#14863f,#27ad62);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer
}

.reset-btn{
width:100%;
margin-top:10px;
height:48px;
border:0;
border-radius:14px;
background:#eee8f8;
color:#5420b8;
font-weight:bold;
cursor:pointer
}

.loading{
text-align:center;
padding:20px;
color:#777
}

@media(max-width:550px){

.info{
grid-template-columns:1fr
}

.box{
padding:25px 18px
}

}

</style>

</head>

<body>

<div class="page">

<div class="container">

<div class="box">

<a
href="index.html"
class="back"
>
← العودة للرئيسية
</a>

<div class="title">

<div class="icon">
🔄
</div>

<h1>
تجديد الباقة
</h1>

<p>
لو أنت عميل حالي، اكتب رقم التليفون المسجل عندنا
علشان نعرض بيانات اشتراكك.
</p>

</div>


<div id="searchSection">

<label>
📱 رقم التليفون
</label>

<input
id="phone"
type="tel"
inputmode="numeric"
placeholder="01xxxxxxxxx"
maxlength="11"
>

<button
class="search-btn"
onclick="findCustomer()"
>
🔎 البحث عن اشتراكي
</button>

<div
id="message"
class="message"
></div>

</div>


<div
id="customerSection"
class="customer"
>

<div class="customer-card">

<div
id="customerName"
class="customer-name"
>
</div>

<div
id="customerInfo"
class="info"
>
</div>

<button
class="renew-btn"
onclick="startRenewal()"
>
🔄 تجديد الباقة الآن
</button>

<button
class="reset-btn"
onclick="resetSearch()"
>
🔎 البحث عن رقم آخر
</button>

</div>

</div>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


let customer = null;


async function findCustomer(){

const phone =
document
.getElementById("phone")
.value
.trim();

const message =
document.getElementById("message");


if(!phone){

message.style.color="#b00020";

message.textContent=
"❌ اكتب رقم التليفون أولاً";

return;

}


if(!/^01[0-9]{9}$/.test(phone)){

message.style.color="#b00020";

message.textContent=
"❌ اكتب رقم تليفون صحيح مكون من 11 رقم";

return;

}


message.style.color="#555";

message.textContent=
"⏳ جاري البحث عن بيانات الاشتراك...";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/customers?select=id,subscriber_name,phone,primary_number,allocated_gb,package_name,last_price,payment_method,status,renewal_type,renewal_day,next_renewal_date&phone=eq."+
encodeURIComponent(phone)+
"&deleted_at=is.null&limit=1",

{

headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY
}

}

);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.message||
data.error_description||
"تعذر الاتصال بقاعدة البيانات"
);

}


if(!Array.isArray(data)||!data.length){

message.style.color="#b00020";

message.textContent=
"❌ الرقم غير موجود عندنا. تأكد من الرقم أو تواصل معنا.";

return;

}


customer=data[0];


showCustomer();


}
catch(error){

console.error(error);

message.style.color="#b00020";

message.textContent=
"❌ حصل خطأ أثناء البحث:\n"+
error.message;

}

}


function showCustomer(){

document.getElementById(
"searchSection"
).style.display="none";


document.getElementById(
"customerSection"
).style.display="block";


document.getElementById(
"customerName"
).textContent=
"👤 "+
(customer.subscriber_name||"العميل");


const info =
document.getElementById(
"customerInfo"
);


const status =
customer.status==="active"
?
"🟢 نشط"
:
"🔴 موقوف";


const renewal =
customer.next_renewal_date
?
customer.next_renewal_date
:
"غير محدد";


info.innerHTML=`

<div class="info-box">

<small>📱 رقم التليفون</small>

<strong>
${escapeHtml(customer.phone||"-")}
</strong>

</div>


<div class="info-box">

<small>📦 الباقة الحالية</small>

<strong>
${escapeHtml(customer.package_name||"-")}
</strong>

</div>


<div class="info-box">

<small>📊 الجيجا</small>

<strong>
${Number(customer.allocated_gb)||0} جيجا
</strong>

</div>


<div class="info-box">

<small>💰 سعر التجديد</small>

<strong>
${Number(customer.last_price)||0} جنيه
</strong>

</div>


<div class="info-box">

<small>📅 التجديد القادم</small>

<strong>
${escapeHtml(renewal)}
</strong>

</div>


<div class="info-box">

<small>📌 الحالة</small>

<strong>
${status}
</strong>

</div>

`;

}


function startRenewal(){

if(!customer)
return;


const params =
new URLSearchParams({

type:"renewal",

customer_id:
customer.id,

phone:
customer.phone||"",

name:
customer.subscriber_name||"",

package:
customer.package_name||"",

gb:
customer.allocated_gb||0,

price:
customer.last_price||0

});


window.location.href=
"checkout.html?"+
params.toString();

}


function resetSearch(){

customer=null;

document.getElementById(
"phone"
).value="";


document.getElementById(
"message"
).textContent="";


document.getElementById(
"customerSection"
).style.display="none";


document.getElementById(
"searchSection"
).style.display="block";

}


function escapeHtml(value){

return String(value??"")
.replace(
/[&<>"']/g,
function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c];

}
);

}

</script>

</body>

</html>
