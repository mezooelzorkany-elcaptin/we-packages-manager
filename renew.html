<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تجديد الباقة | CASH BACK</title>
<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;min-height:100vh;color:#19182d;background:radial-gradient(circle at 100% 0%,#a568f0 0%,transparent 35%),linear-gradient(135deg,#f7f4ff,#e5ddf4,#d8ccea);transition:.3s}.page{min-height:100vh;display:flex;align-items:center;padding:22px}.container{width:92%;max-width:650px;margin:auto}.box{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:30px;padding:28px 24px;box-shadow:0 20px 55px rgba(60,35,120,.15);backdrop-filter:blur(18px)}.brand{text-align:center;margin-bottom:20px}.logo{width:82px;height:82px;object-fit:contain;background:#fff;padding:8px;border-radius:22px;box-shadow:0 10px 30px rgba(60,35,120,.16)}.brand h1{margin:12px 0 4px;color:#5420b8;font-size:28px}.brand p{margin:0;color:#777;line-height:1.7}.back{display:inline-block;color:#5420b8;text-decoration:none;font-weight:bold;margin-bottom:18px}.field label{display:block;font-weight:bold;margin-bottom:8px}.field input{width:100%;height:52px;border:2px solid #e0dbea;border-radius:15px;padding:0 16px;font-size:17px;outline:none;background:#fff;margin-bottom:12px}.search-btn,.renew-btn,.reset-btn{width:100%;height:52px;border:0;border-radius:15px;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}.search-btn{background:linear-gradient(135deg,#5420b8,#9747ff)}.renew-btn{height:55px;margin-top:20px;background:linear-gradient(135deg,#14863f,#27ad62)}.reset-btn{margin-top:10px;background:#eee8f8;color:#5420b8}.message{text-align:center;margin-top:15px;font-weight:bold;line-height:1.7}.customer{display:none;margin-top:24px}.customer-card{background:#fff;border-radius:23px;padding:22px;box-shadow:0 8px 25px rgba(60,35,120,.08)}.customer-name{font-size:24px;font-weight:900;color:#5420b8;margin-bottom:18px}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info-box{background:#f7f5fb;border-radius:15px;padding:14px}.info-box small{display:block;color:#888;margin-bottom:6px}.info-box strong{font-size:16px}.theme{position:fixed;left:18px;top:18px;width:48px;height:48px;border:1px solid rgba(255,255,255,.5);border-radius:15px;background:rgba(255,255,255,.65);cursor:pointer;font-size:21px}.dark{background:radial-gradient(circle at 100% 0%,#5a328e 0%,transparent 35%),linear-gradient(135deg,#090b13,#171429);color:#f5f3ff}.dark .box,.dark .customer-card{background:rgba(25,21,40,.88);border-color:rgba(255,255,255,.12)}.dark .brand h1{color:#e8d9ff}.dark .brand p{color:#d0c8dc}.dark .field input{background:#151221;color:#fff;border-color:#39304b}.dark .info-box{background:#211b31}.dark .reset-btn{background:#302743;color:#e6d8ff}.dark .theme{background:#211b31;color:#fff;border-color:#493b5d}.dark .back{color:#d9c1ff}@media(max-width:550px){.page{padding:16px}.box{padding:24px 18px}.info{grid-template-columns:1fr}.logo{width:72px;height:72px}}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="تغيير المظهر">🌙</button>
<div class="page"><div class="container"><div class="box">
<a href="index.html" class="back">← العودة للرئيسية</a>
<div class="brand"><img src="logo.png" class="logo" alt="CASH BACK"><h1>تجديد باقة CASH BACK</h1><p>اكتب رقم التليفون المسجل عندنا لعرض بيانات اشتراكك.</p></div>
<div id="searchSection" class="field"><label>📱 رقم التليفون</label><input id="phone" type="tel" inputmode="numeric" placeholder="01xxxxxxxxx" maxlength="11"><button id="searchBtn" class="search-btn">🔎 البحث عن اشتراكي</button><div id="message" class="message"></div></div>
<div id="customerSection" class="customer"><div class="customer-card"><div id="customerName" class="customer-name"></div><div id="customerInfo" class="info"></div><button id="renewBtn" class="renew-btn">🔄 تجديد الباقة الآن</button><button id="resetBtn" class="reset-btn">🔎 البحث عن رقم آخر</button></div></div>
</div></div></div>
<script>
const URL="https://pgvbynefhqmyzjtccttl.supabase.co",KEY="sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";let customer=null;
const $=id=>document.getElementById(id),msg=$('message');
$('searchBtn').onclick=findCustomer;$('resetBtn').onclick=resetSearch;$('renewBtn').onclick=startRenewal;
$('phone').addEventListener('keydown',e=>{if(e.key==='Enter')findCustomer()});
async function findCustomer(){const phone=$('phone').value.trim();if(!/^01[0-9]{9}$/.test(phone)){msg.style.color='#b00020';msg.textContent='❌ اكتب رقم تليفون مصري صحيح مكون من 11 رقم';return}msg.style.color='#555';msg.textContent='⏳ جاري البحث...';try{const r=await fetch(URL+'/rest/v1/rpc/lookup_customer_for_renewal',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({input_phone:phone})});const data=await r.json();if(!r.ok)throw Error(data.message||'تعذر الاتصال');if(!Array.isArray(data)||!data.length){msg.style.color='#b00020';msg.textContent='❌ الرقم غير موجود عندنا.';return}customer=data[0];showCustomer()}catch(e){console.error(e);msg.style.color='#b00020';msg.textContent='❌ تعذر البحث عن الاشتراك حاليًا.'}}
function showCustomer(){$('searchSection').style.display='none';$('customerSection').style.display='block';$('customerName').textContent='👤 '+(customer.subscriber_name||'العميل');const status=customer.status==='active'?'🟢 نشط':'🔴 موقوف';const renewal=customer.next_renewal_date||'غير محدد';$('customerInfo').innerHTML=`<div class="info-box"><small>📱 رقم التليفون</small><strong>${esc(customer.phone||'-')}</strong></div><div class="info-box"><small>📦 الباقة الحالية</small><strong>${esc(customer.package_name||'-')}</strong></div><div class="info-box"><small>📊 الجيجا</small><strong>${Number(customer.allocated_gb)||0} جيجا</strong></div><div class="info-box"><small>💰 سعر التجديد</small><strong>${Number(customer.last_price)||0} جنيه</strong></div><div class="info-box"><small>📅 التجديد القادم</small><strong>${esc(renewal)}</strong></div><div class="info-box"><small>📌 الحالة</small><strong>${status}</strong></div>`}
function startRenewal(){if(!customer)return;const p=new URLSearchParams({type:'renewal',customer_id:customer.id,phone:customer.phone||'',name:customer.subscriber_name||'',package:customer.package_name||'',gb:customer.allocated_gb||0,price:customer.last_price||0});location.href='checkout.html?'+p}
function resetSearch(){customer=null;$('phone').value='';msg.textContent='';$('customerSection').style.display='none';$('searchSection').style.display='block'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
const saved=localStorage.getItem('cashback_theme')||'light';if(saved==='dark')document.body.classList.add('dark');$('theme').textContent=document.body.classList.contains('dark')?'☀️':'🌙';$('theme').onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');localStorage.setItem('cashback_theme',d?'dark':'light');$('theme').textContent=d?'☀️':'🌙'};
</script></body></html>
