<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الطلبات | CASH BACK</title><script src="theme.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f7f6fb;color:#1d2435}.wrap{max-width:1050px;margin:auto;padding:20px 14px 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:25px;font-weight:900;color:#5420b8}.count{color:#858b9b;margin-top:4px}.back{border:0;border-radius:12px;padding:11px 16px;background:#eee4ff;color:#5420b8;font-weight:bold}.toolbar{display:flex;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{height:46px;border:1px solid #ddd;border-radius:12px;background:#fff;padding:0 12px;outline:none}.toolbar input{flex:1}.list{display:grid;gap:10px}.order{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}.head{min-height:68px;padding:12px 55px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;cursor:pointer}.head:before{content:'⌄';position:absolute;right:16px;width:28px;height:28px;border-radius:50%;background:#eee4ff;color:#5420b8;display:grid;place-items:center;font-weight:900}.order.open .head:before{transform:rotate(180deg);background:#5420b8;color:#fff}.name{font-size:18px;font-weight:900}.meta{font-size:12px;color:#858b9b;margin-top:4px}.price{font-weight:900;color:#5420b8}.badge{display:inline-block;font-size:11px;font-weight:bold;border-radius:20px;padding:7px 10px;margin-top:4px;background:#fff0d5;color:#9a5a00;white-space:nowrap}.badge.ok{background:#e4f8ec;color:#08752d}.badge.bad{background:#fde8ea;color:#b00020}.badge.done{background:#e8ddff;color:#5420b8}.details{display:none;border-top:1px solid #eee;padding:12px;grid-template-columns:repeat(2,1fr);gap:9px}.order.open .details{display:grid}.box{background:#f8f8fb;border-radius:11px;padding:10px}.box small{display:block;color:#8991a2;font-size:10px;margin-bottom:5px}.box strong{font-size:13px;word-break:break-word}.order-actions{display:none;padding:12px;gap:9px;border-top:1px solid #eee}.order.open .order-actions{display:flex}.approve,.reject{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900;color:#fff}.approve{background:#159447}.reject{background:#d93645}.approve:disabled,.reject:disabled{opacity:.55}.empty,.error{background:#fff;border:1px solid #eee;border-radius:16px;padding:30px;text-align:center;color:#858b9b}.error{color:#b00020}@media(max-width:600px){.wrap{padding:16px}.toolbar{display:grid}.details{grid-template-columns:1fr}.head{padding-left:12px}.order-actions{flex-direction:column}}
html.dark-mode body{background:#0f172a;color:#f8fafc}html.dark-mode .order,html.dark-mode .empty,html.dark-mode .error{background:#1e293b;color:#f8fafc;border-color:#334155}html.dark-mode .meta,html.dark-mode .box small,.dark-mode .count{color:#94a3b8}html.dark-mode .box{background:#263449}html.dark-mode .toolbar input,html.dark-mode .toolbar select{background:#334155;color:#fff;border-color:#475569}
</style></head>
<body><main class="wrap"><div class="top"><div><div class="title">🧾 الطلبات</div><div id="count" class="count">جاري التحميل...</div></div><button class="back" onclick="location.href='customers.html'">← الإدارة</button></div><div class="toolbar"><input id="search" placeholder="🔎 ابحث بالاسم أو الرقم أو رقم الطلب"><select id="filter"><option value="all">كل الطلبات</option><option value="pending">في انتظار الدفع</option><option value="payment_submitted">في انتظار المراجعة</option><option value="approved">مقبول</option><option value="completed">مكتمل</option><option value="payment_confirmed">تم تأكيد الدفع</option><option value="payment_rejected">مرفوض</option></select></div><div id="list" class="list"><div class="empty">⏳ جاري تحميل الطلبات...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY',ADMIN='mezooelzorkany@gmail.com';const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id);let rows=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
async function session(){const s=await db.auth.getSession(),x=s.data.session;if(!x||String(x.user?.email||'').toLowerCase()!==ADMIN.toLowerCase())throw new Error('يجب تسجيل الدخول بحساب الإدارة أولًا');return x}
async function rpc(path,body){const s=await session();const r=await fetch(U+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error(data?.message||data?.details||data?.hint||text||'حدث خطأ');return Array.isArray(data)?data[0]:data}
function statusLabel(s){return ({pending:'⏳ في انتظار الدفع',payment_submitted:'💳 في انتظار المراجعة',approved:'✅ مقبول',completed:'🟢 مكتمل',payment_confirmed:'💰 تم تأكيد الدفع',payment_rejected:'❌ مرفوض'})[s]||('📌 '+s)}
function statusClass(s){return s==='payment_rejected'?'bad':s==='completed'||s==='payment_confirmed'?'ok':s==='approved'?'done':''}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const data=rows.filter(o=>{if(f!=='all'&&o.status!==f)return false;const t=[o.order_number,o.subscriber_name,o.phone,o.package_name].join(' ').toLowerCase();return !q||t.includes(q)});$('count').textContent=data.length+' طلب';$('list').innerHTML=data.length?data.map(o=>{const pkg=o.package_name||((o.package_gb||'-')+' جيجا'),price=o.final_price??o.original_price??0,action=o.status==='payment_submitted';return `<article class="order" data-order="${esc(o.order_number)}"><div class="head"><div><div class="name">${esc(o.subscriber_name||'بدون اسم')}</div><div class="meta">#${esc(o.order_number||'-')} · ${esc(pkg)}</div></div><div><div class="price">${money(price)} ج</div><span class="badge ${statusClass(o.status)}">${statusLabel(o.status)}</span></div></div><div class="details"><div class="box"><small>رقم العميل</small><strong>${esc(o.phone||'-')}</strong></div><div class="box"><small>الباقة</small><strong>${esc(pkg)}</strong></div><div class="box"><small>السعر النهائي</small><strong>${money(price)} جنيه</strong></div><div class="box"><small>طريقة الدفع</small><strong>${esc(o.payment_method||'غير محدد')}</strong></div><div class="box"><small>الكود</small><strong>${esc(o.promo_code||'لا يوجد')}</strong></div><div class="box"><small>الحالة</small><strong>${statusLabel(o.status)}</strong></div><div class="box"><small>رقم الطلب</small><strong>${esc(o.order_number||'-')}</strong></div></div>${action?`<div class="order-actions"><button class="approve" onclick="approveOrder('${esc(o.order_number)}',event)">✅ موافقة وتفعيل</button><button class="reject" onclick="rejectOrder('${esc(o.order_number)}',event)">❌ رفض الطلب</button></div>`:''}</article>`}).join(''):'<div class="empty">📭 لا توجد طلبات مطابقة.</div>';document.querySelectorAll('.order').forEach(c=>c.querySelector('.head').onclick=()=>{document.querySelectorAll('.order.open').forEach(x=>x!==c&&x.classList.remove('open'));c.classList.toggle('open')})}
async function load(){try{const s=await session();const r=await fetch(U+'/rest/v1/orders?select=*&order=order_number.desc',{headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'}});const text=await r.text();let data=[];try{data=text?JSON.parse(text):[]}catch{}if(!r.ok)throw new Error(data?.message||data?.details||'تعذر تحميل الطلبات');rows=Array.isArray(data)?data:[];render()}catch(e){if(e.message.includes('تسجيل الدخول')){location.href='customers.html';return}$('count').textContent='خطأ';$('list').innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}
async function approveOrder(orderNumber,e){e.stopPropagation();if(!confirm('هل أنت متأكد من الموافقة على الطلب وتفعيله؟'))return;try{await rpc('/rest/v1/rpc/approve_order',{p_order_number:orderNumber});await load();alert('✅ تم قبول الطلب وتفعيل التجديد وتسجيل العملية المالية')}catch(err){alert('❌ '+(err.message||'تعذر قبول الطلب'))}}
async function rejectOrder(orderNumber,e){e.stopPropagation();if(!confirm('هل أنت متأكد من رفض الطلب؟'))return;try{await rpc('/rest/v1/rpc/reject_order_payment',{input_order_number:orderNumber});await load();alert('❌ تم رفض الطلب')}catch(err){alert('❌ '+(err.message||'تعذر رفض الطلب'))}}
$('search').oninput=render;$('filter').onchange=render;load();setInterval(load,15000);
</script></body></html>
