<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبات جديدة | CASH BACK</title>
<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f7f6fb;color:#1d2435}.wrap{max-width:1000px;margin:auto;padding:25px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.title{font-size:26px;font-weight:900;color:#5420b8}.back{border:0;border-radius:12px;padding:11px 16px;background:#eee4ff;color:#5420b8;font-weight:bold;cursor:pointer}.count{color:#858b9b;margin-top:4px}.list{display:grid;gap:10px}.order{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}.head{min-height:68px;padding:12px 55px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;cursor:pointer}.head:before{content:'⌄';position:absolute;right:16px;width:28px;height:28px;border-radius:50%;background:#eee4ff;color:#5420b8;display:grid;place-items:center;font-weight:900}.order.open .head:before{transform:rotate(180deg);background:#5420b8;color:#fff}.name{font-size:18px;font-weight:900}.meta{font-size:12px;color:#858b9b;margin-top:4px}.price{font-weight:900;color:#5420b8}.details{display:none;border-top:1px solid #eee;padding:12px;grid-template-columns:repeat(2,1fr);gap:9px}.order.open .details{display:grid}.box{background:#f8f8fb;border-radius:11px;padding:10px}.box small{display:block;color:#8991a2;font-size:10px;margin-bottom:5px}.box strong{font-size:13px;word-break:break-word}.badge{font-size:11px;font-weight:bold;border-radius:20px;padding:7px 10px;background:#fff0d5;color:#9a5a00;white-space:nowrap}.empty{background:#fff;border:1px solid #eee;border-radius:16px;padding:30px;text-align:center;color:#858b9b}@media(max-width:600px){.wrap{padding:16px}.details{grid-template-columns:1fr}.head{padding-left:12px}}
html.dark-mode body{background:#0f172a;color:#f8fafc}html.dark-mode .order,html.dark-mode .empty{background:#1e293b;color:#f8fafc;border-color:#334155}html.dark-mode .meta,html.dark-mode .box small{color:#94a3b8}html.dark-mode .box{background:#263449;border-color:#334155}
</style></head>
<body><main class="wrap"><div class="top"><div><div class="title">🆕 طلبات الباقات الجديدة</div><div id="count" class="count">جاري التحميل...</div></div><button class="back" onclick="history.back()">← رجوع</button></div><div id="list" class="list"><div class="empty">⏳ جاري تحميل الطلبات...</div></div></main>
<script>
const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';const H={apikey:K,Authorization:'Bearer '+K};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
async function load(){try{const r=await fetch(U+'/rest/v1/orders?select=*&status=in.(pending,payment_submitted)&order=order_number.desc',{headers:H});if(!r.ok)throw 0;const rows=await r.json();count.textContent=`${rows.length} طلب جديد`;list.innerHTML=rows.length?rows.map(o=>{const pkg=o.package_name||((o.package_gb||'-')+' جيجا'),price=o.final_price??o.original_price??0,st=o.status==='payment_submitted'?'💳 تم إرسال الدفع':'⏳ في انتظار الدفع';return `<article class="order"><div class="head"><div><div class="name">${esc(o.subscriber_name||'بدون اسم')}</div><div class="meta">#${esc(o.order_number||'-')} · ${esc(pkg)} · ${st}</div></div><div><div class="price">${money(price)} ج</div><span class="badge">طلب جديد</span></div></div><div class="details"><div class="box"><small>رقم العميل</small><strong>${esc(o.phone||'-')}</strong></div><div class="box"><small>الباقة</small><strong>${esc(pkg)}</strong></div><div class="box"><small>السعر</small><strong>${money(price)} جنيه</strong></div><div class="box"><small>الكود</small><strong>${esc(o.promo_code||'لا يوجد')}</strong></div><div class="box"><small>الحالة</small><strong>${st}</strong></div><div class="box"><small>رقم الطلب</small><strong>${esc(o.order_number||'-')}</strong></div></div></article>`}).join(''):'<div class="empty">لا توجد طلبات جديدة حاليًا ✅</div>';document.querySelectorAll('.order').forEach(c=>c.querySelector('.head').onclick=()=>{document.querySelectorAll('.order.open').forEach(o=>o!==c&&o.classList.remove('open'));c.classList.toggle('open')})}catch(e){list.innerHTML='<div class="empty">تعذر تحميل الطلبات الجديدة.</div>'}}load();
</script></body></html>
