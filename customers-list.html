<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العملاء | CASH BACK</title><script src="theme.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f7f6fb;color:#1d2435}.wrap{max-width:1200px;margin:auto;padding:24px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.title{font-size:27px;font-weight:900;color:#5420b8}.sub{color:#858b9b;margin-top:5px}.top-actions{display:flex;gap:9px}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:bold;cursor:pointer}.back{background:#eee4ff;color:#5420b8}.theme{background:#fff;border:1px solid #ddd;font-size:20px}.tools{background:#fff;border:1px solid #eee;border-radius:20px;padding:16px;margin-bottom:18px;box-shadow:0 5px 22px #00000008}.tools-title{font-size:18px;font-weight:900;color:#5420b8;margin-bottom:12px}.toolbar{display:flex;gap:10px}.toolbar input,.toolbar select{height:48px;border:1px solid #ddd;border-radius:13px;background:#fff;padding:0 13px;outline:none}.toolbar input{flex:1}.list{display:grid;gap:13px}.card{background:#fff;border:1px solid #eee;border-radius:20px;overflow:hidden;box-shadow:0 5px 22px #00000008}.head{min-height:76px;padding:14px 58px 14px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;cursor:pointer}.head:before{content:'‹';position:absolute;right:17px;width:34px;height:34px;border-radius:50%;background:#eee4ff;color:#5420b8;display:grid;place-items:center;font-size:25px;font-weight:900;transition:.2s}.card.open .head:before{transform:rotate(-90deg);background:#5420b8;color:#fff}.name{font-size:19px;font-weight:900}.internal{font-size:12px;font-weight:bold;color:#5420b8;margin-top:5px}.phone{font-size:13px;color:#858b9b;margin-top:4px}.badge{font-size:11px;font-weight:bold;border-radius:20px;padding:8px 11px;background:#e4f8ec;color:#159447;white-space:nowrap}.badge.soon{background:#fff3d6;color:#9a6500}.badge.expired{background:#fde8ea;color:#d93645}.details{display:none;border-top:1px solid #eee;padding:14px;grid-template-columns:repeat(3,1fr);gap:10px}.card.open .details{display:grid}.box{background:#f8f8fb;border-radius:13px;padding:12px}.box small{display:block;color:#8991a2;font-size:10px;margin-bottom:6px}.box strong{font-size:13px;word-break:break-word}.actions{display:none;padding:0 14px 14px;gap:9px;flex-wrap:wrap}.card.open .actions{display:flex}.action{border:0;border-radius:12px;padding:10px 15px;font-weight:bold;cursor:pointer;flex:1;min-width:120px}.renew{background:#e4f8ec;color:#08752d}.edit{background:#eee4ff;color:#5420b8}.invoice{background:#fff3d6;color:#9a6500}.delete{background:#fde8ea;color:#d93645}.empty,.error{background:#fff;border:1px solid #eee;border-radius:18px;padding:32px;text-align:center;color:#858b9b}.error{color:#d93645}html.dark-mode body{background:#0f172a!important;color:#f8fafc!important}html.dark-mode .tools,html.dark-mode .card,html.dark-mode .empty,html.dark-mode .error{background:#1e293b!important;color:#f8fafc!important;border-color:#334155!important}html.dark-mode .toolbar input,html.dark-mode .toolbar select{background:#334155!important;color:#f8fafc!important;border-color:#475569!important}html.dark-mode .box{background:#263449!important}html.dark-mode .phone,html.dark-mode .sub,html.dark-mode .box small{color:#94a3b8!important}@media(max-width:650px){.wrap{padding:16px 12px}.top{align-items:flex-start}.title{font-size:22px}.toolbar{flex-direction:column}.details{grid-template-columns:1fr 1fr}.top-actions{flex-shrink:0}}@media(max-width:390px){.details{grid-template-columns:1fr}.action{min-width:100%}}</style></head><body><main class="wrap"><div class="top"><div><div class="title" id="pageTitle">👥 كل العملاء</div><div class="sub" id="count">جاري تحميل العملاء...</div></div><div class="top-actions"><button class="btn theme" id="theme-toggle" type="button"><span id="theme-icon">🌙</span></button><button class="btn back" onclick="location.href='customers.html'">← الإدارة</button></div></div><section class="tools"><div class="tools-title">🔎 البحث والتصفية</div><div class="toolbar"><input id="search" placeholder="ابحث باسم العميل أو الاسم عندي أو الرقم..."><select id="renewal"><option value="all">كل التجديدات</option><option value="1">تجديد يوم 1</option><option value="16">تجديد يوم 16</option><option value="soon">تجديد قريب</option></select></div></section><div id="list" class="list"><div class="empty">⏳ جاري تحميل العملاء...</div></div></main><script>const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY',ADMIN='mezooelzorkany@gmail.com';const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id);let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2});function daysUntil(v){if(!v)return null;const t=new Date();t.setHours(0,0,0,0);return Math.ceil((new Date(String(v).slice(0,10)+'T00:00:00')-t)/86400000)}async function session(){const s=await db.auth.getSession(),x=s.data.session;if(!x||String(x.user?.email||'').toLowerCase()!==ADMIN.toLowerCase())throw new Error('جلسة الإدارة غير موجودة');return x}function render(){const q=$('search').value.trim().toLowerCase(),f=$('renewal').value;const data=rows.filter(x=>{const text=[x.subscriber_name,x.internal_name,x.phone,x.primary_number].join(' ').toLowerCase(),d=daysUntil(x.next_renewal_date);if(q&&!text.includes(q))return false;if(f==='1'&&Number(x.renewal_day)!==1)return false;if(f==='16'&&Number(x.renewal_day)!==16)return false;if(f==='soon'&&!(d!==null&&d>=0&&d<=7))return false;return true});$('count').textContent=data.length+' عميل';$('pageTitle').textContent=f==='1'?'📅 عملاء تجديد يوم 1':f==='16'?'📅 عملاء تجديد يوم 16':f==='soon'?'🕐 التجديدات القريبة':'👥 كل العملاء';$('list').innerHTML=data.length?data.map(x=>{const d=daysUntil(x.next_renewal_date),badge=d!==null&&d<0?'<span class="badge expired">🔴 منتهي</span>':d!==null&&d<=7?'<span class="badge soon">🟠 قرب التجديد</span>':'<span class="badge">🟢 ساري</span>';return `<article class="card" data-id="${esc(x.id)}"><div class="head"><div><div class="name">${esc(x.subscriber_name||'بدون اسم')}</div>${x.internal_name?`<div class="internal">🏷️ عندي: ${esc(x.internal_name)}</div>`:''}<div class="phone">📱 ${esc(x.phone||'-')}</div></div>${badge}</div><div class="details"><div class="box"><small>الرقم الأساسي</small><strong>${esc(x.primary_number||'-')}</strong></div><div class="box"><small>الباقة</small><strong>${esc(x.package_name||'-')}</strong></div><div class="box"><small>الجيجا</small><strong>${esc(x.allocated_gb??'-')} GB</strong></div><div class="box"><small>السعر النهائي</small><strong>${money(Math.max(0,Number(x.last_price||0)-Number(x.discount_amount||0)))} جنيه</strong></div><div class="box"><small>موعد التجديد</small><strong>${esc(x.next_renewal_date||'-')}</strong></div><div class="box"><small>طريقة الدفع</small><strong>${esc(x.payment_method||'-')}</strong></div><div class="box"><small>عدد الطلبات</small><strong>${esc(x.total_orders??0)}</strong></div><div class="box"><small>كود الخصم</small><strong>${esc(x.promo_code||'لا يوجد')}</strong></div><div class="box"><small>الخصم</small><strong>${x.discount_amount?'- '+money(x.discount_amount)+' جنيه':'لا يوجد'}</strong></div></div><div class="actions"><button class="action renew" data-renew="${esc(x.id)}">🔄 تجديد</button><button class="action edit" data-edit="${esc(x.id)}">✏️ تعديل</button><button class="action invoice" data-invoice="${esc(x.id)}">🧾 الفاتورة</button><button class="action delete" data-delete="${esc(x.id)}">🗑️ حذف العميل</button></div></article>`}).join(''):'<div class="empty">📭 لا يوجد عملاء مطابقون.</div>';document.querySelectorAll('.card').forEach(c=>{c.querySelector('.head').onclick=()=>{document.querySelectorAll('.card.open').forEach(o=>{if(o!==c)o.classList.remove('open')});c.classList.toggle('open')};const stop=e=>e.stopPropagation();const r=c.querySelector('[data-renew]');r.onclick=e=>{stop(e);location.href='admin-renew.html?id='+encodeURIComponent(r.dataset.renew)};const ed=c.querySelector('[data-edit]');ed.onclick=e=>{stop(e);location.href='edit-customer.html?id='+encodeURIComponent(ed.dataset.edit)};const inv=c.querySelector('[data-invoice]');inv.onclick=e=>{stop(e);location.href='invoices.html?customer='+encodeURIComponent(inv.dataset.invoice)};const del=c.querySelector('[data-delete]');del.onclick=async e=>{stop(e);await deleteCustomer(del.dataset.delete)}})}async function deleteCustomer(id){const c=rows.find(x=>String(x.id)===String(id));if(!c)return;if(!confirm('⚠️ حذف العميل\n\n'+(c.subscriber_name||'بدون اسم')+'\n'+(c.phone||'-')+'\n\nسيتم إخفاؤه من قائمة العملاء. هل أنت متأكد؟'))return;try{const s=await session(),now=new Date().toISOString();const r=await fetch(U+'/rest/v1/customers?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({deleted_at:now,updated_at:now})});const data=await r.json().catch(()=>null);if(!r.ok)throw new Error(data?.message||data?.details||'لم يتم حذف العميل');await load();alert('✅ تم حذف العميل')}catch(e){alert('❌ '+e.message)}}async function load(){try{const s=await session();const r=await fetch(U+'/rest/v1/customers?select=*&deleted_at=is.null&order=next_renewal_date.asc',{headers:{apikey:K,Authorization:'Bearer '+s.access_token}});const data=await r.json();if(!r.ok)throw new Error(data?.message||data?.details||'تعذر تحميل العملاء');rows=Array.isArray(data)?data:[];const f=new URLSearchParams(location.search).get('filter')||'all';$('renewal').value=['1','16','soon'].includes(f)?f:'all';render()}catch(e){$('count').textContent='خطأ';$('list').innerHTML='<div class="error">❌ '+esc(e.message)+'</div>'}}$('search').oninput=render;$('renewal').onchange=render;load();</script></body></html>
