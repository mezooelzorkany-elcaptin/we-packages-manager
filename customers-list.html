<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العملاء | CASH BACK</title><script src="theme.js"></script><style>*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f7f6fb;color:#1d2435}.wrap{max-width:1100px;margin:auto;padding:25px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.title{font-size:26px;font-weight:900;color:#5420b8}.back{border:0;border-radius:12px;padding:11px 16px;background:#eee4ff;color:#5420b8;font-weight:bold;cursor:pointer}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input,.tools select{height:48px;border:1px solid #ddd;border-radius:12px;background:#fff;padding:0 13px;outline:none}.tools input{flex:1}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}.head{min-height:68px;padding:12px 55px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;cursor:pointer}.head:before{content:'⌄';position:absolute;right:16px;width:28px;height:28px;border-radius:50%;background:#eee4ff;color:#5420b8;display:grid;place-items:center;font-weight:900}.card.open .head:before{transform:rotate(180deg);background:#5420b8;color:#fff}.name{font-size:18px;font-weight:900}.internal{font-size:12px;font-weight:bold;color:#5420b8;margin-top:4px}.phone{font-size:13px;color:#858b9b;margin-top:4px}.badge{font-size:11px;font-weight:bold;border-radius:20px;padding:7px 10px;background:#e4f8ec;color:#159447;white-space:nowrap}.badge.soon{background:#fff0d5;color:#9a5a00}.badge.expired{background:#fde8ea;color:#c73542}.details{display:none;border-top:1px solid #eee;padding:12px;grid-template-columns:repeat(2,1fr);gap:9px}.card.open .details{display:grid}.box{background:#f8f8fb;border-radius:11px;padding:10px}.box small{display:block;color:#8991a2;font-size:10px;margin-bottom:5px}.box strong{font-size:13px;word-break:break-word}.actions{display:none;padding:0 12px 12px;gap:8px}.card.open .actions{display:flex}.action{border:0;border-radius:10px;padding:9px 12px;background:#eee4ff;color:#5420b8;font-weight:bold;cursor:pointer}.empty,.error{background:#fff;border:1px solid #eee;border-radius:16px;padding:30px;text-align:center;color:#858b9b}.error{color:#b00020}@media(max-width:600px){.wrap{padding:16px}.tools{flex-direction:column}.details{grid-template-columns:1fr}.head{padding-left:12px}}html.dark-mode body{background:#0f172a;color:#f8fafc}html.dark-mode .card,html.dark-mode .empty,html.dark-mode .error,html.dark-mode .tools input,html.dark-mode .tools select{background:#1e293b;color:#f8fafc;border-color:#334155}html.dark-mode .phone,html.dark-mode .box small{color:#94a3b8}html.dark-mode .box{background:#263449;border-color:#334155}html.dark-mode .internal{color:#c4a5ff}</style></head><body><main class="wrap"><div class="top"><div><div class="title" id="pageTitle">👥 العملاء</div><div id="count" style="color:#858b9b;margin-top:4px">جاري التحقق...</div></div><button class="back" onclick="location.href='customers.html'">← الإدارة</button></div><div class="tools"><input id="search" placeholder="بحث باسم العميل أو الاسم عندي أو الرقم..."><select id="renewal"><option value="all">كل التجديدات</option><option value="1">تجديد يوم 1</option><option value="16">تجديد يوم 16</option><option value="soon">تجديد قريب</option></select></div><div id="list" class="list"><div class="empty">⏳ جاري تحميل العملاء...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY',ADMIN='mezooelzorkany@gmail.com';
const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);let rows=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
function daysUntil(date){if(!date)return null;const t=new Date();t.setHours(0,0,0,0);return Math.ceil((new Date(date+'T00:00:00')-t)/86400000)}
function getParam(){return new URLSearchParams(location.search).get('filter')||'all'}
function render(){const q=($('search').value||'').trim().toLowerCase(),f=$('renewal').value;let data=rows.filter(x=>{const name=String(x.subscriber_name||'').toLowerCase(),internal=String(x.internal_name||'').toLowerCase(),phone=String(x.phone||'').toLowerCase(),primary=String(x.primary_number||'').toLowerCase(),d=daysUntil(x.next_renewal_date);if(q&&!name.includes(q)&&!internal.includes(q)&&!phone.includes(q)&&!primary.includes(q))return false;if(f==='1'&&Number(x.renewal_day)!==1)return false;if(f==='16'&&Number(x.renewal_day)!==16)return false;if(f==='soon'&&!(d!==null&&d>=0&&d<=7))return false;return true});$('count').textContent=`${data.length} عميل`;$('pageTitle').textContent=f==='1'?'📅 عملاء تجديد يوم 1':f==='16'?'📅 عملاء تجديد يوم 16':f==='soon'?'🕐 التجديدات القريبة':'👥 كل العملاء';$('list').innerHTML=data.length?data.map(x=>{const name=x.subscriber_name||'بدون اسم',internal=x.internal_name||'',phone=x.phone||'-',d=daysUntil(x.next_renewal_date),badge=d!==null&&d<0?'<span class="badge expired">🔴 منتهي</span>':d!==null&&d<=7?'<span class="badge soon">🟠 قرب التجديد</span>':'<span class="badge">🟢 نشط</span>';return `<article class="card"><div class="head"><div><div class="name">${esc(name)}</div>${internal?`<div class="internal">🏷️ عندي: ${esc(internal)}</div>`:''}<div class="phone">📱 ${esc(phone)}</div></div>${badge}</div><div class="details"><div class="box"><small>الرقم الأساسي</small><strong>${esc(x.primary_number||'-')}</strong></div><div class="box"><small>الباقة</small><strong>${esc(x.package_name||'-')}</strong></div><div class="box"><small>الجيجا</small><strong>${esc(x.allocated_gb??'-')} GB</strong></div><div class="box"><small>السعر</small><strong>${money(x.last_price??0)} جنيه</strong></div><div class="box"><small>موعد التجديد</small><strong>${esc(x.next_renewal_date||'-')}</strong></div><div class="box"><small>يوم التجديد</small><strong>${esc(x.renewal_type==='custom'?'مخصص':x.renewal_day||'-')}</strong></div><div class="box"><small>حالة التجديد</small><strong>${d===null?'-':d<0?'منتهي':d===0?'التجديد اليوم':'متبقي '+d+' يوم'}</strong></div><div class="box"><small>عدد الطلبات</small><strong>${esc(x.total_orders??0)}</strong></div><div class="box"><small>طريقة الدفع</small><strong>${esc(x.payment_method||'-')}</strong></div></div><div class="actions"><button class="action" onclick="event.stopPropagation();location.href='customers.html?edit='+encodeURIComponent(x.id)">✏️ تعديل</button></div></article>`}).join(''):'<div class="empty">لا يوجد عملاء مطابقون.</div>';document.querySelectorAll('.card').forEach(c=>c.querySelector('.head').onclick=()=>{document.querySelectorAll('.card.open').forEach(o=>o!==c&&o.classList.remove('open'));c.classList.toggle('open')})}
async function load(){try{const s=await db.auth.getSession(),session=s.data.session;if(!session||String(session.user?.email||'').toLowerCase()!==ADMIN.toLowerCase())throw new Error('جلسة الإدارة غير موجودة. ارجع لصفحة الإدارة وسجل الدخول ثم اضغط إجمالي العملاء مرة أخرى.');const r=await fetch(U+'/rest/v1/customers?select=*&deleted_at=is.null&order=next_renewal_date.asc',{headers:{apikey:K,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}});const text=await r.text();let data=[];try{data=text?JSON.parse(text):[]}catch{}if(!r.ok)throw new Error(data?.message||data?.details||'تعذر تحميل العملاء');rows=Array.isArray(data)?data:[];const f=getParam();$('renewal').value=['1','16','soon'].includes(f)?f:'all';render()}catch(e){$('count').textContent='خطأ';$('list').innerHTML='<div class="error">❌ '+esc(e.message||'تعذر تحميل العملاء')+'<br><br><button class="action" onclick="location.href=\'customers.html\'">← الرجوع للإدارة</button></div>'}}
$('search').oninput=render;$('renewal').onchange=render;load();
</script></body></html>
