<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>العملاء | CASH BACK</title>
<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f7f6fb;color:#1d2435}.wrap{max-width:1100px;margin:auto;padding:25px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.title{font-size:26px;font-weight:900;color:#5420b8}.back{border:0;border-radius:12px;padding:11px 16px;background:#eee4ff;color:#5420b8;font-weight:bold;cursor:pointer}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input,.tools select{height:48px;border:1px solid #ddd;border-radius:12px;background:#fff;padding:0 13px;outline:none}.tools input{flex:1}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}.head{min-height:68px;padding:12px 55px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;cursor:pointer}.head:before{content:'⌄';position:absolute;right:16px;width:28px;height:28px;border-radius:50%;background:#eee4ff;color:#5420b8;display:grid;place-items:center;font-weight:900}.card.open .head:before{transform:rotate(180deg);background:#5420b8;color:#fff}.name{font-size:18px;font-weight:900}.phone{font-size:13px;color:#858b9b;margin-top:4px}.badge{font-size:11px;font-weight:bold;border-radius:20px;padding:7px 10px;background:#e4f8ec;color:#159447;white-space:nowrap}.details{display:none;border-top:1px solid #eee;padding:12px;grid-template-columns:repeat(2,1fr);gap:9px}.card.open .details{display:grid}.box{background:#f8f8fb;border-radius:11px;padding:10px}.box small{display:block;color:#8991a2;font-size:10px;margin-bottom:5px}.box strong{font-size:13px;word-break:break-word}.actions{display:none;padding:0 12px 12px}.card.open .actions{display:flex}.empty{background:#fff;border:1px solid #eee;border-radius:16px;padding:30px;text-align:center;color:#858b9b}@media(max-width:600px){.wrap{padding:16px}.tools{flex-direction:column}.details{grid-template-columns:1fr}}
html.dark-mode body{background:#0f172a;color:#f8fafc}html.dark-mode .card,html.dark-mode .empty,html.dark-mode .tools input,html.dark-mode .tools select{background:#1e293b;color:#f8fafc;border-color:#334155}html.dark-mode .phone,html.dark-mode .box small{color:#94a3b8}html.dark-mode .box{background:#263449;border-color:#334155}
</style>
</head>
<body><main class="wrap"><div class="top"><div><div class="title" id="pageTitle">👥 العملاء</div><div id="count" style="color:#858b9b;margin-top:4px"></div></div><button class="back" onclick="history.back()">← رجوع</button></div><div class="tools"><input id="search" placeholder="بحث باسم العميل أو الرقم..."><select id="renewal"><option value="all">كل التجديدات</option><option value="1">تجديد يوم 1</option><option value="16">تجديد يوم 16</option></select></div><div id="list" class="list"><div class="empty">⏳ جاري تحميل العملاء...</div></div></main>
<script>
const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';
const H={apikey:K,Authorization:'Bearer '+K};let rows=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2});
function getParam(){return new URLSearchParams(location.search).get('filter')||'all'}
function render(){const q=(search.value||'').trim().toLowerCase(),f=renewal.value;let data=rows.filter(x=>(!q||String(x.name||x.full_name||x.customer_name||'').toLowerCase().includes(q)||String(x.phone||'').includes(q))&&(!f||f==='all'||String(x.renewal_day)===f));count.textContent=`${data.length} عميل`;list.innerHTML=data.length?data.map((x,i)=>{let name=x.name||x.full_name||x.customer_name||'بدون اسم',phone=x.phone||x.mobile||'-';return `<article class="card"><div class="head"><div><div class="name">${esc(name)}</div><div class="phone">📱 ${esc(phone)}</div></div><span class="badge">${x.renewal_day==1?'تجديد يوم 1':x.renewal_day==16?'تجديد يوم 16':'نشط'}</span></div><div class="details"><div class="box"><small>الرقم</small><strong>${esc(phone)}</strong></div><div class="box"><small>التجديد</small><strong>${esc(x.renewal_day||'-')}</strong></div><div class="box"><small>الباقة</small><strong>${esc(x.package_name||x.package||'-')}</strong></div><div class="box"><small>السعر</small><strong>${money(x.price||x.amount||0)} جنيه</strong></div></div></article>`}).join(''):'<div class="empty">لا يوجد عملاء مطابقون.</div>';document.querySelectorAll('.card').forEach(c=>c.querySelector('.head').onclick=()=>{document.querySelectorAll('.card.open').forEach(o=>o!==c&&o.classList.remove('open'));c.classList.toggle('open')})}
async function load(){try{let r=await fetch(U+'/rest/v1/customers?select=*&deleted_at=is.null',{headers:H});if(!r.ok)throw 0;rows=await r.json();const f=getParam();if(f==='day1')renewal.value='1';if(f==='day16')renewal.value='16';render()}catch(e){list.innerHTML='<div class="empty">تعذر تحميل العملاء.</div>'}}
search.oninput=render;renewal.onchange=render;load();
</script></body></html>
