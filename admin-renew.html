<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجديد العميل | CASH BACK</title><script src="theme.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f7f6fb;color:#1d2435}.wrap{max-width:760px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:25px;font-weight:900;color:#5420b8}.back{border:0;border-radius:13px;padding:11px 15px;background:#eee4ff;color:#5420b8;font-weight:bold;cursor:pointer}.card{background:#fff;border:1px solid #eee;border-radius:22px;padding:20px;box-shadow:0 8px 30px #0000000b;margin-bottom:15px}.customer{background:linear-gradient(135deg,#5420b8,#9747ff);color:#fff}.customer h2{margin:0 0 8px}.customer p{margin:6px 0;opacity:.92}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;height:48px;border:1px solid #ddd;border-radius:12px;padding:0 12px;background:#fff;outline:none}.field textarea{height:85px;padding:12px;resize:vertical}.full{grid-column:1/-1}.payment{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pay{border:1px solid #ddd;border-radius:13px;background:#f8f8fb;padding:13px;font-weight:bold;cursor:pointer}.pay.active{background:#e4f8ec;color:#08752d;border-color:#9bd9b1}.file{height:auto!important;padding:12px!important}.save{width:100%;height:54px;border:0;border-radius:14px;background:linear-gradient(135deg,#5420b8,#9747ff);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.save:disabled{opacity:.6}.msg{text-align:center;font-weight:bold;padding:10px;line-height:1.7}.success{text-align:center;background:#e4f8ec;color:#08752d;border-radius:15px;padding:16px;display:none}html.dark-mode body{background:#0f172a!important;color:#f8fafc!important}html.dark-mode .card{background:#1e293b!important;border-color:#334155!important}html.dark-mode .field input,html.dark-mode .field select,html.dark-mode .field textarea{background:#334155!important;color:#fff!important;border-color:#475569!important}html.dark-mode .pay{background:#334155;color:#fff;border-color:#475569}html.dark-mode .pay.active{background:#14532d;color:#bbf7d0;border-color:#166534}@media(max-width:600px){.grid,.payment{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start}.title{font-size:21px}}</style></head><body><main class="wrap"><div class="top"><div class="title">🔄 تجديد العميل</div><button class="back" onclick="location.href='customers-list.html'">← العملاء</button></div><section id="customerCard" class="card customer"><h2 id="name">جاري التحميل...</h2><p id="phone"></p><p id="package"></p><p id="currentRenewal"></p></section><section class="card"><div class="grid"><div class="field"><label>💰 مبلغ التجديد</label><input id="amount" type="number" min="0" step="0.01"></div><div class="field"><label>📅 التجديد القادم</label><input id="next" type="date"></div><div class="field"><label>📌 نظام التجديد</label><select id="renewalType"><option value="day_1">يوم 1</option><option value="day_16">يوم 16</option><option value="custom">تاريخ مخصص</option></select></div><div class="field"><label>🔢 يوم التجديد</label><input id="renewalDay" type="number" min="1" max="31"></div><div class="field full"><label>💳 طريقة الدفع</label><div class="payment"><button type="button" class="pay active" data-pay="الدفع النقدي">💵 الدفع النقدي</button><button type="button" class="pay" data-pay="InstaPay">📲 InstaPay</button><button type="button" class="pay" data-pay="Vodafone Cash">📱 Vodafone Cash</button><button type="button" class="pay" data-pay="تحويل بنكي">🏦 تحويل بنكي</button></div></div><div class="field full"><label>🖼️ صورة التحويل / إثبات الدفع (اختياري)</label><input id="shot" class="file" type="file" accept="image/*"><small style="display:block;color:#888;margin-top:5px">في حالة الكاش اتركها فارغة.</small></div><div class="field full"><label>📝 ملاحظات</label><textarea id="notes" placeholder="مثال: تم التجديد يدويًا من الإدارة"></textarea></div></div><div id="msg" class="msg"></div><button id="save" class="save">✅ تأكيد التجديد وتسجيل العملية</button><div id="success" class="success"></div></section></main><script>const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY',ADMIN='mezooelzorkany@gmail.com';const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');let customer=null,payment='الدفع النقدي';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function pad(n){return String(n).padStart(2,'0')}function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function nextDate(day){const d=new Date();d.setHours(0,0,0,0);let y=d.getFullYear(),m=d.getMonth();if(day<=d.getDate())m++;return new Date(y,m,day)}async function load(){try{if(!id)throw Error('لم يتم تحديد العميل');const s=await db.auth.getSession(),session=s.data.session;if(!session||String(session.user?.email||'').toLowerCase()!==ADMIN.toLowerCase())throw Error('جلسة الإدارة غير موجودة');const r=await db.from('customers').select('*').eq('id',id).is('deleted_at',null).single();if(r.error)throw r.error;customer=r.data;$('name').textContent='👤 '+(customer.subscriber_name||'بدون اسم');$('phone').textContent='📱 '+(customer.phone||'-');$('package').textContent='📦 '+(customer.package_name||'-')+' — '+(Number(customer.allocated_gb)||0)+' GB';$('currentRenewal').textContent='📅 التجديد الحالي: '+(customer.next_renewal_date||'-');$('amount').value=Math.max(0,Number(customer.last_price||0)-Number(customer.discount_amount||0));const rt=customer.renewal_type||'day_1';$('renewalType').value=rt;$('renewalDay').value=customer.renewal_day||'';if(Number(customer.renewal_day)===1)$('next').value=fmtDate(nextDate(1));else if(Number(customer.renewal_day)===16)$('next').value=fmtDate(nextDate(16));else $('next').value=customer.next_renewal_date||fmtDate(nextDate(1));}catch(e){$('msg').style.color='#b00020';$('msg').textContent='❌ '+e.message;$('save').disabled=true}}document.querySelectorAll('.pay').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));b.classList.add('active');payment=b.dataset.pay});$('renewalType').onchange=()=>{const t=$('renewalType').value;if(t==='day_1'){ $('renewalDay').value=1;$('next').value=fmtDate(nextDate(1))}else if(t==='day_16'){$('renewalDay').value=16;$('next').value=fmtDate(nextDate(16))}});async function imageData(file){if(!file)return null;return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1100,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}async function save(){if(!customer)return;const b=$('save');b.disabled=true;b.textContent='⏳ جاري تسجيل التجديد...';$('msg').textContent='';try{const s=await db.auth.getSession(),session=s.data.session;if(!session)throw Error('انتهت جلسة الإدارة');const amount=Number($('amount').value);if(!(amount>=0))throw Error('اكتب مبلغ التجديد');const next=$('next').value;if(!next)throw Error('حدد تاريخ التجديد القادم');const now=new Date().toISOString(),order='CB-R-'+Date.now().toString(36).toUpperCase();const shot=await imageData($('shot').files[0]);const orderBody={order_number:order,customer_id:customer.id,subscriber_name:customer.subscriber_name,phone:customer.phone,package_name:customer.package_name,package_gb:customer.allocated_gb,original_price:amount,final_price:amount,payment_method:payment,payment_screenshot:shot,renewal_type:$('renewalType').value,renewal_day:Number($('renewalDay').value)||null,status:'completed'};let r=await db.from('orders').insert(orderBody);if(r.error)throw r.error;r=await db.from('invoices').insert({order_number:order,customer_id:customer.id,customer_name:customer.subscriber_name,phone:customer.phone,package_name:customer.package_name,package_gb:customer.allocated_gb,original_price:amount,discount_code:null,discount_amount:0,amount:amount,notes:'تجديد يدوي — '+payment+($('notes').value.trim()?' — '+$('notes').value.trim():'')});if(r.error)throw r.error;r=await db.from('financial_transactions').insert({customer_id:customer.id,customer_name:customer.subscriber_name,customer_phone:customer.phone,primary_number:customer.primary_number||null,package_name:customer.package_name,amount:amount,transaction_type:'income',transaction_date:now,created_at:now,order_number:order,notes:'تجديد يدوي — '+payment+($('notes').value.trim()?' — '+$('notes').value.trim():'')});if(r.error)throw r.error;r=await db.from('customers').update({payment_method:payment,next_renewal_date:next,renewal_type:$('renewalType').value,renewal_day:Number($('renewalDay').value)||null,last_renewed_at:now,last_order_at:now,total_orders:Number(customer.total_orders||0)+1,updated_at:now,status:'active'}).eq('id',customer.id);if(r.error)throw r.error;$('success').style.display='block';$('success').innerHTML='✅ تم تجديد <b>'+esc(customer.subscriber_name||'العميل')+'</b> بنجاح<br>رقم العملية: <b>'+esc(order)+'</b><br>وتم تسجيل الفاتورة والعملية المالية.';b.textContent='تم التجديد بنجاح';setTimeout(()=>location.href='customers-list.html',1300)}catch(e){$('msg').style.color='#b00020';$('msg').textContent='❌ لم يتم التجديد: '+e.message;b.disabled=false;b.textContent='✅ تأكيد التجديد وتسجيل العملية'}}$('save').onclick=save;load();</script></body></html>
