<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>العملاء | WE Packages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}
body{margin:0;background:#f5f7fb;color:#172033}
.header{background:linear-gradient(135deg,#151a35,#242b55);color:#fff;padding:24px 18px;border-radius:0 0 24px 24px}
.header h1{margin:0 0 8px;font-size:25px}.header p{margin:0;opacity:.75;font-size:14px}
.container{max-width:1200px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.05)}
.stat-title{color:#7a8194;font-size:13px;margin-bottom:8px}.stat-number{font-size:25px;font-weight:bold}
.topbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.search{flex:1;min-width:220px;padding:14px 16px;border:1px solid #e0e4ed;border-radius:14px;background:#fff;outline:0;font-size:15px}
.filter,.topbtn{padding:13px 15px;border:1px solid #e0e4ed;border-radius:14px;background:#fff;font-size:14px}
.topbtn{background:#242b55;color:#fff;border:0;font-weight:bold;cursor:pointer}
.customers{display:grid;gap:14px}.customer{background:#fff;border-radius:20px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.05)}
.customer-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.customer-name{font-size:18px;font-weight:bold;margin-bottom:6px}.phone{color:#737b8e;font-size:14px}
.badge{padding:7px 11px;border-radius:20px;font-size:12px;white-space:nowrap}
.active{background:#e8f8ef;color:#168448}.inactive{background:#fdebec;color:#c73542}
.details{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.detail{background:#f7f8fb;padding:12px;border-radius:13px}.detail small{display:block;color:#858c9d;margin-bottom:5px;font-size:11px}.detail strong{font-size:14px}
.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:11px 15px;cursor:pointer;font-size:13px}
.primary{background:#242b55;color:#fff}.secondary{background:#eef1f7;color:#252b3c}
.loading,.empty,.error{background:#fff;padding:35px;text-align:center;border-radius:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal.show{display:flex}.modal-box{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}
.modal-box h2{margin-top:0}.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:bold}
.field input,.field select{width:100%;padding:13px;border:1px solid #dfe3eb;border-radius:12px;outline:0;font-size:14px;background:#fff}
.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.container{padding:14px}.customer-head{flex-direction:column}}
</style>
</head>

<body>

<header class="header">
<div class="container">
<h1>👥 العملاء</h1>
<p>إدارة العملاء والتجديدات والاشتراكات</p>
</div>
</header>

<main class="container">

<section class="stats">
<div class="stat">
<div class="stat-title">إجمالي العملاء</div>
<div class="stat-number" id="total">0</div>
</div>

<div class="stat">
<div class="stat-title">العملاء النشطين</div>
<div class="stat-number" id="active">0</div>
</div>

<div class="stat">
<div class="stat-title">تجديد قريب</div>
<div class="stat-number" id="soon">0</div>
</div>

<div class="stat">
<div class="stat-title">منتهية</div>
<div class="stat-number" id="expired">0</div>
</div>
</section>

<section class="topbar">

<button class="topbtn" onclick="openAdd()">➕ إضافة عميل</button>

<input
id="search"
class="search"
type="search"
placeholder="🔎 ابحث بالاسم أو رقم التليفون..."
>

<select id="renewalFilter" class="filter">
<option value="all">كل مواعيد التجديد</option>
<option value="1">تجديد يوم 1</option>
<option value="16">تجديد يوم 16</option>
<option value="custom">تاريخ مخصص</option>
</select>

<select id="statusFilter" class="filter">
<option value="all">كل الحالات</option>
<option value="active">🟢 نشط</option>
<option value="inactive">🔴 موقوف</option>
<option value="soon">🟠 قرب التجديد</option>
<option value="expired">🔴 منتهي</option>
</select>

</section>

<section id="customers" class="customers">
<div class="loading">⏳ جاري تحميل العملاء...</div>
</section>

</main>

<div id="modal" class="modal">

<div class="modal-box">

<h2 id="modalTitle">➕ إضافة عميل</h2>

<input type="hidden" id="customerId">

<div class="field">
<label>اسم العميل *</label>
<input id="customerName" placeholder="مثال: محمد">
</div>

<div class="field">
<label>رقم التليفون *</label>
<input id="customerPhone" inputmode="numeric" placeholder="01xxxxxxxxx">
</div>

<div class="field">
<label>الباقة</label>
<input id="customerPackage" placeholder="مثال: باقة 30 جيجا">
</div>

<div class="field">
<label>السعر</label>
<input id="customerPrice" type="number" min="0" placeholder="0">
</div>

<div class="field">
<label>طريقة الدفع</label>

<select id="paymentMethod">
<option value="">غير محدد</option>
<option value="Vodafone Cash">Vodafone Cash</option>
<option value="Etisalat Cash">Etisalat Cash</option>
<option value="WE Pay">WE Pay</option>
<option value="Orange Cash">Orange Cash</option>
<option value="تحويل بنكي">تحويل بنكي</option>
<option value="كاش">كاش</option>
</select>

</div>

<div class="field">
<label>الحالة</label>

<select id="customerStatus">
<option value="active">🟢 نشط</option>
<option value="inactive">🔴 موقوف</option>
</select>

</div>

<div class="field">
<label>نظام التجديد</label>

<select id="renewalType" onchange="renewalTypeChanged()">
<option value="day_1">يوم 1</option>
<option value="day_16">يوم 16</option>
<option value="custom">تاريخ مخصص</option>
</select>

</div>

<div class="field">
<label>يوم التجديد</label>
<input id="renewalDay" type="number" min="1" max="31">
</div>

<div class="field">
<label>التجديد القادم *</label>
<input id="nextRenewal" type="date">
</div>

<div class="field">
<label>عدد الطلبات السابقة</label>
<input id="totalOrders" type="number" min="0" value="0">
</div>

<div class="field">
<label>تاريخ أول اشتراك</label>
<input id="firstOrderAt" type="date">
</div>

<div class="modal-actions">
<button class="secondary" onclick="closeModal()">إلغاء</button>
<button class="primary" onclick="saveCustomer()">💾 حفظ</button>
</div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let allCustomers=[];
let editMode=false;

async function loadCustomers(){

const container=document.getElementById("customers");

container.innerHTML=
'<div class="loading">⏳ جاري تحميل العملاء...</div>';

const {data,error}=await supabase
.from("customers")
.select("*")
.is("deleted_at",null)
.order("next_renewal_date",
{ascending:true,nullsFirst:false});

if(error){

container.innerHTML=
'<div class="error">❌ حصل خطأ في تحميل العملاء<br><br>'+
escapeHtml(error.message)+
'</div>';

return;
}

allCustomers=data||[];

updateStats();
renderCustomers();

}

function daysUntil(date){

if(!date)return null;

const today=new Date();

today.setHours(0,0,0,0);

const target=new Date(date+"T00:00:00");

return Math.ceil(
(target-today)/86400000
);

}

function updateStats(){

document.getElementById("total").textContent=
allCustomers.length;

document.getElementById("active").textContent=
allCustomers.filter(
c=>c.status==="active"
).length;

document.getElementById("soon").textContent=
allCustomers.filter(c=>{

const d=daysUntil(c.next_renewal_date);

return d!==null&&d>=0&&d<=7;

}).length;

document.getElementById("expired").textContent=
allCustomers.filter(c=>{

const d=daysUntil(c.next_renewal_date);

return d!==null&&d<0;

}).length;

}

function renderCustomers(){

const search=
document.getElementById("search")
.value.toLowerCase().trim();

const renewal=
document.getElementById("renewalFilter").value;

const status=
document.getElementById("statusFilter").value;

const list=allCustomers.filter(c=>{

const name=
String(c.subscriber_name||"")
.toLowerCase();

const phone=
String(c.phone||"")
.toLowerCase();

if(
search &&
!name.includes(search) &&
!phone.includes(search)
)return false;

if(
renewal==="1" &&
Number(c.renewal_day)!==1
)return false;

if(
renewal==="16" &&
Number(c.renewal_day)!==16
)return false;

if(
renewal==="custom" &&
c.renewal_type!=="custom"
)return false;

const d=daysUntil(
c.next_renewal_date
);

if(
status==="active" &&
c.status!=="active"
)return false;

if(
status==="inactive" &&
c.status!=="inactive"
)return false;

if(
status==="soon" &&
!(d!==null&&d>=0&&d<=7)
)return false;

if(
status==="expired" &&
!(d!==null&&d<0)
)return false;

return true;

});

const container=
document.getElementById("customers");

if(!list.length){

container.innerHTML=
'<div class="empty">📭 لا يوجد عملاء مطابقين للبحث.</div>';

return;

}

container.innerHTML=
list.map(customerCard).join("");

}

function customerCard(c){

const d=
daysUntil(c.next_renewal_date);

let renewalText="غير محدد";

if(c.next_renewal_date){

if(d<0)
renewalText=
`🔴 انتهى منذ ${Math.abs(d)} يوم`;

else if(d===0)
renewalText="🟠 التجديد اليوم";

else if(d<=7)
renewalText=
`🟠 متبقي ${d} يوم`;

else
renewalText=
`🟢 متبقي ${d} يوم`;

}

const badge=
c.status==="inactive"
?
'<span class="badge inactive">🔴 موقوف</span>'
:
'<span class="badge active">🟢 نشط</span>';

return `

<article class="customer">

<div class="customer-head">

<div>

<div class="customer-name">
${escapeHtml(c.subscriber_name||"بدون اسم")}
</div>

<div class="phone">
📱 ${escapeHtml(c.phone||"-")}
</div>

</div>

${badge}

</div>

<div class="details">

<div class="detail">
<small>الباقة</small>
<strong>
${escapeHtml(c.package_name||"-")}
</strong>
</div>

<div class="detail">
<small>السعر</small>
<strong>
${c.last_price??"-"} جنيه
</strong>
</div>

<div class="detail">
<small>يوم التجديد</small>
<strong>
${c.renewal_type==="custom"
?"مخصص"
:(c.renewal_day||"-")}
</strong>
</div>

<div class="detail">
<small>التجديد القادم</small>
<strong>
${c.next_renewal_date||"-"}
</strong>
</div>

</div>

<div class="details">

<div class="detail">
<small>آخر تجديد</small>
<strong>
${c.last_renewed_at
?new Date(c.last_renewed_at)
.toLocaleDateString("ar-EG")
:"-"}
</strong>
</div>

<div class="detail">
<small>عدد الطلبات</small>
<strong>
${c.total_orders??0}
</strong>
</div>

<div class="detail">
<small>حالة التجديد</small>
<strong>
${renewalText}
</strong>
</div>

<div class="detail">
<small>طريقة الدفع</small>
<strong>
${escapeHtml(c.payment_method||"-")}
</strong>
</div>

</div>

<div class="actions">

<button
class="primary"
onclick="openEdit(${c.id})">
✏️ تعديل
</button>

<button
class="secondary"
onclick="renewToday(${c.id})">
🔄 تجديد الآن
</button>

</div>

</article>

`;

}

function openAdd(){

editMode=false;

document.getElementById("modalTitle")
.textContent="➕ إضافة عميل";

clearForm();

document.getElementById("renewalType")
.value="day_1";

document.getElementById("renewalDay")
.value=1;

document.getElementById("customerStatus")
.value="active";

document.getElementById("totalOrders")
.value=0;

document.getElementById("modal")
.classList.add("show");

}

function openEdit(id){

const c=
allCustomers.find(
x=>Number(x.id)===Number(id)
);

if(!c)return;

editMode=true;

document.getElementById("modalTitle")
.textContent="✏️ تعديل بيانات العميل";

document.getElementById("customerId")
.value=c.id;

document.getElementById("customerName")
.value=c.subscriber_name||"";

document.getElementById("customerPhone")
.value=c.phone||"";

document.getElementById("customerPackage")
.value=c.package_name||"";

document.getElementById("customerPrice")
.value=c.last_price??"";

document.getElementById("paymentMethod")
.value=c.payment_method||"";

document.getElementById("customerStatus")
.value=c.status||"active";

document.getElementById("renewalType")
.value=c.renewal_type||"day_1";

document.getElementById("renewalDay")
.value=c.renewal_day||"";

document.getElementById("nextRenewal")
.value=c.next_renewal_date||"";

document.getElementById("totalOrders")
.value=c.total_orders??0;

document.getElementById("firstOrderAt")
.value=
c.first_order_at
?String(c.first_order_at).slice(0,10)
:"";

document.getElementById("modal")
.classList.add("show");

}

function clearForm(){

[
"customerId",
"customerName",
"customerPhone",
"customerPackage",
"customerPrice",
"renewalDay",
"nextRenewal",
"firstOrderAt"
]
.forEach(
id=>document.getElementById(id).value=""
);

document.getElementById("paymentMethod")
.value="";

}

function renewalTypeChanged(){

const type=
document.getElementById("renewalType").value;

if(type==="day_1")
document.getElementById("renewalDay").value=1;

else if(type==="day_16")
document.getElementById("renewalDay").value=16;

else
document.getElementById("renewalDay").value="";

}

function closeModal(){

document.getElementById("modal")
.classList.remove("show");

}

async function saveCustomer(){

const name=
document.getElementById("customerName")
.value.trim();

const phone=
document.getElementById("customerPhone")
.value.trim();

const nextDate=
document.getElementById("nextRenewal")
.value;

const type=
document.getElementById("renewalType")
.value;

if(!name||!phone||!nextDate){

alert(
"⚠️ الاسم ورقم التليفون والتجديد القادم مطلوبين"
);

return;

}

let day=
Number(
document.getElementById("renewalDay").value
)||null;

if(type==="day_1")day=1;

if(type==="day_16")day=16;

const firstDate=
document.getElementById("firstOrderAt")
.value;

const now=
new Date().toISOString();

const payload={

subscriber_name:name,

phone:phone,

package_name:
document.getElementById("customerPackage")
.value.trim()||null,

last_price:
Number(
document.getElementById("customerPrice").value
)||0,

payment_method:
document.getElementById("paymentMethod").value||null,

status:
document.getElementById("customerStatus").value,

renewal_type:type,

renewal_day:day,

next_renewal_date:nextDate,

total_orders:
Number(
document.getElementById("totalOrders").value
)||0,

updated_at:now

};

if(firstDate){

payload.first_order_at=
firstDate+"T00:00:00.000Z";

}

if(editMode){

const id=
document.getElementById("customerId").value;

const {error}=
await supabase
.from("customers")
.update(payload)
.eq("id",id);

if(error){

alert(
"❌ حصل خطأ:\n"+
error.message
);

return;

}

}else{

const {
data:existing,
error:findError
}=
await supabase
.from("customers")
.select("id")
.eq("phone",phone)
.is("deleted_at",null)
.limit(1);

if(findError){

alert(
"❌ حصل خطأ في البحث عن الرقم:\n"+
findError.message
);

return;

}

if(existing&&existing.length){

alert(
"⚠️ الرقم ده موجود بالفعل عندك. استخدم تعديل بدل إضافة عميل جديد."
);

return;

}

if(!payload.first_order_at)
payload.first_order_at=now;

const {error}=
await supabase
.from("customers")
.insert(payload);

if(error){

alert(
"❌ حصل خطأ في إضافة العميل:\n"+
error.message
);

return;

}

}

closeModal();

await loadCustomers();

alert(
editMode
?"✅ تم تعديل العميل"
:"✅ تم إضافة العميل بنجاح"
);

}

async function renewToday(id){

const c=
allCustomers.find(
x=>Number(x.id)===Number(id)
);

if(!c)return;

if(!confirm(
`تأكيد تجديد العميل:

${c.subscriber_name}

هل تريد اعتبار اليوم تاريخ التجديد الجديد؟`
))return;

const now=
new Date();

const next=
new Date(now);

next.setMonth(
next.getMonth()+1
);

const {error}=
await supabase
.from("customers")
.update({

last_renewed_at:
now.toISOString(),

last_order_at:
now.toISOString(),

next_renewal_date:
next.toISOString().split("T")[0],

total_orders:
(Number(c.total_orders)||0)+1,

status:"active",

updated_at:
now.toISOString()

})
.eq("id",id);

if(error){

alert(
"❌ حصل خطأ:\n"+
error.message
);

return;

}

await loadCustomers();

}

document.getElementById("search")
.addEventListener(
"input",
renderCustomers
);

document.getElementById("renewalFilter")
.addEventListener(
"change",
renderCustomers
);

document.getElementById("statusFilter")
.addEventListener(
"change",
renderCustomers
);

function escapeHtml(v){

return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

loadCustomers();

</script>

</body>
</html>
