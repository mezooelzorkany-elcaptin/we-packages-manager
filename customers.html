body{

.primary{

.secondary{

.danger{

}

.loading,
.empty,

padding:35px;
text-align:center;

.error{

}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
display:none;
align-items:center;
justify-content:center;
padding:18px;

.modal.show{
display:flex

.modal-box{
width:100%;
max-width:560px;
max-height:92vh;
overflow:auto;

border-radius:22px;
padding:22px

.modal-box h2{
margin-top:0

.field{
margin-bottom:14px

.field label{
display:block;
margin-bottom:6px;
font-size:13px;
font-weight:bold

.field input,
.field select{
width:100%;
padding:13px;
border:1px solid #dfe3eb;
border-radius:12px;
outline:0;
font-size:14px;
background:#fff

.modal-actions{
display:flex;
gap:10px;
margin-top:18px
}

.modal-actions button{
flex:1
}

.close-modal{
float:left;
background:#f1f2f5;
color:#333;
padding:8px 12px

@media(max-width:800px){

.stats{
grid-template-columns:repeat(2,1fr)

@media(max-width:500px){

padding:14px

}

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =========================================
   VARIABLES
========================================= */

let allCustomers = [];

let editMode = false;


/* =========================================
   ELEMENTS
========================================= */

const customersContainer =
document.getElementById("customers");

const modal =
document.getElementById("modal");


/* =========================================
   LOAD CUSTOMERS
========================================= */

async function loadCustomers(){

customersContainer.innerHTML =
'<div class="loading">⏳ جاري تحميل العملاء...</div>';


const {
data,
error
} = await supabase

.from("customers")

.select("*")

.is("deleted_at", null)

.order(
"next_renewal_date",
{
ascending:true,
nullsFirst:false
}
);


if(error){

customersContainer.innerHTML =
'<div class="error">❌ حصل خطأ في تحميل العملاء<br><br>'
+
escapeHtml(error.message)
+
'</div>';

return;

}


allCustomers = data || [];

updateStats();

renderCustomers();

}


/* =========================================
   DAYS UNTIL RENEWAL
========================================= */

function daysUntil(date){

if(!date){
return null;
}


const today = new Date();

today.setHours(
0,
0,
0,
0
);


const target =
new Date(
date + "T00:00:00"
);


return Math.ceil(
(target - today) /
86400000
);

}


/* =========================================
   STATISTICS
========================================= */

function updateStats(){

document.getElementById("total")
.textContent =
allCustomers.length;


document.getElementById("active")
.textContent =
allCustomers.filter(
c => c.status === "active"
).length;


document.getElementById("soon")
.textContent =
allCustomers.filter(c => {

const d =
daysUntil(
c.next_renewal_date
);

return (
d !== null &&
d >= 0 &&
d <= 7
);

}).length;


document.getElementById("expired")
.textContent =
allCustomers.filter(c => {

const d =
daysUntil(
c.next_renewal_date
);

return (
d !== null &&
d < 0
);

}).length;

}


/* =========================================
   RENDER CUSTOMERS
========================================= */

function renderCustomers(){

const search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


const renewal =
document.getElementById("renewalFilter")
.value;


const status =
document.getElementById("statusFilter")
.value;


const list =
allCustomers.filter(c => {


const name =
String(
c.subscriber_name || ""
)
.toLowerCase();


const phone =
String(
c.phone || ""
)
.toLowerCase();


/* البحث */

if(
search &&
!name.includes(search) &&
!phone.includes(search)
){

return false;

}


/* فلتر يوم 1 */

if(
renewal === "1" &&
Number(c.renewal_day) !== 1
){

return false;

}


/* فلتر يوم 16 */

if(
renewal === "16" &&
Number(c.renewal_day) !== 16
){

return false;

}


/* فلتر مخصص */

if(
renewal === "custom" &&
c.renewal_type !== "custom"
){

return false;

}


const d =
daysUntil(
c.next_renewal_date
);


/* نشط */

if(
status === "active" &&
c.status !== "active"
){

return false;

}


/* موقوف */

if(
status === "inactive" &&
c.status !== "inactive"
){

return false;

}


/* قرب التجديد */

if(
status === "soon" &&
!(
d !== null &&
d >= 0 &&
d <= 7
)
){

return false;

}


/* منتهي */

if(
status === "expired" &&
!(
d !== null &&
d < 0
)
){

return false;

}


return true;

});


if(!list.length){

customersContainer.innerHTML =
'<div class="empty">📭 لا يوجد عملاء مطابقين للبحث.</div>';

return;

}


customersContainer.innerHTML =
list
.map(customerCard)
.join("");

}


/* =========================================
   CUSTOMER CARD
========================================= */

function customerCard(c){

const d =
daysUntil(
c.next_renewal_date
);


let renewalText =
"غير محدد";


if(c.next_renewal_date){

if(d < 0){

renewalText =
`🔴 انتهى منذ ${Math.abs(d)} يوم`;

}

else if(d === 0){

renewalText =
"🟠 التجديد اليوم";

}

else if(d <= 7){

renewalText =
`🟠 متبقي ${d} يوم`;

}

else{

renewalText =
`🟢 متبقي ${d} يوم`;

}

}


const badge =
c.status === "inactive"

?

'<span class="badge inactive">🔴 موقوف</span>'

:

'<span class="badge active">🟢 نشط</span>';


return `

<article class="customer">

<div class="customer-head">

<div>

<div class="customer-name">

${escapeHtml(
c.subscriber_name || "بدون اسم"
)}

</div>

<div class="phone">

📱 ${escapeHtml(
c.phone || "-"
)}

</div>

</div>

${badge}

</div>


<div class="details">


<div class="detail">

<small>
الباقة
</small>

<strong>
${escapeHtml(
c.package_name || "-"
)}
</strong>

</div>


<div class="detail">

<small>
السعر
</small>

<strong>
${c.last_price ?? "-"} جنيه
</strong>

</div>


<div class="detail">

<small>
يوم التجديد
</small>

<strong>

${
c.renewal_type === "custom"

? "مخصص"

: (c.renewal_day || "-")

}

</strong>

</div>


<div class="detail">

<small>
التجديد القادم
</small>

<strong>
${c.next_renewal_date || "-"}
</strong>

</div>


</div>


<div class="details">


<div class="detail">

<small>
آخر تجديد
</small>

<strong>

${
c.last_renewed_at

?

new Date(
c.last_renewed_at
)
.toLocaleDateString(
"ar-EG"
)

:

"-"

}

</strong>

</div>


<div class="detail">

<small>
عدد الطلبات
</small>

<strong>
${c.total_orders ?? 0}
</strong>

</div>


<div class="detail">

<small>
حالة التجديد
</small>

<strong>
${renewalText}
</strong>

</div>


<div class="detail">

<small>
طريقة الدفع
</small>

<strong>
${escapeHtml(
c.payment_method || "-"
)}
</strong>

</div>


</div>


<div class="actions">


<button
class="primary"
type="button"
onclick="openEdit(${c.id})"
>
✏️ تعديل
</button>


<button
class="secondary"
type="button"
onclick="renewToday(${c.id})"
>
🔄 تجديد الآن
</button>


<button
class="danger"
type="button"
onclick="deleteCustomer(${c.id})"
>
🗑️ حذف
</button>


</div>


</article>

`;

}


/* =========================================
   OPEN ADD
========================================= */

function openAdd(){

editMode = false;


document.getElementById(
"modalTitle"
)
.textContent =
"➕ إضافة عميل";


clearForm();


document.getElementById(
"renewalType"
)
.value =
"day_1";


document.getElementById(
"renewalDay"
)
.value =
1;


document.getElementById(
"customerStatus"
)
.value =
"active";


document.getElementById(
"totalOrders"
)
.value =
0;


modal.classList.add("show");

}


/* =========================================
   OPEN EDIT
========================================= */

function openEdit(id){

const customer =
allCustomers.find(
x =>
Number(x.id) ===
Number(id)
);


if(!customer){
return;
}


editMode = true;


document.getElementById(
"modalTitle"
)
.textContent =
"✏️ تعديل بيانات العميل";


document.getElementById(
"customerId"
)
.value =
customer.id;


document.getElementById(
"customerName"
)
.value =
customer.subscriber_name || "";


document.getElementById(
"customerPhone"
)
.value =
customer.phone || "";


document.getElementById(
"customerPackage"
)
.value =
customer.package_name || "";


document.getElementById(
"customerPrice"
)
.value =
customer.last_price ?? "";


document.getElementById(
"paymentMethod"
)
.value =
customer.payment_method || "";


document.getElementById(
"customerStatus"
)
.value =
customer.status || "active";


document.getElementById(
"renewalType"
)
.value =
customer.renewal_type || "day_1";


document.getElementById(
"renewalDay"
)
.value =
customer.renewal_day || "";


document.getElementById(
"nextRenewal"
)
.value =
customer.next_renewal_date || "";


document.getElementById(
"totalOrders"
)
.value =
customer.total_orders ?? 0;


document.getElementById(
"firstOrderAt"
)
.value =

customer.first_order_at

?

String(
customer.first_order_at
)
.slice(0,10)

:

"";


modal.classList.add("show");

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

document.getElementById(
"customerId"
)
.value = "";


document.getElementById(
"customerName"
)
.value = "";


document.getElementById(
"customerPhone"
)
.value = "";


document.getElementById(
"customerPackage"
)
.value = "";


document.getElementById(
"customerPrice"
)
.value = "";


document.getElementById(
"paymentMethod"
)
.value = "";


document.getElementById(
"customerStatus"
)
.value = "active";


document.getElementById(
"renewalType"
)
.value = "day_1";


document.getElementById(
"renewalDay"
)
.value = 1;


document.getElementById(
"nextRenewal"
)
.value = "";


document.getElementById(
"totalOrders"
)
.value = 0;


document.getElementById(
"firstOrderAt"
)
.value = "";

}


/* =========================================
   RENEWAL TYPE
========================================= */

function renewalTypeChanged(){

const type =
document.getElementById(
"renewalType"
)
.value;


if(type === "day_1"){

document.getElementById(
"renewalDay"
)
.value = 1;

}

else if(type === "day_16"){

document.getElementById(
"renewalDay"
)
.value = 16;

}

else{

document.getElementById(
"renewalDay"
)
.value = "";

}

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal(){

modal.classList.remove(
"show"
);

}


/* =========================================
   SAVE CUSTOMER
========================================= */

async function saveCustomer(){

const saveBtn =
document.getElementById(
"saveBtn"
);


const name =
document.getElementById(
"customerName"
)
.value
.trim();


const phone =
document.getElementById(
"customerPhone"
)
.value
.trim();


const nextDate =
document.getElementById(
"nextRenewal"
)
.value;


const type =
document.getElementById(
"renewalType"
)
.value;


if(
!name ||
!phone ||
!nextDate
){

alert(
"⚠️ الاسم ورقم التليفون والتجديد القادم مطلوبين"
);

return;

}


/* منع الضغط مرتين */

saveBtn.disabled = true;

saveBtn.textContent =
"⏳ جاري الحفظ...";


try{


let day =
Number(
document.getElementById(
"renewalDay"
)
.value
) || null;


if(type === "day_1"){

day = 1;

}


if(type === "day_16"){

day = 16;

}


const firstDate =
document.getElementById(
"firstOrderAt"
)
.value;


const now =
new Date()
.toISOString();


const payload = {

subscriber_name:
name,

phone:
phone,

package_name:

document.getElementById(
"customerPackage"
)
.value
.trim() || null,

last_price:

Number(
document.getElementById(
"customerPrice"
)
.value
) || 0,

payment_method:

document.getElementById(
"paymentMethod"
)
.value || null,

status:

document.getElementById(
"customerStatus"
)
.value,

renewal_type:
type,

renewal_day:
day,

next_renewal_date:
nextDate,

total_orders:

Number(
document.getElementById(
"totalOrders"
)
.value
) || 0,

updated_at:
now

};


if(firstDate){

payload.first_order_at =
firstDate +
"T00:00:00.000Z";

}


/* =========================================
   EDIT
========================================= */

if(editMode){

const id =
document.getElementById(
"customerId"
)
.value;


const {
error
} =

await supabase

.from("customers")

.update(payload)

.eq("id",id);


if(error){

alert(
"❌ حصل خطأ في تعديل العميل:\n\n"
+
error.message
);

return;

}

}


/* =========================================
   ADD
========================================= */

else{


/* التأكد إن الرقم مش موجود */

const {
data: existing,
error: findError
} =

await supabase

.from("customers")

.select("id")

.eq("phone",phone)

.is("deleted_at",null)

.limit(1);


if(findError){

alert(
"❌ حصل خطأ في البحث عن الرقم:\n\n"
+
findError.message
);

return;

}


if(
existing &&
existing.length
){

alert(
"⚠️ الرقم ده موجود بالفعل عندك.\n\nاستخدم تعديل بدل إضافة عميل جديد."
);

return;

}


if(!payload.first_order_at){

payload.first_order_at =
now;

}


const {
error
} =

await supabase

.from("customers")

.insert(payload);


if(error){

alert(
"❌ حصل خطأ في إضافة العميل:\n\n"
+
error.message
);

return;

}

}


/* إغلاق */

closeModal();


/* إعادة تحميل */

await loadCustomers();


alert(
editMode

?

"✅ تم تعديل العميل بنجاح"

:

"✅ تم إضافة العميل بنجاح"
);


}

finally{

saveBtn.disabled = false;

saveBtn.textContent =
"💾 حفظ";

}

}


/* =========================================
   DELETE CUSTOMER
========================================= */

async function deleteCustomer(id){

const customer =
allCustomers.find(
c =>
Number(c.id) ===
Number(id)
);


if(!customer){

alert(
"❌ العميل غير موجود"
);

return;

}


const confirmed =
confirm(

`⚠️ تأكيد حذف العميل

الاسم:
${customer.subscriber_name}

رقم التليفون:
${customer.phone}

هل أنت متأكد أنك تريد حذف العميل من القائمة؟`

);


if(!confirmed){

return;

}


/* زر حذف لا يوجد أمامنا مباشرة
لذلك نعتمد على التحديث */

const now =
new Date()
.toISOString();


const {
error
} =

await supabase

.from("customers")

.update({

deleted_at:
now,

updated_at:
now

})

.eq("id",id);


if(error){

alert(
"❌ لم يتم حذف العميل:\n\n"
+
error.message
);

return;

}


/* إزالة العميل من القائمة فورًا */

allCustomers =
allCustomers.filter(
c =>
Number(c.id) !==
Number(id)
);


updateStats();

renderCustomers();


alert(
"✅ تم حذف العميل من القائمة"
);

}


/* =========================================
   RENEW TODAY
========================================= */

async function renewToday(id){

const customer =
allCustomers.find(
x =>
Number(x.id) ===
Number(id)
);


if(!customer){

return;

}


const confirmed =
confirm(

`تأكيد تجديد العميل:

${customer.subscriber_name}

هل تريد اعتبار اليوم تاريخ التجديد الجديد؟`

);


if(!confirmed){

return;

}


const now =
new Date();


const next =
new Date(now);


next.setMonth(
next.getMonth() + 1
);


const {
error
} =

await supabase

.from("customers")

.update({

last_renewed_at:
now.toISOString(),

last_order_at:
now.toISOString(),

next_renewal_date:

next
.toISOString()
.split("T")[0],

total_orders:

(Number(
customer.total_orders
) || 0) + 1,

status:
"active",

updated_at:
now.toISOString()

})

.eq("id",id);


if(error){

alert(
"❌ حصل خطأ في التجديد:\n\n"
+
error.message
);

return;

}


await loadCustomers();


alert(
"✅ تم تجديد العميل بنجاح"
);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

return String(
value ?? ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}
