<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>العملاء | WE Packages</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #151a35, #242b55);
      color: white;
      padding: 24px 18px;
      border-radius: 0 0 24px 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      opacity: .75;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .search {
      flex: 1;
      min-width: 230px;
      padding: 14px 16px;
      border: 1px solid #e0e4ed;
      border-radius: 14px;
      background: white;
      outline: none;
      font-size: 15px;
    }

    .filter {
      padding: 14px;
      border: 1px solid #e0e4ed;
      border-radius: 14px;
      background: white;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .stat-title {
      color: #7a8194;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
    }

    .customers {
      display: grid;
      gap: 14px;
    }

    .customer {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .customer-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .customer-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .phone {
      color: #737b8e;
      font-size: 14px;
    }

    .badge {
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    .active {
      background: #e8f8ef;
      color: #168448;
    }

    .inactive {
      background: #fdebec;
      color: #c73542;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .detail {
      background: #f7f8fb;
      padding: 12px;
      border-radius: 13px;
    }

    .detail small {
      display: block;
      color: #858c9d;
      margin-bottom: 5px;
      font-size: 11px;
    }

    .detail strong {
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      cursor: pointer;
      font-size: 13px;
    }

    .primary {
      background: #242b55;
      color: white;
    }

    .secondary {
      background: #eef1f7;
      color: #252b3c;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 18px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 22px;
      padding: 22px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 13px;
      border: 1px solid #dfe3eb;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .details {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 14px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .details {
        grid-template-columns: 1fr 1fr;
      }

      .customer-head {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container">
      <h1>👥 العملاء</h1>
      <p>إدارة العملاء والتجديدات والاشتراكات</p>
    </div>
  </header>

  <main class="container">

    <section class="stats">
      <div class="stat">
        <div class="stat-title">إجمالي العملاء</div>
        <div class="stat-number" id="total">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">العملاء النشطين</div>
        <div class="stat-number" id="active">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">تجديد قريب</div>
        <div class="stat-number" id="soon">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">منتهية</div>
        <div class="stat-number" id="expired">0</div>
      </div>
    </section>

    <section class="topbar">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 ابحث بالاسم أو رقم التليفون..."
      >

      <select id="renewalFilter" class="filter">
        <option value="all">كل مواعيد التجديد</option>
        <option value="1">تجديد يوم 1</option>
        <option value="16">تجديد يوم 16</option>
        <option value="custom">تاريخ مخصص</option>
      </select>

      <select id="statusFilter" class="filter">
        <option value="all">كل الحالات</option>
        <option value="active">🟢 نشط</option>
        <option value="inactive">🔴 موقوف</option>
        <option value="soon">🟠 قرب التجديد</option>
        <option value="expired">🔴 منتهي</option>
      </select>

    </section>

    <section id="customers" class="customers">
      <div class="loading">
        ⏳ جاري تحميل العملاء...
      </div>
    </section>

  </main>

  <!-- MODAL -->

  <div id="modal" class="modal">

    <div class="modal-box">

      <h2>✏️ تعديل بيانات العميل</h2>

      <input type="hidden" id="customerId">

      <div class="field">
        <label>اسم العميل</label>
        <input id="customerName">
      </div>

      <div class="field">
        <label>رقم التليفون</label>
        <input id="customerPhone">
      </div>

      <div class="field">
        <label>الباقة</label>
        <input id="customerPackage">
      </div>

      <div class="field">
        <label>السعر</label>
        <input id="customerPrice" type="number">
      </div>

      <div class="field">
        <label>نظام التجديد</label>

        <select id="renewalType">
          <option value="day_1">يوم 1</option>
          <option value="day_16">يوم 16</option>
          <option value="custom">تاريخ مخصص</option>
        </select>

      </div>

      <div class="field">
        <label>يوم التجديد</label>

        <input
          id="renewalDay"
          type="number"
          min="1"
          max="31"
          placeholder="مثال: 10"
        >

      </div>

      <div class="field">
        <label>التجديد القادم</label>

        <input
          id="nextRenewal"
          type="date"
        >

      </div>

      <div class="modal-actions">

        <button
          class="secondary"
          onclick="closeModal()"
        >
          إلغاء
        </button>

        <button
          class="primary"
          onclick="saveCustomer()"
        >
          💾 حفظ التعديلات
        </button>

      </div>

    </div>

  </div>

<script>

const SUPABASE_URL =
  "https://YOUR_PROJECT.supabase.co";

const SUPABASE_URL =
  "https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";

let allCustomers = [];

/* =========================
   LOAD
========================= */

async function loadCustomers() {

  const container =
    document.getElementById(
      "customers"
    );

  container.innerHTML =
    `<div class="loading">
      ⏳ جاري تحميل العملاء...
    </div>`;

  const {
    data,
    error
  } =
    await supabase
      .from("customers")
      .select("*")
      .order(
        "next_renewal_date",
        {
          ascending: true,
          nullsFirst: false
        }
      );

  if (error) {

    container.innerHTML =
      `<div class="error">
        ❌ حصل خطأ في تحميل العملاء
        <br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }

  allCustomers =
    data || [];

  updateStats();

  renderCustomers();

}

/* =========================
   DAYS
========================= */

function daysUntil(date) {

  if (!date)
    return null;

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const target =
    new Date(
      date + "T00:00:00"
    );

  return Math.ceil(
    (
      target - today
    ) /
    86400000
  );

}

/* =========================
   STATS
========================= */

function updateStats() {

  const total =
    allCustomers.length;

  const active =
    allCustomers.filter(
      c =>
        c.status ===
        "active"
    ).length;

  const soon =
    allCustomers.filter(
      c => {

        const days =
          daysUntil(
            c.next_renewal_date
          );

        return (
          days !== null &&
          days >= 0 &&
          days <= 7
        );
      }
    ).length;

  const expired =
    allCustomers.filter(
      c => {

        const days =
          daysUntil(
            c.next_renewal_date
          );

        return (
          days !== null &&
          days < 0
        );
      }
    ).length;

  document.getElementById(
    "total"
  ).textContent =
    total;

  document.getElementById(
    "active"
  ).textContent =
    active;

  document.getElementById(
    "soon"
  ).textContent =
    soon;

  document.getElementById(
    "expired"
  ).textContent =
    expired;

}

/* =========================
   RENDER
========================= */

function renderCustomers() {

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase()
      .trim();

  const renewal =
    document
      .getElementById(
        "renewalFilter"
      )
      .value;

  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;

  let list =
    allCustomers.filter(
      customer => {

        const name =
          String(
            customer.subscriber_name ||
            ""
          ).toLowerCase();

        const phone =
          String(
            customer.phone ||
            ""
          ).toLowerCase();

        if (
          search &&
          !name.includes(search) &&
          !phone.includes(search)
        ) {
          return false;
        }

        if (
          renewal === "1" &&
          customer.renewal_day !== 1
        ) {
          return false;
        }

        if (
          renewal === "16" &&
          customer.renewal_day !== 16
        ) {
          return false;
        }

        if (
          renewal === "custom" &&
          customer.renewal_type !==
            "custom"
        ) {
          return false;
        }

        const days =
          daysUntil(
            customer.next_renewal_date
          );

        if (
          status === "active" &&
          customer.status !==
            "active"
        ) {
          return false;
        }

        if (
          status === "inactive" &&
          customer.status !==
            "inactive"
        ) {
          return false;
        }

        if (
          status === "soon" &&
          !(
            days !== null &&
            days >= 0 &&
            days <= 7
          )
        ) {
          return false;
        }

        if (
          status === "expired" &&
          !(
            days !== null &&
            days < 0
          )
        ) {
          return false;
        }

        return true;

      }
    );

  const container =
    document.getElementById(
      "customers"
    );

  if (
    list.length === 0
  ) {

    container.innerHTML =
      `<div class="empty">
        📭 لا يوجد عملاء مطابقين للبحث.
      </div>`;

    return;
  }

  container.innerHTML =
    list.map(
      customer =>
        customerCard(
          customer
        )
    ).join("");

}

/* =========================
   CARD
========================= */

function customerCard(
  customer
) {

  const days =
    daysUntil(
      customer.next_renewal_date
    );

  let renewalText =
    "غير محدد";

  if (
    customer.next_renewal_date
  ) {

    if (
      days < 0
    ) {

      renewalText =
        `🔴 انتهى منذ ${Math.abs(days)} يوم`;

    }

    else if (
      days === 0
    ) {

      renewalText =
        "🟠 التجديد اليوم";

    }

    else if (
      days <= 7
    ) {

      renewalText =
        `🟠 متبقي ${days} يوم`;

    }

    else {

      renewalText =
        `🟢 متبقي ${days} يوم`;

    }

  }

  const status =
    customer.status ===
    "inactive"
      ? `<span class="badge inactive">
          🔴 موقوف
        </span>`
      : `<span class="badge active">
          🟢 نشط
        </span>`;

  return `
    <article class="customer">

      <div class="customer-head">

        <div>
          <div class="customer-name">
            ${escapeHtml(
              customer.subscriber_name ||
              "بدون اسم"
            )}
          </div>

          <div class="phone">
            📱 ${escapeHtml(
              customer.phone ||
              "-"
            )}
          </div>
        </div>

        ${status}

      </div>

      <div class="details">

        <div class="detail">
          <small>الباقة</small>
          <strong>
            ${escapeHtml(
              customer.package_name ||
              "-"
            )}
          </strong>
        </div>

        <div class="detail">
          <small>السعر</small>
          <strong>
            ${customer.last_price ?? "-"} جنيه
          </strong>
        </div>

        <div class="detail">
          <small>يوم التجديد</small>
          <strong>
            ${
              customer.renewal_type ===
              "custom"
                ? "مخصص"
                : (
                  customer.renewal_day ||
                  "-"
                )
            }
          </strong>
        </div>

        <div class="detail">
          <small>التجديد القادم</small>
          <strong>
            ${
              customer.next_renewal_date ||
              "-"
            }
          </strong>
        </div>

      </div>

      <div class="details">

        <div class="detail">
          <small>آخر تجديد</small>
          <strong>
            ${
              customer.last_renewed_at
                ? new Date(
                    customer.last_renewed_at
                  ).toLocaleDateString(
                    "ar-EG"
                  )
                : "-"
            }
          </strong>
        </div>

        <div class="detail">
          <small>عدد الطلبات</small>
          <strong>
            ${customer.total_orders ?? 0}
          </strong>
        </div>

        <div class="detail">
          <small>حالة التجديد</small>
          <strong>
            ${renewalText}
          </strong>
        </div>

        <div class="detail">
          <small>طريقة الدفع</small>
          <strong>
            ${escapeHtml(
              customer.payment_method ||
              "-"
            )}
          </strong>
        </div>

      </div>

      <div class="actions">

        <button
          class="primary"
          onclick="openEdit(${customer.id})"
        >
          ✏️ تعديل
        </button>

        <button
          class="secondary"
          onclick="renewToday(${customer.id})"
        >
          🔄 تجديد الآن
        </button>

      </div>

    </article>
  `;

}

/* =========================
   EDIT
========================= */

function openEdit(
  id
) {

  const customer =
    allCustomers.find(
      c =>
        Number(c.id) ===
        Number(id)
    );

  if (!customer)
    return;

  document.getElementById(
    "customerId"
  ).value =
    customer.id;

  document.getElementById(
    "customerName"
  ).value =
    customer.subscriber_name ||
    "";

  document.getElementById(
    "customerPhone"
  ).value =
    customer.phone ||
    "";

  document.getElementById(
    "customerPackage"
  ).value =
    customer.package_name ||
    "";

  document.getElementById(
    "customerPrice"
  ).value =
    customer.last_price ||
    "";

  document.getElementById(
    "renewalType"
  ).value =
    customer.renewal_type ||
    "day_1";

  document.getElementById(
    "renewalDay"
  ).value =
    customer.renewal_day ||
    "";

  document.getElementById(
    "nextRenewal"
  ).value =
    customer.next_renewal_date ||
    "";

  document.getElementById(
    "modal"
  ).classList.add(
    "show"
  );

}

/* =========================
   CLOSE
========================= */

function closeModal() {

  document.getElementById(
    "modal"
  ).classList.remove(
    "show"
  );

}

/* =========================
   SAVE
========================= */

async function saveCustomer() {

  const id =
    document.getElementById(
      "customerId"
    ).value;

  const type =
    document.getElementById(
      "renewalType"
    ).value;

  let day =
    Number(
      document.getElementById(
        "renewalDay"
      ).value
    ) || null;

  let nextDate =
    document.getElementById(
      "nextRenewal"
    ).value ||
    null;

  if (
    type === "day_1"
  ) {

    day = 1;

  }

  if (
    type === "day_16"
  ) {

    day = 16;

  }

  const update = {

    subscriber_name:
      document.getElementById(
        "customerName"
      ).value.trim(),

    phone:
      document.getElementById(
        "customerPhone"
      ).value.trim(),

    package_name:
      document.getElementById(
        "customerPackage"
      ).value.trim(),

    last_price:
      Number(
        document.getElementById(
          "customerPrice"
        ).value
      ) || 0,

    renewal_type:
      type,

    renewal_day:
      day,

    next_renewal_date:
      nextDate,

    updated_at:
      new Date()
        .toISOString()

  };

  const {
    error
  } =
    await supabase
      .from("customers")
      .update(update)
      .eq(
        "id",
        id
      );

  if (error) {

    alert(
      "❌ حصل خطأ:\n" +
      error.message
    );

    return;
  }

  closeModal();

  await loadCustomers();

}

/* =========================
   RENEW NOW
========================= */

async function renewToday(
  id
) {

  const customer =
    allCustomers.find(
      c =>
        Number(c.id) ===
        Number(id)
    );

  if (!customer)
    return;

  const ok =
    confirm(
      `تأكيد تجديد العميل:

${customer.subscriber_name}

هل تريد اعتبار اليوم هو تاريخ التجديد الجديد؟`
    );

  if (!ok)
    return;

  const today =
    new Date();

  const date =
    today
      .toISOString()
      .split("T")[0];

  const next =
    new Date(today);

  next.setMonth(
    next.getMonth() + 1
  );

  const nextDate =
    next
      .toISOString()
      .split("T")[0];

  const {
    error
  } =
    await supabase
      .from("customers")
      .update({

        last_renewed_at:
          today.toISOString(),

        next_renewal_date:
          nextDate,

        updated_at:
          today.toISOString()

      })
      .eq(
        "id",
        id
      );

  if (error) {

    alert(
      "❌ حصل خطأ:\n" +
      error.message
    );

    return;
  }

  await loadCustomers();

}

/* =========================
   SEARCH / FILTER
========================= */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    renderCustomers
  );

document
  .getElementById(
    "renewalFilter"
  )
  .addEventListener(
    "change",
    renderCustomers
  );

document
  .getElementById(
    "statusFilter"
  )
  .addEventListener(
    "change",
    renderCustomers
  );

/* =========================
   ESCAPE
========================= */

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

/* =========================
   START
========================= */

loadCustomers();

</script>

</body>
</html>
