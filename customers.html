<script>


/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


let customers = [];

let editMode = false;


/* =========================================
SUPABASE REQUEST
========================================= */

async function supabaseRequest(
path,
options={}
){

const controller =
new AbortController();

const timer =
setTimeout(
()=>controller.abort(),
10000
);

try{

const response =
await fetch(
SUPABASE_URL+
"/rest/v1/"+
path,
{

...options,

signal:
controller.signal,

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation",

...(options.headers||{})

}

}
);


const text =
await response.text();


let data=null;


try{

data =
text
?
JSON.parse(text)
:
null;

}

catch{

data=text;

}


if(!response.ok){

throw new Error(

typeof data==="string"

?

data

:

(

data?.message||
data?.error_description||
data?.hint||
"خطأ من Supabase"

)

);

}


return data;


}

catch(error){

if(
error.name==="AbortError"
){

throw new Error(
"الاتصال بـ Supabase استغرق أكثر من 10 ثواني."
);

}


throw error;

}

finally{

clearTimeout(timer);

}

}


/* =========================================
LOAD CUSTOMERS
========================================= */

async function loadCustomers(){

const list =
document.getElementById(
"list"
);


list.innerHTML =
`
<div class="loading">
⏳ جاري تحميل العملاء...
</div>
`;


try{

const data =
await supabaseRequest(
"customers?select=*&deleted_at=is.null&order=next_renewal_date.asc"
);


customers =
Array.isArray(data)
?
data
:
[];


updateStats();

render();


}

catch(error){

console.error(error);


list.innerHTML =
`
<div class="error">

❌ حصل خطأ في تحميل العملاء

<br><br>

${escapeHtml(
error.message
)}

<br><br>

<button
class="action edit"
onclick="loadCustomers()"
>
🔄 إعادة المحاولة
</button>

</div>
`;

}

}


/* =========================================
STATS
========================================= */

function updateStats(){

document.getElementById(
"total"
)
.textContent =
customers.length;


document.getElementById(
"active"
)
.textContent =
customers.filter(
c =>
c.status==="active"
).length;


document.getElementById(
"soon"
)
.textContent =
customers.filter(
c=>{

const d =
daysUntil(
c.next_renewal_date
);


return(
d!==null&&
d>=0&&
d<=7
);

}
).length;


document.getElementById(
"expired"
)
.textContent =
customers.filter(
c=>{

const d =
daysUntil(
c.next_renewal_date
);


return(
d!==null&&
d<0
);

}
).length;

}


/* =========================================
DAYS
========================================= */

function daysUntil(date){

if(!date)
return null;


const today =
new Date();


today.setHours(
0,0,0,0
);


const target =
new Date(
date+
"T00:00:00"
);


return Math.ceil(
(target-today)/
86400000
);

}


/* =========================================
RENDER
========================================= */

function render(){

const search =
document.getElementById(
"search"
)
.value
.trim()
.toLowerCase();


const renewal =
document.getElementById(
"renewalFilter"
).value;


const status =
document.getElementById(
"statusFilter"
).value;


const filtered =
customers.filter(
c=>{

const name =
String(
c.subscriber_name||
""
)
.toLowerCase();


const phone =
String(
c.phone||
""
)
.toLowerCase();


const primary =
String(
c.primary_number||
""
)
.toLowerCase();


if(
search&&
!name.includes(search)&&
!phone.includes(search)&&
!primary.includes(search)
){

return false;

}


if(
renewal==="1"&&
Number(c.renewal_day)!==1
){

return false;

}


if(
renewal==="16"&&
Number(c.renewal_day)!==16
){

return false;

}


if(
renewal==="custom"&&
c.renewal_type!=="custom"
){

return false;

}


const d =
daysUntil(
c.next_renewal_date
);


if(
status==="active"&&
c.status!=="active"
){

return false;

}


if(
status==="inactive"&&
c.status!=="inactive"
){

return false;

}


if(
status==="soon"&&
!(
d!==null&&
d>=0&&
d<=7
)
){

return false;

}


if(
status==="expired"&&
!(
d!==null&&
d<0
)
){

return false;

}


return true;

}
);


const list =
document.getElementById(
"list"
);


if(!filtered.length){

list.innerHTML =
`
<div class="empty">
📭 لا يوجد عملاء مطابقين.
</div>
`;

return;

}


list.innerHTML =
filtered
.map(customerCard)
.join("");

}


/* =========================================
CUSTOMER CARD
========================================= */

function customerCard(c){

const d =
daysUntil(
c.next_renewal_date
);


let renewalText =
"غير محدد";


if(c.next_renewal_date){

if(d<0)
renewalText="🔴 منتهي";

else if(d===0)
renewalText="🟠 التجديد اليوم";

else if(d<=7)
renewalText=
"🟠 متبقي "+
d+
" يوم";

else
renewalText=
"🟢 متبقي "+
d+
" يوم";

}


const badge =
c.status==="inactive"

?

'<span class="badge inactive">🔴 موقوف</span>'

:

'<span class="badge active">🟢 نشط</span>';


const allocatedGB =
Number(
c.allocated_gb
) || 0;


return `

<div class="card">


<div class="card-head">


<div>


<div class="name">

${escapeHtml(
c.subscriber_name||
"بدون اسم"
)}

</div>


<div class="phone">

📱
${escapeHtml(
c.phone||"-"
)}

</div>


</div>


${badge}


</div>


<div class="grid">


<div class="box">

<small>
الرقم الأساسي
</small>

<strong>

${escapeHtml(
c.primary_number||"-"
)}

</strong>

</div>


<div class="box">

<small>
📦 جيجات العميل
</small>

<strong>

${formatGB(
allocatedGB
)}
GB

</strong>

</div>


<div class="box">

<small>
الباقة
</small>

<strong>

${escapeHtml(
c.package_name||"-"
)}

</strong>

</div>


<div class="box">

<small>
السعر
</small>

<strong>

${c.last_price??"-"}
جنيه

</strong>

</div>


<div class="box">

<small>
موعد التجديد
</small>

<strong>

${c.next_renewal_date||"-"}

</strong>

</div>


<div class="box">

<small>
يوم التجديد
</small>

<strong>

${
c.renewal_type==="custom"
?
"مخصص"
:
(c.renewal_day||"-")
}

</strong>

</div>


<div class="box">

<small>
حالة التجديد
</small>

<strong>

${renewalText}

</strong>

</div>


<div class="box">

<small>
عدد الطلبات
</small>

<strong>

${c.total_orders??0}

</strong>

</div>


<div class="box">

<small>
طريقة الدفع
</small>

<strong>

${escapeHtml(
c.payment_method||"-"
)}

</strong>

</div>


</div>


<div class="actions">


<button
class="action edit"
onclick="openEdit(${Number(c.id)})"
>
✏️ تعديل
</button>


<button
class="action renew"
onclick="renewCustomer(${Number(c.id)})"
>
🔄 تجديد الآن
</button>


<button
class="action delete"
onclick="deleteCustomer(${Number(c.id)})"
>
🗑️ حذف
</button>


</div>


</div>

`;

}


/* =========================================
ADD
========================================= */

function openAdd(){

editMode=false;


document.getElementById(
"modalTitle"
)
.textContent=
"➕ إضافة عميل";


clearForm();


document.getElementById(
"renewalType"
)
.value=
"day_1";


document.getElementById(
"renewalDay"
)
.value=
1;


document.getElementById(
"status"
)
.value=
"active";


document.getElementById(
"totalOrders"
)
.value=
0;


document.getElementById(
"allocatedGB"
)
.value=
0;


document.getElementById(
"modal"
)
.classList.add(
"show"
);

}


/* =========================================
EDIT
========================================= */

function openEdit(id){

const c =
customers.find(
x=>
Number(x.id)===
Number(id)
);


if(!c){

alert(
"العميل غير موجود"
);

return;

}


editMode=true;


document.getElementById(
"modalTitle"
)
.textContent=
"✏️ تعديل بيانات العميل";


document.getElementById(
"customerId"
)
.value=
c.id;


document.getElementById(
"customerName"
)
.value=
c.subscriber_name||"";


document.getElementById(
"customerPhone"
)
.value=
c.phone||"";


document.getElementById(
"primaryNumber"
)
.value=
c.primary_number||"";


/* الجيجا */

document.getElementById(
"allocatedGB"

async function saveCustomer(){

document.getElementById(
"customerName"
)
.value
.trim();


const phone =
document.getElementById(
"customerPhone"
)
.value
.trim();


const primaryNumber =
document.getElementById(
"primaryNumber"
)
.value
.trim();


/* الجيجا */

const allocatedGB =
Number(
document.getElementById(
"allocatedGB"
)
.value
) || 0;


const nextDate =
document.getElementById(
"nextRenewal"
)
.value;


if(
!name||
!phone||
!nextDate
){

alert(
"⚠️ الاسم ورقم العميل والتجديد القادم مطلوبين"
);

}


if(
allocatedGB<0
){

alert(
"⚠️ عدد الجيجا لا يمكن أن يكون أقل من صفر"
);

return;

}


const type =
document.getElementById(
"renewalType"
).value;


let day =
Number(
document.getElementById(
"renewalDay"
).value
) || null;


if(type==="day_1")
day=1;


if(type==="day_16")
day=16;


const now =
new Date()
.toISOString();


const payload={


subscriber_name:
name,


phone:
phone,


primary_number:
primaryNumber||null,


/* الجيجا */

allocated_gb:
allocatedGB,


package_name:
document.getElementById(
"packageName"
)
.value
.trim()||null,


last_price:
Number(
document.getElementById(
"lastPrice"
).value
)||0,


payment_method:
document.getElementById(
"paymentMethod"
).value||null,


status:
document.getElementById(
"status"
).value,


renewal_type:
type,


renewal_day:
day,


next_renewal_date:
nextDate,


total_orders:
Number(
document.getElementById(
"totalOrders"
).value
)||0,


updated_at:
now

};


try{


if(editMode){

const id =
document.getElementById(
"customerId"
).value;


await supabaseRequest(

"customers?id=eq."+
encodeURIComponent(id),

{

method:"PATCH",

body:
JSON.stringify(
payload
)

}

);

}


else{

    const existing =
        await supabaseRequest(
            "customers?select=id&phone=eq."+
            encodeURIComponent(phone)+
            "&deleted_at=is.null&limit=1"
        );

        Array.isArray(existing)&&
        existing.length

        );

        return;

    }


    payload.created_at =
        now;


    const newCustomer =
        await supabaseRequest(
            "customers",
            {
                method:"POST",

                body:
                    JSON.stringify(
                        payload

            }
        );

    const amount =
        Number(
            payload.last_price

    if(amount > 0){

        try{

            await supabaseRequest(
                "financial_transactions",
                {
                    method:"POST",

                    body:
                        JSON.stringify({

                                Number(
                                    newCustomer?.[0]?.id
                                ) || null,

                            customer_name:
                                payload.subscriber_name ||
                                null,

                            customer_phone:
                                payload.phone ||
                                null,

                            primary_number:
                                payload.primary_number ||

                            amount:

                            transaction_type:

                            transaction_date:

                            notes:

        }catch(financeError){

            console.error(
                "FINANCE ERROR:",

                "⚠️ العميل اتضاف، لكن العملية المالية لم تُسجل:\n\n"+
                financeError.message
            );

        }

    }

}

/* =========================================
RENEW
========================================= */

async function renewCustomer(id){

    const customer =
        customers.find(
            x =>
                Number(x.id) ===
                Number(id)
        );


    if(!customer)
        return;


    const amount =
        Number(
            customer.last_price
        ) || 0;


    const ok =
        confirm(

            "🔄 تجديد العميل\n\n" +

            "العميل: " +
            customer.subscriber_name +

            "\nالباقة: " +
            (customer.package_name || "-") +

            "\nالمبلغ: " +
            amount +
            " جنيه" +

            "\n\nهل تريد تسجيل التجديد؟"

        );


    if(!ok)
        return;


    try{

        const now =
            new Date();


        const next =
            new Date(now);


        /* =========================
           تحديد التجديد القادم
        ========================= */

        if(
            customer.renewal_type ===
            "day_1"
        ){

            next.setMonth(
                next.getMonth() + 1
            );

            next.setDate(1);

        }


        else if(
            customer.renewal_type ===
            "day_16"
        ){

            next.setMonth(
                next.getMonth() + 1
            );

            next.setDate(16);

        }


        else{

            next.setMonth(
                next.getMonth() + 1
            );

        }


        /* =========================
           تحديث العميل
        ========================= */

        const customerPayload = {

            last_renewed_at:
                now.toISOString(),

            last_order_at:
                now.toISOString(),

            next_renewal_date:
                next
                    .toISOString()
                    .split("T")[0],

            total_orders:
                (
                    Number(
                        customer.total_orders
                    ) || 0
                ) + 1,

            status:
                "active",

            updated_at:
                now.toISOString()

        };


        await supabaseRequest(

            "customers?id=eq." +
            encodeURIComponent(id),

            {

                method:"PATCH",

                body:
                    JSON.stringify(
                        customerPayload
                    )

            }

        );


        /* =========================
           تسجيل العملية المالية
        ========================= */

        try{

            await supabaseRequest(

                "financial_transactions",

                {

                    method:"POST",

                    body:
                        JSON.stringify({

                            customer_id:
                                Number(
                                    customer.id
                                ),

                            customer_name:
                                customer.subscriber_name ||
                                null,

                            customer_phone:
                                customer.phone ||
                                null,

                            primary_number:
                                customer.primary_number ||
                                null,

                            package_name:
                                customer.package_name ||
                                null,

                            amount:
                                amount,

                            transaction_type:
                                "تجديد",

                            transaction_date:
                                now.toISOString(),

                            notes:
                                "تجديد تلقائي من صفحة العملاء"

                        })

                }

            );


        }catch(financeError){

            console.error(
                "FINANCE ERROR:",
                financeError
            );


            await loadCustomers();


            alert(

                "⚠️ تم تجديد العميل بنجاح، " +
                "لكن لم يتم تسجيل العملية المالية.\n\n" +

                "الخطأ:\n" +

                financeError.message

            );

            return;

        }


        /* =========================
           تحديث الصفحة
        ========================= */

        await loadCustomers();


        alert(

            "✅ تم التجديد بنجاح\n\n" +

            "العميل: " +
            customer.subscriber_name +

            "\nالمبلغ المسجل: " +
            amount +
            " جنيه"

        );


    }catch(error){

        console.error(
            "RENEW ERROR:",
            error
        );


        alert(

            "❌ حصل خطأ في التجديد:\n\n" +
            error.message

        );

    }

}


/* =========================================
HELPERS
========================================= */

function formatGB(value){

const number =
Number(value)||0;


if(
Number.isInteger(number)
){

return String(number);

}


return number.toFixed(2);

}


function escapeHtml(value){

return String(
value??""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}
