<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العملاء | WE Packages</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #151a35, #242b55);
      color: white;
      padding: 28px 18px;
      border-radius: 0 0 28px 28px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .subtitle {
      opacity: .78;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat,
    .customer,
    .loading,
    .empty,
    .error {
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .stat {
      padding: 18px;
    }

    .stat small {
      color: #7d8598;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 7px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input,
    select {
      border: 1px solid #e0e4ed;
      background: white;
      border-radius: 14px;
      padding: 13px;
      font-size: 14px;
      outline: none;
    }

    .search {
      flex: 1;
      min-width: 230px;
    }

    .customers {
      display: grid;
      gap: 14px;
    }

    .customer {
      padding: 18px;
    }

    .head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
    }

    .phone {
      color: #737b8e;
      margin-top: 5px;
      font-size: 14px;
    }

    .badge {
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    .green {
      background: #e8f8ef;
      color: #168448;
    }

    .red {
      background: #fdebec;
      color: #c73542;
    }

    .orange {
      background: #fff3df;
      color: #b96b00;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .detail {
      background: #f7f8fb;
      border-radius: 13px;
      padding: 12px;
    }

    .detail small {
      display: block;
      color: #858c9d;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .detail strong {
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      font-size: 13px;
      cursor: pointer;
    }

    .primary {
      background: #242b55;
      color: white;
    }

    .secondary {
      background: #eef1f7;
      color: #252b3c;
    }

    .loading,
    .empty,
    .error {
      padding: 35px;
      text-align: center;
    }

    .error {
      color: #b4232f;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 22px;
      padding: 20px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
    }

    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .details {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 14px;
      }

      .head {
        flex-direction: column;
      }

      .details {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container">
    <h1>👥 العملاء</h1>
    <div class="subtitle">
      إدارة العملاء والتجديدات والاشتراكات
    </div>
  </div>
</header>

<main class="container">

  <section class="stats">

    <div class="stat">
      <small>إجمالي العملاء</small>
      <strong id="total">0</strong>
    </div>

    <div class="stat">
      <small>العملاء النشطين</small>
      <strong id="active">0</strong>
    </div>

    <div class="stat">
      <small>تجديد قريب</small>
      <strong id="soon">0</strong>
    </div>

    <div class="stat">
      <small>منتهية</small>
      <strong id="expired">0</strong>
    </div>

  </section>

  <section class="topbar">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 ابحث بالاسم أو رقم التليفون..."
    >

    <select id="renewalFilter">

      <option value="all">
        كل مواعيد التجديد
      </option>

      <option value="1">
        تجديد يوم 1
      </option>

      <option value="16">
        تجديد يوم 16
      </option>

      <option value="custom">
        تاريخ مخصص
      </option>

    </select>

    <select id="statusFilter">

      <option value="all">
        كل الحالات
      </option>

      <option value="active">
        🟢 نشط
      </option>

      <option value="inactive">
        🔴 موقوف
      </option>

      <option value="soon">
        🟠 قرب التجديد
      </option>

      <option value="expired">
        🔴 منتهي
      </option>

    </select>

  </section>

  <section id="customers" class="customers">

    <div class="loading">
      ⏳ جاري تحميل العملاء...
    </div>

  </section>

</main>


<!-- نافذة تعديل العميل -->

<div id="modal" class="modal">

  <div class="modal-box">

    <h2>✏️ تعديل بيانات العميل</h2>

    <input
      type="hidden"
      id="customerId"
    >

    <div class="field">
      <label>اسم العميل</label>

      <input
        id="customerName"
        type="text"
      >
    </div>

    <div class="field">
      <label>رقم التليفون</label>

      <input
        id="customerPhone"
        type="text"
      >
    </div>

    <div class="field">
      <label>الباقة</label>

      <input
        id="customerPackage"
        type="text"
      >
    </div>

    <div class="field">
      <label>السعر</label>

      <input
        id="customerPrice"
        type="number"
      >
    </div>

    <div class="field">

      <label>
        نظام التجديد
      </label>

      <select id="renewalType">

        <option value="day_1">
          يوم 1
        </option>

        <option value="day_16">
          يوم 16
        </option>

        <option value="custom">
          تاريخ مخصص
        </option>

      </select>

      <div class="hint">
        استخدم "تاريخ مخصص" لو العميل جدد قبل موعده.
      </div>

    </div>

    <div class="field">

      <label>
        يوم التجديد
      </label>

      <input
        id="renewalDay"
        type="number"
        min="1"
        max="31"
        placeholder="مثال: 10"
      >

    </div>

    <div class="field">

      <label>
        التجديد القادم
      </label>

      <input
        id="nextRenewal"
        type="date"
      >

    </div>

    <div class="modal-actions">

      <button
        class="secondary"
        onclick="closeModal()"
      >
        إلغاء
      </button>

      <button
        class="primary"
        onclick="saveCustomer()"
      >
        💾 حفظ
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let allCustomers = [];


/* =========================
   حماية النص
========================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   تاريخ اليوم
========================= */

function todayLocal() {

  const d =
    new Date();

  return new Date(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
  );

}


/* =========================
   تحويل التاريخ
========================= */

function dateOnly(value) {

  if (!value)
    return null;

  const parts =
    String(value)
      .slice(0,10)
      .split("-")
      .map(Number);

  if (
    parts.length !== 3 ||
    !parts[0] ||
    !parts[1] ||
    !parts[2]
  ) {
    return null;
  }

  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );

}


/* =========================
   الأيام المتبقية
========================= */

function daysUntil(value) {

  const target =
    dateOnly(value);

  if (!target)
    return null;

  return Math.round(
    (
      target -
      todayLocal()
    ) / 86400000
  );

}


/* =========================
   عرض التاريخ
========================= */

function formatDate(value) {

  if (!value)
    return "-";

  const date =
    dateOnly(value);

  if (!date)
    return value;

  return date.toLocaleDateString(
    "ar-EG",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );

}


/* =========================
   تاريخ الشهر القادم
========================= */

function nextMonthDate(
  baseDate,
  day
) {

  const date =
    new Date(
      baseDate.getFullYear(),
      baseDate.getMonth() + 1,
      1
    );

  const lastDay =
    new Date(
      date.getFullYear(),
      date.getMonth() + 1,
      0
    ).getDate();

  date.setDate(
    Math.min(
      Number(day),
      lastDay
    )
  );

  return date;

}


/* =========================
   YYYY-MM-DD
========================= */

function isoDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =========================
   نظام التجديد
========================= */

function renewalLabel(customer) {

  if (
    customer.renewal_type ===
    "day_1"
  ) {
    return "يوم 1";
  }

  if (
    customer.renewal_type ===
    "day_16"
  ) {
    return "يوم 16";
  }

  if (
    customer.renewal_type ===
    "custom"
  ) {
    return (
      "يوم " +
      (
        customer.renewal_day ||
        "-"
      )
    );
  }

  if (
    customer.renewal_day
  ) {
    return (
      "يوم " +
      customer.renewal_day
    );
  }

  return "غير محدد";

}


/* =========================
   حالة التجديد
========================= */

function renewalStatus(
  customer
) {

  const days =
    daysUntil(
      customer.next_renewal_date
    );

  if (
    days === null
  ) {

    return {
      text: "غير محدد",
      className: ""
    };

  }

  if (
    days < 0
  ) {

    return {
      text:
        "🔴 منتهي منذ " +
        Math.abs(days) +
        " يوم",
      className: "red"
    };

  }

  if (
    days === 0
  ) {

    return {
      text:
        "🟠 التجديد اليوم",
      className: "orange"
    };

  }

  if (
    days <= 7
  ) {

    return {
      text:
        "🟠 متبقي " +
        days +
        " يوم",
      className: "orange"
    };

  }

  return {
    text:
      "🟢 متبقي " +
      days +
      " يوم",
    className: "green"
  };

}


/* =========================
   تحميل العملاء
========================= */

async function loadCustomers() {

  const container =
    document.getElementById(
      "customers"
    );

  container.innerHTML =
    `
    <div class="loading">
      ⏳ جاري تحميل العملاء...
    </div>
    `;


  const result =
    await db

      .from("customers")

      .select("*")

      .order(
        "next_renewal_date",
        {
          ascending: true,
          nullsFirst: false
        }
      );


  if (
    result.error
  ) {

    container.innerHTML =
      `
      <div class="error">

        ❌ تعذر تحميل العملاء

        <br><br>

        ${escapeHtml(
          result.error.message
        )}

        <br><br>

        لو ظهرت رسالة
        RLS أو permission denied
        ابعتها لي.

      </div>
      `;

    return;

  }


  allCustomers =
    result.data || [];


  updateStats();

  renderCustomers();

}


/* =========================
   الإحصائيات
========================= */

function updateStats() {

  const total =
    allCustomers.length;


  const active =
    allCustomers.filter(
      customer =>
        customer.status ===
        "active"
    ).length;


  const soon =
    allCustomers.filter(
      customer => {

        const days =
          daysUntil(
            customer.next_renewal_date
          );

        return (
          days !== null &&
          days >= 0 &&
          days <= 7
        );

      }
    ).length;


  const expired =
    allCustomers.filter(
      customer => {

        const days =
          daysUntil(
            customer.next_renewal_date
          );

        return (
          days !== null &&
          days < 0
        );

      }
    ).length;


  document.getElementById(
    "total"
  ).textContent =
    total;


  document.getElementById(
    "active"
  ).textContent =
    active;


  document.getElementById(
    "soon"
  ).textContent =
    soon;


  document.getElementById(
    "expired"
  ).textContent =
    expired;

}


/* =========================
   عرض العملاء
========================= */

function renderCustomers() {

  const search =
    document.getElementById(
      "search"
    )
    .value
    .trim()
    .toLowerCase();


  const renewal =
    document.getElementById(
      "renewalFilter"
    ).value;


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const list =
    allCustomers.filter(
      customer => {

        const name =
          String(
            customer.subscriber_name ||
            ""
          ).toLowerCase();


        const phone =
          String(
            customer.phone ||
            ""
          ).toLowerCase();


        if (
          search &&
          !name.includes(search) &&
          !phone.includes(search)
        ) {

          return false;

        }


        if (
          renewal === "1" &&
          Number(
            customer.renewal_day
          ) !== 1
        ) {

          return false;

        }


        if (
          renewal === "16" &&
          Number(
            customer.renewal_day
          ) !== 16
        ) {

          return false;

        }


        if (
          renewal === "custom" &&
          customer.renewal_type !==
          "custom"
        ) {

          return false;

        }


        const days =
          daysUntil(
            customer.next_renewal_date
          );


        if (
          status === "active" &&
          customer.status !==
          "active"
        ) {

          return false;

        }


        if (
          status === "inactive" &&
          customer.status !==
          "inactive"
        ) {

          return false;

        }


        if (
          status === "soon" &&
          !(
            days !== null &&
            days >= 0 &&
            days <= 7
          )
        ) {

          return false;

        }


        if (
          status === "expired" &&
          !(
            days !== null &&
            days < 0
          )
        ) {

          return false;

        }


        return true;

      }
    );


  const container =
    document.getElementById(
      "customers"
    );


  if (
    list.length === 0
  ) {

    container.innerHTML =
      `
      <div class="empty">
        📭 لا يوجد عملاء مطابقين.
      </div>
      `;

    return;

  }


  container.innerHTML =
    list
      .map(
        customerCard
      )
      .join("");

}


/* =========================
   كارت العميل
========================= */

function customerCard(
  customer
) {

  const renewal =
    renewalStatus(
      customer
    );


  const statusHtml =
    customer.status ===
    "inactive"

      ? `
        <span class="badge red">
          🔴 موقوف
        </span>
        `

      : `
        <span class="badge green">
          🟢 نشط
        </span>
        `;


  return `

    <article class="customer">

      <div class="head">

        <div>

          <div class="name">

            ${escapeHtml(
              customer.subscriber_name ||
              "بدون اسم"
            )}

          </div>

          <div class="phone">

            📱

            ${escapeHtml(
              customer.phone ||
              "-"
            )}

          </div>

        </div>

        ${statusHtml}

      </div>


      <div class="details">

        <div class="detail">

          <small>
            الباقة
          </small>

          <strong>
            ${escapeHtml(
              customer.package_name ||
              "-"
            )}
          </strong>

        </div>


        <div class="detail">

          <small>
            السعر
          </small>

          <strong>
            ${
              customer.last_price ??
              "-"
            }

            جنيه
          </strong>

        </div>


        <div class="detail">

          <small>
            موعد التجديد
          </small>

          <strong>
            ${renewalLabel(
              customer
            )}
          </strong>

        </div>


        <div class="detail">

          <small>
            التجديد القادم
          </small>

          <strong>
            ${formatDate(
              customer.next_renewal_date
            )}
          </strong>

        </div>

      </div>


      <div class="details">

        <div class="detail">

          <small>
            حالة التجديد
          </small>

          <strong>
            ${renewal.text}
          </strong>

        </div>


        <div class="detail">

          <small>
            آخر تجديد
          </small>

          <strong>
            ${formatDate(
              customer.last_renewed_at
            )}
          </strong>

        </div>


        <div class="detail">

          <small>
            عدد الطلبات
          </small>

          <strong>
            ${
              customer.total_orders ??
              0
            }
          </strong>

        </div>


        <div class="detail">

          <small>
            طريقة الدفع
          </small>

          <strong>
            ${escapeHtml(
              customer.payment_method ||
              "-"
            )}
          </strong>

        </div>

      </div>


      <div class="actions">

        <button
          class="primary"
          onclick="openEdit(${Number(
            customer.id
          )})"
        >
          ✏️ تعديل
        </button>


        <button
          class="secondary"
          onclick="renewNow(${Number(
            customer.id
          )})"
        >
          🔄 تجديد الآن
        </button>

      </div>

    </article>

  `;

}


/* =========================
   فتح التعديل
========================= */

function openEdit(id) {

  const customer =
    allCustomers.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if (!customer)
    return;


  document.getElementById(
    "customerId"
  ).value =
    customer.id;


  document.getElementById(
    "customerName"
  ).value =
    customer.subscriber_name ||
    "";


  document.getElementById(
    "customerPhone"
  ).value =
    customer.phone ||
    "";


  document.getElementById(
    "customerPackage"
  ).value =
    customer.package_name ||
    "";


  document.getElementById(
    "customerPrice"
  ).value =
    customer.last_price ??
    "";


  document.getElementById(
    "renewalType"
  ).value =
    customer.renewal_type ||
    "day_1";


  document.getElementById(
    "renewalDay"
  ).value =
    customer.renewal_day ??
    "";


  document.getElementById(
    "nextRenewal"
  ).value =
    customer.next_renewal_date ||
    "";


  document.getElementById(
    "modal"
  ).classList.add(
    "show"
  );

}


/* =========================
   غلق التعديل
========================= */

function closeModal() {

  document.getElementById(
    "modal"
  ).classList.remove(
    "show"
  );

}


/* =========================
   حفظ التعديل
========================= */

async function saveCustomer() {

  const id =
    document.getElementById(
      "customerId"
    ).value;


  const type =
    document.getElementById(
      "renewalType"
    ).value;


  let day =
    Number(
      document.getElementById(
        "renewalDay"
      ).value
    ) || null;


  const nextDate =
    document.getElementById(
      "nextRenewal"
    ).value ||
    null;


  if (
    type === "day_1"
  ) {

    day = 1;

  }


  if (
    type === "day_16"
  ) {

    day = 16;

  }


  if (
    !nextDate
  ) {

    alert(
      "اختار تاريخ التجديد القادم."
    );

    return;

  }


  if (
    day !== null &&
    (
      day < 1 ||
      day > 31
    )
  ) {

    alert(
      "يوم التجديد لازم يكون من 1 إلى 31."
    );

    return;

  }


  const update = {

    subscriber_name:
      document.getElementById(
        "customerName"
      ).value.trim(),


    phone:
      document.getElementById(
        "customerPhone"
      ).value.trim(),


    package_name:
      document.getElementById(
        "customerPackage"
      ).value.trim(),


    last_price:
      Number(
        document.getElementById(
          "customerPrice"
        ).value
      ) || 0,


    renewal_type:
      type,


    renewal_day:
      day,


    next_renewal_date:
      nextDate,


    updated_at:
      new Date().toISOString()

  };


  const result =
    await db

      .from("customers")

      .update(update)

      .eq(
        "id",
        id
      );


  if (
    result.error
  ) {

    alert(
      "❌ لم يتم الحفظ:\n\n" +
      result.error.message
    );

    return;

  }


  closeModal();

  await loadCustomers();

}


/* =========================
   تجديد الآن
========================= */

async function renewNow(id) {

  const customer =
    allCustomers.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if (!customer)
    return;


  const confirmed =
    confirm(

      "تأكيد التجديد\n\n" +

      customer.subscriber_name +

      "\n" +

      (
        customer.phone ||
        ""
      ) +

      "\n\n" +

      "سيتم اعتبار اليوم هو تاريخ التجديد الفعلي."

    );


  if (!confirmed)
    return;


  const today =
    todayLocal();


  let renewalDay =
    Number(
      customer.renewal_day
    );


  if (
    !renewalDay
  ) {

    renewalDay =
      today.getDate();

  }


  const nextDate =
    nextMonthDate(
      today,
      renewalDay
    );


  const now =
    new Date()
      .toISOString();


  const result =
    await db

      .from("customers")

      .update({

        last_renewed_at:
          now,

        next_renewal_date:
          isoDate(
            nextDate
          ),

        updated_at:
          now

      })

      .eq(
        "id",
        id
      );


  if (
    result.error
  ) {

    alert(
      "❌ لم يتم التجديد:\n\n" +
      result.error.message
    );

    return;

  }


  await loadCustomers();

}


/* =========================
   البحث والفلاتر
========================= */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    renderCustomers
  );


document
  .getElementById(
    "renewalFilter"
  )
  .addEventListener(
    "change",
    renderCustomers
  );


document
  .getElementById(
    "statusFilter"
  )
  .addEventListener(
    "change",
    renderCustomers
  );


/* =========================
   تغيير نظام التجديد
========================= */

document
  .getElementById(
    "renewalType"
  )
  .addEventListener(
    "change",
    function () {

      if (
        this.value ===
        "day_1"
      ) {

        document.getElementById(
          "renewalDay"
        ).value = 1;

      }


      else if (
        this.value ===
        "day_16"
      ) {

        document.getElementById(
          "renewalDay"
        ).value = 16;

      }

    }
  );


/* =========================
   إغلاق النافذة بالخارج
========================= */

document
  .getElementById(
    "modal"
  )
  .addEventListener(
    "click",
    function (event) {

      if (
        event.target ===
        this
      ) {

        closeModal();

      }

    }
  );


/* =========================
   تشغيل الصفحة
========================= */

loadCustomers();

</script>
