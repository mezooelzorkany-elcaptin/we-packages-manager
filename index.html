<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WE Packages</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

/* العنوان العلوي */
.top{
    height:85px;
    background:#101828;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
}

/* الواجهة الرئيسية */
.hero{
    min-height:650px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;

    background:
    radial-gradient(circle at top right,#7c3aed,transparent 45%),
    linear-gradient(135deg,#111827,#312e81,#6d28d9);

    color:white;
}

.hero-content{
    max-width:850px;
}

.badge{
    display:inline-block;
    padding:12px 25px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);
    border-radius:50px;
    margin-bottom:28px;
    font-size:18px;
}

h1{
    font-size:55px;
    line-height:1.35;
    margin-bottom:22px;
}

h1 span{
    color:#c4b5fd;
}

.hero p{
    font-size:22px;
    line-height:1.8;
    color:#e5e7eb;
    margin-bottom:38px;
}

.btn{
    display:inline-block;
    padding:18px 45px;
    background:white;
    color:#5b21b6;
    text-decoration:none;
    border-radius:16px;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);
}

/* المميزات */
.features{
    max-width:1050px;
    margin:-65px auto 70px;
    position:relative;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    padding:0 20px;
}

.card{
    background:white;
    padding:40px 25px;
    text-align:center;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.icon{
    font-size:45px;
    margin-bottom:18px;
}

.card h2{
    font-size:24px;
    margin-bottom:12px;
}

.card p{
    color:#6b7280;
    font-size:17px;
    line-height:1.7;
}

footer{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

/* الموبايل */
@media(max-width:700px){

    .top{
        height:75px;
        font-size:25px;
    }

    .hero{
        min-height:600px;
    }

    h1{
        font-size:40px;
    }

    .hero p{
        font-size:18px;
    }

    .btn{
        width:100%;
    }

    .features{
        grid-template-columns:1fr;
        margin-top:-40px;
    }
}
</style>
</head>

<body>

<div class="top">
    💜 WE Packages
</div>

<section class="hero">

    <div class="hero-content">

        <div class="badge">
            ⚡ تفعيل سريع وآمن
        </div>

        <h1>
            أفضل باقات <span>WE</span><br>
            بأفضل الأسعار
        </h1>

        <p>
            اختار الباقة المناسبة ليك واستمتع
            بتفعيل سريع ودعم متواصل عبر واتساب
        </p>

        <a href="packages.html" class="btn">
            استعرض الباقات
        </a>

    </div>

</section>

<section class="features">

    <div class="card">
        <div class="icon">⚡</div>
        <h2>تفعيل سريع</h2>
        <p>تفعيل الباقة خلال دقائق.</p>
    </div>

    <div class="card">
        <div class="icon">💎</div>
        <h2>أفضل الأسعار</h2>
        <p>باقات متنوعة بأسعار مناسبة.</p>
    </div>

    <div class="card">
        <div class="icon">💬</div>
        <h2>دعم سريع</h2>
        <p>تواصل معنا بسهولة عبر واتساب.</p>
    </div>

</section>

<footer>
    WE Packages © 2026
</footer>

</body>
</html>
