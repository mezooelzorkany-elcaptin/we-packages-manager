<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="theme.js?v=20261016-1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>دفتر ديون الباقات | CASH BACK</title>
<style>body{visibility:hidden}*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:radial-gradient(ellipse at top,#29254d 0%,#17182d 55%,#101321 100%);color:#f4f2ff;min-height:100vh}.wrap{max-width:1150px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.title{font-size:28px;font-weight:900;color:#d8c5ff}.btn{border:1px solid #ffffff1c;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.back{background:#302b54;color:#eee7ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.panel,.debt{background:linear-gradient(145deg,#272943,#202239);border:1px solid #ffffff17;border-radius:18px;padding:17px;box-shadow:0 8px 24px #00000020}.stat small{display:block;color:#b5b7d0;margin-bottom:7px}.stat strong{font-size:24px;color:#fff}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select,.paymethod{min-height:43px;border:1px solid #ffffff24;border-radius:10px;padding:8px 11px;background:#191b30;color:#f5f3ff;min-width:0}.toolbar input{flex:1}.toolbar input::placeholder{color:#9da2c0}.toolbar select option,.paymethod option{background:#191b30;color:#f5f3ff}.list{display:grid;gap:11px}.debt{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:linear-gradient(120deg,#292b49,#22243d)}.name{font-weight:900;font-size:18px;color:#fff}.muted{color:#b0b4ce;font-size:13px;margin-top:5px}.amount{font-size:22px;font-weight:900;color:#ffc978}.settlebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.settle{background:linear-gradient(135deg,#10a887,#087f70);color:#fff}.status{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:900;background:#4a3a25;color:#ffd48a;margin-top:8px}.status.paid{background:#173f37;color:#8cf0cf}.msg{padding:12px;border-radius:12px;margin-bottom:12px;display:none}.err{background:#4c202d;color:#ffc2cc;border:1px solid #8f3548}.ok{background:#173f37;color:#8cf0cf;border:1px solid #247b68}.empty{background:#22243d;border:1px solid #ffffff17;border-radius:16px;padding:25px;text-align:center;color:#b0b4ce}@media(max-width:650px){.stats{grid-template-columns:1fr}.debt{grid-template-columns:1fr}.settlebox{justify-content:stretch}.paymethod{flex:1}.title{font-size:23px}}</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="title">📒 دفتر ديون الباقات</div><div class="muted">تابع التجديدات الآجلة وسجّل التسديد وطريقة الدفع</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn back" href="customers-list.html">← العملاء</a><a class="btn back" href="customers.html">الإدارة</a></div></div>
<div class="stats"><div class="stat"><small>إجمالي الديون المفتوحة</small><strong id="totalDue">0 ج.م</strong></div><div class="stat"><small>عدد العملاء عليهم ديون</small><strong id="dueCount">0</strong></div><div class="stat"><small>إجمالي المبالغ المسددة من الدفتر</small><strong id="paidTotal">0 ج.م</strong></div></div>
<div id="msg" class="msg"></div><div class="panel"><div class="toolbar"><input id="search" placeholder="ابحث باسم العميل أو رقم الموبايل"><select id="filter"><option value="unpaid">الديون المفتوحة</option><option value="paid">الديون المسددة</option><option value="all">الكل</option></select><button class="btn settle" id="addDebt">＋ إضافة دين يدوي</button><button class="btn back" id="refresh">تحديث</button></div><div id="list" class="list"><div class="empty">جاري تحميل الدفتر...</div></div></div>
</main>
<script>
(function(){
'use strict';
const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY',ADMIN='mezooelzorkany@gmail.com';
const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let rows=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
function message(text,error){$('msg').style.display='block';$('msg').className='msg '+(error?'err':'ok');$('msg').textContent=text;}
async function auth(){const {data,error}=await db.auth.getSession();if(error||!data.session||String(data.session.user?.email||'').toLowerCase()!==ADMIN){location.replace('customers.html');throw new Error('يجب تسجيل الدخول بحساب الإدارة');}document.body.style.visibility='visible';}
async function load(){try{await auth();const {data,error}=await db.from('package_debts').select('*').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render();}catch(e){message('تعذر تحميل دفتر الديون: '+(e.message||e),true);$('list').innerHTML='<div class="empty">تعذر تحميل الديون. تأكد من نشر إعدادات قاعدة البيانات ثم حدّث الصفحة.</div>';}}
function render(){const open=rows.filter(x=>x.status==='unpaid');$('totalDue').textContent=money(open.reduce((a,x)=>a+Number(x.amount||0),0));$('dueCount').textContent=String(open.length);$('paidTotal').textContent=money(rows.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0));const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=rows.filter(x=>(f==='all'||x.status===f)&&(!q||[x.customer_name,x.customer_phone,x.package_name].some(v=>String(v||'').toLowerCase().includes(q))));if(!list.length){$('list').innerHTML='<div class="empty">مفيش سجلات مطابقة.</div>';return;} $('list').innerHTML=list.map(x=>'<div class="debt"><div><div class="name">'+esc(x.customer_name)+'</div><div class="muted">📱 '+esc(x.customer_phone||'—')+' · 📦 '+esc(x.package_name||'—')+'</div><div class="muted">تاريخ التسجيل: '+esc(String(x.created_at||'').slice(0,10))+' · رقم العملية: '+esc(x.order_number||'—')+'</div><div class="status '+(x.status==='paid'?'paid':'')+'">'+(x.status==='paid'?'تم التسديد · '+esc(x.payment_method||''):'دين مفتوح')+'</div>'+(x.notes?'<div class="muted">ملاحظات: '+esc(x.notes)+'</div>':'')+'</div><div><div class="amount">'+money(x.amount)+'</div>'+(x.status==='unpaid'?'<div class="settlebox" style="margin-top:10px"><select class="paymethod" id="method-'+x.id+'"><option>الدفع النقدي</option><option>InstaPay</option><option>Vodafone Cash</option><option>تحويل بنكي</option><option>WE Pay</option></select><button class="btn settle" data-settle="'+x.id+'">✅ تسديد الدين</button><button class="btn back" data-edit="'+x.id+'">✏️ تعديل</button></div>':'<div class="settlebox" style="margin-top:10px"><div class="muted">تاريخ التسديد: '+esc(String(x.paid_at||'').slice(0,10))+'</div><button class="btn back" data-edit="'+x.id+'">✏️ تعديل البيانات</button></div>')+'</div></div>').join('');document.querySelectorAll('[data-settle]').forEach(b=>b.addEventListener('click',()=>settle(b.dataset.settle,b)));document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editDebt(b.dataset.edit,b)));}
async function editDebt(id,button){const x=rows.find(r=>String(r.id)===String(id));if(!x)return;const name=prompt('اسم العميل:',x.customer_name||'');if(name===null)return;if(!name.trim()){alert('اكتب اسم العميل');return;}const phone=prompt('رقم الموبايل:',x.customer_phone||'');if(phone===null)return;const pkg=prompt('اسم الباقة:',x.package_name||'');if(pkg===null)return;const amountText=prompt('مبلغ الدين بالجنيه:',String(x.amount??0));if(amountText===null)return;const amount=Number(amountText);if(!Number.isFinite(amount)||amount<0){alert('المبلغ غير صحيح');return;}const notes=prompt('ملاحظات (اتركها فارغة لو مفيش):',x.notes||'');if(notes===null)return;button.disabled=true;button.textContent='جاري الحفظ...';try{await auth();const upd=await db.from('package_debts').update({customer_name:name.trim(),customer_phone:phone.trim()||null,package_name:pkg.trim()||null,amount,notes:notes.trim()||null}).eq('id',x.id);if(upd.error)throw upd.error;await load();const verify=await db.from('package_debts').select('id,customer_name,customer_phone,package_name,amount,notes').eq('id',x.id).maybeSingle();if(verify.error)throw verify.error;if(!verify.data||verify.data.customer_name!==name.trim()||Number(verify.data.amount)!==amount)throw new Error('التعديل لم يظهر في قاعدة البيانات؛ راجع صلاحيات التحديث');message('تم تعديل بيانات الدين بنجاح',false);}catch(e){message('تعذر تعديل الدين: '+(e.message||e),true);button.disabled=false;button.textContent='✏️ تعديل';}}
async function settle(id,button){const x=rows.find(r=>String(r.id)===String(id));if(!x||x.status!=='unpaid')return;const method=$('method-'+id).value;if(!confirm('تأكيد تسديد '+money(x.amount)+' من العميل '+x.customer_name+' بطريقة '+method+'؟'))return;button.disabled=true;button.textContent='جاري التسجيل...';try{await auth();const tx='DEBT-PAY-'+x.id;const exists=await db.from('financial_transactions').select('id').eq('order_number',tx).maybeSingle();if(exists.error)throw exists.error;if(!exists.data){const ins=await db.from('financial_transactions').insert({customer_id:x.customer_id,customer_name:x.customer_name,customer_phone:x.customer_phone,package_name:x.package_name,amount:x.amount,transaction_type:'income',transaction_date:new Date().toISOString(),notes:'تسديد دين تجديد باقات — '+method,order_number:tx});if(ins.error)throw ins.error;}const upd=await db.from('package_debts').update({status:'paid',payment_method:method,paid_at:new Date().toISOString()}).eq('id',x.id).eq('status','unpaid').select('*').maybeSingle();if(upd.error)throw upd.error;if(!upd.data)throw new Error('الدين اتسدد بالفعل أو اتغير من مستخدم آخر');if(x.order_number){const order=await db.from('orders').update({status:'completed',payment_method:method}).eq('order_number',x.order_number);if(order.error)throw order.error;}message('تم تسديد الدين وتسجيل الإيراد بطريقة '+method,true===false);await load();}catch(e){message('تعذر تسجيل التسديد: '+(e.message||e),true);button.disabled=false;button.textContent='✅ تسديد الدين';}}
async function addDebtManually(){const btn=$('addDebt');btn.disabled=true;btn.textContent='جاري تحميل العملاء...';try{await auth();const cr=await db.from('customers').select('id,subscriber_name,phone,package_name,last_price').is('deleted_at',null).order('subscriber_name',{ascending:true}).limit(1000);if(cr.error)throw cr.error;const customers=cr.data||[];if(!customers.length)throw new Error('مفيش عملاء متاحين للاختيار');const list=customers.map((c,i)=>(i+1)+') '+(c.subscriber_name||'بدون اسم')+' — '+(c.phone||'بدون رقم')+' — '+(c.package_name||'بدون باقة')).join('\n');const pick=prompt('اختار العميل بكتابة الرقم من القائمة:\n\n'+list);if(pick===null)return;const index=Number(pick.trim())-1;if(!Number.isInteger(index)||index<0||index>=customers.length){alert('رقم اختيار غير صحيح');return;}const customer=customers[index];const amountText=prompt('المبلغ المستحق على '+customer.subscriber_name+' ('+(customer.phone||'بدون رقم')+') بالجنيه:');if(amountText===null)return;const amount=Number(amountText);if(!Number.isFinite(amount)||amount<=0){alert('اكتب مبلغ صحيح أكبر من صفر');return;}const notes=prompt('ملاحظات (اختياري):','تجديد مسجل بدون تسجيل الدين');if(notes===null)return;btn.textContent='جاري تسجيل الدين...';const order='MANUAL-DEBT-'+Date.now();const ins=await db.from('package_debts').insert({customer_id:customer.id,customer_name:customer.subscriber_name,customer_phone:customer.phone,package_name:customer.package_name,amount,status:'unpaid',notes:notes.trim()||null,order_number:order}).select('id').maybeSingle();if(ins.error)throw ins.error;let financeNote='';if(customer.phone){const since=new Date(Date.now()-3*86400000).toISOString();const candidates=await db.from('financial_transactions').select('id,amount,transaction_date,transaction_type,customer_phone,order_number').eq('customer_phone',customer.phone).eq('amount',amount).gte('transaction_date',since).order('transaction_date',{ascending:false}).limit(3);if(candidates.error)throw candidates.error;const matches=(candidates.data||[]).filter(t=>!String(t.order_number||'').startsWith('DEBT-PAY-'));if(matches.length===1&&confirm('لقيت عملية مالية واحدة بنفس رقم العميل والمبلغ خلال آخر 3 أيام. حذفها من الماليات حتى لا يتحسب الإيراد مرتين؟')){const del=await db.from('financial_transactions').delete().eq('id',matches[0].id);if(del.error)throw del.error;financeNote=' وتم حذف العملية المالية المطابقة';}else if(matches.length>0){financeNote=' — راجع الماليات واحذف عملية التجديد المسجلة كمدفوعة يدويًا لتجنب تكرار الإيراد';}}message('تم تسجيل دين '+customer.subscriber_name+' بنجاح'+financeNote,false);$('filter').value='unpaid';await load();}catch(e){message('تعذر إضافة الدين: '+(e.message||e),true);}finally{btn.disabled=false;btn.textContent='＋ إضافة دين يدوي';}}
$('addDebt').addEventListener('click',addDebtManually);
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('refresh').addEventListener('click',load);load();
})();
</script></body></html>
