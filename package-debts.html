<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="theme.js?v=20261016-1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>دفتر ديون الباقات | CASH BACK</title>
<style>body{visibility:hidden}*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}body{margin:0;background:#f7f6fb;color:#1d2435}.wrap{max-width:1150px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.title{font-size:28px;font-weight:900;color:#5420b8}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.back{background:#eee4ff;color:#5420b8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.panel,.debt{background:#fff;border:1px solid #ebe7f2;border-radius:18px;padding:17px;box-shadow:0 5px 20px #00000008}.stat small{display:block;color:#777;margin-bottom:7px}.stat strong{font-size:24px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select,.paymethod{min-height:43px;border:1px solid #ddd;border-radius:10px;padding:8px 11px;background:#fff;min-width:0}.toolbar input{flex:1}.list{display:grid;gap:11px}.debt{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.name{font-weight:900;font-size:18px}.muted{color:#7c8291;font-size:13px;margin-top:5px}.amount{font-size:22px;font-weight:900;color:#b45309}.settlebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.settle{background:#15803d;color:#fff}.status{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:900;background:#fff0d2;color:#945b00;margin-top:8px}.status.paid{background:#dcfce7;color:#166534}.msg{padding:12px;border-radius:12px;margin-bottom:12px;display:none}.err{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.empty{background:#fff;border-radius:16px;padding:25px;text-align:center;color:#777}@media(max-width:650px){.stats{grid-template-columns:1fr}.debt{grid-template-columns:1fr}.settlebox{justify-content:stretch}.paymethod{flex:1}.title{font-size:23px}}</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="title">📒 دفتر ديون الباقات</div><div class="muted">تابع التجديدات الآجلة وسجّل التسديد وطريقة الدفع</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn back" href="customers-list.html">← العملاء</a><a class="btn back" href="customers.html">الإدارة</a></div></div>
<div class="stats"><div class="stat"><small>إجمالي الديون المفتوحة</small><strong id="totalDue">0 ج.م</strong></div><div class="stat"><small>عدد العملاء عليهم ديون</small><strong id="dueCount">0</strong></div><div class="stat"><small>إجمالي المبالغ المسددة من الدفتر</small><strong id="paidTotal">0 ج.م</strong></div></div>
<div id="msg" class="msg"></div><div class="panel"><div class="toolbar"><input id="search" placeholder="ابحث باسم العميل أو رقم الموبايل"><select id="filter"><option value="unpaid">الديون المفتوحة</option><option value="paid">الديون المسددة</option><option value="all">الكل</option></select><button class="btn back" id="refresh">تحديث</button></div><div id="list" class="list"><div class="empty">جاري تحميل الدفتر...</div></div></div>
</main>
<script>
(function(){
'use strict';
const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY',ADMIN='mezooelzorkany@gmail.com';
const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let rows=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
function message(text,error){$('msg').style.display='block';$('msg').className='msg '+(error?'err':'ok');$('msg').textContent=text;}
async function auth(){const {data,error}=await db.auth.getSession();if(error||!data.session||String(data.session.user?.email||'').toLowerCase()!==ADMIN){location.replace('customers.html');throw new Error('يجب تسجيل الدخول بحساب الإدارة');}document.body.style.visibility='visible';}
async function load(){try{await auth();const {data,error}=await db.from('package_debts').select('*').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render();}catch(e){message('تعذر تحميل دفتر الديون: '+(e.message||e),true);$('list').innerHTML='<div class="empty">تعذر تحميل الديون. تأكد من نشر إعدادات قاعدة البيانات ثم حدّث الصفحة.</div>';}}
function render(){const open=rows.filter(x=>x.status==='unpaid');$('totalDue').textContent=money(open.reduce((a,x)=>a+Number(x.amount||0),0));$('dueCount').textContent=String(open.length);$('paidTotal').textContent=money(rows.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0));const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=rows.filter(x=>(f==='all'||x.status===f)&&(!q||[x.customer_name,x.customer_phone,x.package_name].some(v=>String(v||'').toLowerCase().includes(q))));if(!list.length){$('list').innerHTML='<div class="empty">مفيش سجلات مطابقة.</div>';return;} $('list').innerHTML=list.map(x=>'<div class="debt"><div><div class="name">'+esc(x.customer_name)+'</div><div class="muted">📱 '+esc(x.customer_phone||'—')+' · 📦 '+esc(x.package_name||'—')+'</div><div class="muted">تاريخ التسجيل: '+esc(String(x.created_at||'').slice(0,10))+' · رقم العملية: '+esc(x.order_number||'—')+'</div><div class="status '+(x.status==='paid'?'paid':'')+'">'+(x.status==='paid'?'تم التسديد · '+esc(x.payment_method||''):'دين مفتوح')+'</div>'+(x.notes?'<div class="muted">ملاحظات: '+esc(x.notes)+'</div>':'')+'</div><div><div class="amount">'+money(x.amount)+'</div>'+(x.status==='unpaid'?'<div class="settlebox" style="margin-top:10px"><select class="paymethod" id="method-'+x.id+'"><option>الدفع النقدي</option><option>InstaPay</option><option>Vodafone Cash</option><option>تحويل بنكي</option><option>WE Pay</option></select><button class="btn settle" data-settle="'+x.id+'">✅ تسديد الدين</button></div>':'<div class="muted">تاريخ التسديد: '+esc(String(x.paid_at||'').slice(0,10))+'</div>')+'</div></div>').join('');document.querySelectorAll('[data-settle]').forEach(b=>b.addEventListener('click',()=>settle(b.dataset.settle,b)));}
async function settle(id,button){const x=rows.find(r=>String(r.id)===String(id));if(!x||x.status!=='unpaid')return;const method=$('method-'+id).value;if(!confirm('تأكيد تسديد '+money(x.amount)+' من العميل '+x.customer_name+' بطريقة '+method+'؟'))return;button.disabled=true;button.textContent='جاري التسجيل...';try{await auth();const tx='DEBT-PAY-'+x.id;const exists=await db.from('financial_transactions').select('id').eq('order_number',tx).maybeSingle();if(exists.error)throw exists.error;if(!exists.data){const ins=await db.from('financial_transactions').insert({customer_id:x.customer_id,customer_name:x.customer_name,customer_phone:x.customer_phone,package_name:x.package_name,amount:x.amount,transaction_type:'income',transaction_date:new Date().toISOString(),notes:'تسديد دين تجديد باقات — '+method,order_number:tx});if(ins.error)throw ins.error;}const upd=await db.from('package_debts').update({status:'paid',payment_method:method,paid_at:new Date().toISOString()}).eq('id',x.id).eq('status','unpaid').select('*').maybeSingle();if(upd.error)throw upd.error;if(!upd.data)throw new Error('الدين اتسدد بالفعل أو اتغير من مستخدم آخر');if(x.order_number){const order=await db.from('orders').update({status:'completed',payment_method:method}).eq('order_number',x.order_number);if(order.error)throw order.error;}message('تم تسديد الدين وتسجيل الإيراد بطريقة '+method,true===false);await load();}catch(e){message('تعذر تسجيل التسديد: '+(e.message||e),true);button.disabled=false;button.textContent='✅ تسديد الدين';}}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('refresh').addEventListener('click',load);load();
})();
</script></body></html>
