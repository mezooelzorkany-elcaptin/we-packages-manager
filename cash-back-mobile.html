<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASH BACK</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Tahoma,sans-serif;background:#0b0b0d;color:#fff}#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#f7f6fb}#top{height:64px;flex:0 0 64px;background:#111318;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;z-index:20;box-shadow:0 2px 14px #0004}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand img{width:46px;height:46px;border-radius:12px;object-fit:cover}.brand span{font-size:17px}.top-actions{display:flex;gap:8px}.top-actions button{width:42px;height:42px;border:0;border-radius:12px;background:#24262c;color:#fff;font-size:20px}#frame{flex:1;width:100%;border:0;background:#fff}#bar{height:76px;flex:0 0 76px;background:#111318;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px max(7px,env(safe-area-inset-bottom));gap:4px;z-index:30;box-shadow:0 -3px 18px #0005}.tab{border:0;background:transparent;color:#9da3b3;border-radius:14px;font-size:11px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab .ico{font-size:21px}.tab.active{background:#5420b8;color:#fff}.sheet,.panel{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-end}.sheet.show,.panel.show{display:flex}.sheetbox,.panelbox{width:100%;max-height:86vh;overflow:auto;background:#111827;color:#fff;border-radius:24px 24px 0 0;padding:18px 16px 28px}.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sheetbtn{border:1px solid #334155;background:#1e293b;color:#fff;border-radius:16px;padding:16px 8px;font-weight:bold}.close{width:100%;height:48px;border:0;border-radius:14px;background:#334155;color:#fff;font-weight:bold;margin-top:14px}.panelbox h2{margin:0 0 14px}.request{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:14px;margin-bottom:10px}.request .row{display:flex;justify-content:space-between;gap:10px;margin:5px 0}.request .name{font-size:18px;font-weight:900}.request .muted{color:#94a3b8}.request .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.approve,.reject,.printer{height:44px;border:0;border-radius:12px;color:#fff;font-weight:bold}.approve{background:#159447}.reject{background:#d93645}.printer{background:#5420b8;width:100%;margin-top:10px}.emptyx{text-align:center;color:#94a3b8;padding:30px 10px}.printer-item{padding:14px;border:1px solid #334155;border-radius:14px;background:#1e293b;margin-bottom:9px}.printer-item button{margin-top:8px;width:100%;height:42px;border:0;border-radius:12px;background:#5420b8;color:#fff;font-weight:bold}.status{font-size:13px;color:#94a3b8;margin:8px 0}@media(max-width:390px){.brand span{font-size:15px}.tab{font-size:10px}.tab .ico{font-size:19px}}</style></head><body><div id="app"><div id="top"><div class="brand"><img id="logo" src="logo.png"><span>CASH BACK Admin</span></div><div class="top-actions"><button onclick="toggleDark()" id="darkBtn">🌙</button><button onclick="reloadFrame()">↻</button></div></div><iframe id="frame" title="CASH BACK"></iframe><div id="bar"><button class="tab" data-page="home" onclick="go('home',this)"><span class="ico">⌂</span>الرئيسية</button><button class="tab" data-page="customers" onclick="go('customers',this)"><span class="ico">👥</span>العملاء</button><button class="tab" data-page="renewals" onclick="openRenewals(this)"><span class="ico">🔄</span>التجديدات</button><button class="tab" data-page="finance" onclick="go('finance',this)"><span class="ico">💰</span>الماليات</button><button class="tab" data-page="more" onclick="openMore(this)"><span class="ico">☷</span>المزيد</button></div></div><div id="more" class="sheet" onclick="if(event.target===this)closeMore()"><div class="sheetbox"><h2>المزيد</h2><div class="sheetgrid"><button class="sheetbtn" onclick="goFromMore('packages')">📦 الباقات</button><button class="sheetbtn" onclick="goFromMore('numbers')">📱 الأرقام</button><button class="sheetbtn" onclick="goFromMore('codes')">🎟️ الأكواد</button><button class="sheetbtn" onclick="goFromMore('payment')">💳 الدفع</button><button class="sheetbtn" onclick="openPrinters()">🖨️ الطابعة</button></div><button class="close" onclick="closeMore()">إغلاق</button></div></div><div id="renewals" class="panel" onclick="if(event.target===this)closeRenewals()"><div class="panelbox"><h2>🔄 طلبات التجديد</h2><div id="renewalList"></div><button class="close" onclick="closeRenewals()">إغلاق</button></div></div><div id="printers" class="panel" onclick="if(event.target===this)closePrinters()"><div class="panelbox"><h2>🖨️ طابعة 80mm</h2><div class="status" id="printerStatus">ابحث عن الطابعات المقترنة بالموبايل.</div><div id="printerList"></div><button class="close" onclick="closePrinters()">إغلاق</button></div></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const BASE='https://mezooelzorkany-elcaptin.github.io/we-packages-manager/';const SUPA='https://pgvbynefhqmyzjtccttl.supabase.co';const KEY='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';const frame=document.getElementById('frame');let dark=localStorage.getItem('app_theme')==='dark';let printerPlugin=null;try{printerPlugin=window.Capacitor?.registerPlugin?.('CashBackPrinter')}catch(e){}function urlFor(p){return {home:BASE+'customers.html',customers:BASE+'customers.html',finance:BASE+'finances.html',packages:BASE+'packages.html',numbers:BASE+'numbers.html',codes:BASE+'admin.html',payment:BASE+'payment.html'}[p]||BASE+'customers.html'}function go(p,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(p==='renewals'){openRenewals(btn);return}frame.src=urlFor(p);closeMore()}function goFromMore(p){frame.src=urlFor(p);closeMore();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector('[data-page="more"]').classList.add('active')}function reloadFrame(){frame.src=frame.src}function closeMore(){document.getElementById('more').classList.remove('show')}function openMore(btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('more').classList.add('show')}function closeRenewals(){document.getElementById('renewals').classList.remove('show')}function closePrinters(){document.getElementById('printers').classList.remove('show')}function toggleDark(){dark=!dark;localStorage.setItem('app_theme',dark?'dark':'light');applyTheme()}function applyTheme(){document.getElementById('darkBtn').textContent=dark?'☀️':'🌙';try{frame.contentWindow.localStorage.setItem('app_theme',dark?'dark':'light');frame.contentDocument.documentElement.classList.toggle('dark-mode',dark);injectFrameCss()}catch(e){}}function injectFrameCss(){try{const d=frame.contentDocument;if(!d)return;let s=d.getElementById('cashBackShellCss');if(!s){s=d.createElement('style');s.id='cashBackShellCss';d.head.appendChild(s)}s.textContent='.side,.top,.nav,.logout,#adminBottomNav,.customers-navigation,a.back,.theme-btn{display:none!important}.main{margin-right:0!important}.content{padding-bottom:110px!important;max-width:none!important}.invoice-modal{width:80mm!important;max-width:80mm!important;border-radius:0!important}.invoice-paper{width:80mm!important;padding:10px!important}.invoice-actions,.invoice-topbar{display:none!important}body{padding-bottom:0!important}'+(dark?'body{background:#0f172a!important;color:#f8fafc!important}.card,.panel,.box,.modalbox,.invoice-modal,.customer-card,.promo{background:#111827!important;color:#f8fafc!important;border-color:#334155!important}input,select{background:#1e293b!important;color:#fff!important;border-color:#475569!important}.info-box{background:#1e293b!important;color:#fff!important}':'')}catch(e){}}async function openRenewals(btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('renewals').classList.add('show');const box=document.getElementById('renewalList');box.innerHTML='<div class="emptyx">⏳ جاري تحميل الطلبات...</div>';try{const r=await fetch(SUPA+'/rest/v1/orders?select=order_number,subscriber_name,phone,package_name,package_gb,final_price,payment_method,status,payment_screenshot&status=eq.payment_submitted&order_number=like.REN-*',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const data=await r.json();if(!Array.isArray(data)||!data.length){box.innerHTML='<div class="emptyx">لا توجد طلبات تجديد معلقة ✅</div>';return}box.innerHTML=data.map(o=>`<div class="request"><div class="name">${esc(o.subscriber_name||'عميل')}</div><div class="row"><span class="muted">الطلب</span><b>${esc(o.order_number)}</b></div><div class="row"><span class="muted">الرقم</span><b>${esc(o.phone)}</b></div><div class="row"><span class="muted">الباقة</span><b>${esc(o.package_name)} — ${Number(o.package_gb)||0} جيجا</b></div><div class="row"><span class="muted">المبلغ</span><b>${Number(o.final_price)||0} جنيه</b></div><div class="row"><span class="muted">الدفع</span><b>${esc(o.payment_method||'-')}</b></div><div class="actions"><button class="approve" onclick="setOrder('${escAttr(o.order_number)}','approved')">✅ قبول</button><button class="reject" onclick="setOrder('${escAttr(o.order_number)}','payment_rejected')">❌ رفض</button></div></div>`).join('')}catch(e){box.innerHTML='<div class="emptyx">❌ تعذر تحميل الطلبات</div>'}}async function setOrder(order,status){const r=await fetch(SUPA+'/rest/v1/orders?order_number=eq.'+encodeURIComponent(order),{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({status})});if(!r.ok){alert('تعذر تحديث الطلب');return}openRenewals(document.querySelector('[data-page="renewals"]'))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function escAttr(v){return String(v??'').replace(/'/g,"\\'")}function openPrinters(){document.getElementById('printers').classList.add('show');loadPrinters()}async function loadPrinters(){const list=document.getElementById('printerList'),status=document.getElementById('printerStatus');list.innerHTML='';if(!printerPlugin){status.textContent='ميزة الطابعة ستعمل بعد تثبيت النسخة الجديدة.';return}try{const r=await printerPlugin.list();const devices=r.devices||[];if(!devices.length){status.textContent='مفيش طابعة Bluetooth مقترنة. اقترن بالطابعة من إعدادات Bluetooth أولاً.';return}status.textContent='اختار طابعة 80mm:';list.innerHTML=devices.map(d=>`<div class="printer-item"><b>${esc(d.name)}</b><div class="muted">${esc(d.address)}</div><button onclick="selectPrinter('${escAttr(d.address)}','${escAttr(d.name)}')">استخدام الطابعة دي</button></div>`).join('')}catch(e){status.textContent='❌ '+(e.message||'تعذر قراءة الطابعات')}}function selectPrinter(address,name){localStorage.setItem('printer_address',address);localStorage.setItem('printer_name',name);document.getElementById('printerStatus').textContent='✅ تم اختيار '+name;setTimeout(closePrinters,700)}async function printInvoiceNative(){try{const d=frame.contentDocument;const paper=d.getElementById('invoicePaper');if(!paper){alert('افتح الفاتورة أولاً');return}const address=localStorage.getItem('printer_address');if(!address){openPrinters();return}if(!window.html2canvas){alert('جاري تجهيز الطباعة، حاول مرة أخرى');return}const canvas=await html2canvas(paper,{scale:2,backgroundColor:'#fff',useCORS:true});const base64=canvas.toDataURL('image/png').split(',')[1];await printerPlugin.printImage({address,base64});alert('✅ تمت الطباعة')}catch(e){alert('❌ فشل الطباعة: '+(e.message||e))}}frame.addEventListener('load',()=>{applyTheme();try{frame.contentWindow.printInvoice=printInvoiceNative}catch(e){}});window.addEventListener('load',()=>{document.querySelector('[data-page="customers"]').classList.add('active');frame.src=urlFor('customers')});</script></body></html>
