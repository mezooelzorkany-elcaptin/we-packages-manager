name: CASH BACK Android APK

on:
  push:
    branches: [cash-back-admin-android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cash-back-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cash-back-android/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: ./android/gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cash-back-admin-debug-apk
          path: cash-back-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
