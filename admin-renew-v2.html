<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تجديد العميل | CASH BACK V2</title>

<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}
body{margin:0;background:linear-gradient(180deg,#f7f6fb 0%,#f1eef9 100%);color:#1d2435}
.wrap{width:min(920px,100%);margin:auto;padding:24px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}
.title{font-size:28px;font-weight:900;color:#5420b8}
.back{border:0;border-radius:14px;padding:12px 18px;background:#eee4ff;color:#5420b8;font-weight:900;cursor:pointer}
.card{background:#fff;border:1px solid #e8e2f2;border-radius:24px;padding:24px;box-shadow:0 10px 35px #0000000d;margin-bottom:16px}
.customer{background:linear-gradient(135deg,#5420b8 0%,#7c35d5 55%,#9747ff 100%);color:#fff;padding:25px 28px}
.customer h2{margin:0 0 12px;font-size:25px}
.customer p{margin:8px 0;font-size:15px;opacity:.95}
.customer p:last-child{margin-bottom:0}
.section-title{font-size:19px;font-weight:900;color:#5420b8;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin:0}
.field label{display:block;font-size:14px;font-weight:900;margin-bottom:8px;color:#333}
.field input,.field select,.field textarea{width:100%;height:52px;border:1px solid #dcd8e6;border-radius:14px;padding:0 14px;background:#fff;outline:none;font-size:15px;color:#1d2435}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7c3aed;box-shadow:0 0 0 3px #7c3aed18}
.field textarea{height:95px;padding:13px;resize:vertical}
.full{grid-column:1/-1}
.payment{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pay{min-height:58px;border:1px solid #ddd;border-radius:14px;background:#f8f8fb;padding:12px 8px;font-weight:900;cursor:pointer;color:#333}
.pay.active{background:#e4f8ec;color:#08752d;border-color:#72c88f;box-shadow:0 0 0 2px #e4f8ec}
.file{height:auto!important;padding:13px!important}
.hint{display:block;color:#888;margin-top:7px;font-size:12px}
.save{width:100%;height:58px;border:0;border-radius:15px;background:linear-gradient(135deg,#5420b8,#7c3aed);color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 10px 25px #5420b82b}
.save:disabled{opacity:.6}
.skip{width:100%;height:54px;border:1px solid #f0c36d;border-radius:15px;background:#fff7ed;color:#b45309;font-size:16px;font-weight:900;cursor:pointer;margin-top:10px}
.skip:hover{background:#ffedd5}
.msg{text-align:center;font-weight:bold;padding:10px;line-height:1.7}
.success{text-align:center;background:#e4f8ec;color:#08752d;border-radius:15px;padding:16px;display:none;margin-top:14px}
html.dark-mode body{background:#0f172a!important;color:#f8fafc!important}
html.dark-mode .card{background:#1e293b!important;border-color:#334155!important}
html.dark-mode .field input,html.dark-mode .field select,html.dark-mode .field textarea{background:#334155!important;color:#fff!important;border-color:#475569!important}
html.dark-mode .pay{background:#334155;color:#fff;border-color:#475569}
html.dark-mode .pay.active{background:#14532d;color:#bbf7d0;border-color:#166534}
@media(max-width:700px){.payment{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:16px 12px 45px}.card{padding:18px;border-radius:20px}.customer{padding:20px}.title{font-size:22px}.top{align-items:center}.field input,.field select{height:50px}}
@media(max-width:430px){.top{flex-direction:column;align-items:stretch}.back{width:100%}.payment{grid-template-columns:1fr 1fr}.pay{font-size:13px}}html.dark-mode body{background:#0f172a!important;color:#f8fafc!important}html.dark-mode .card{background:#1e293b!important;border-color:#334155!important}html.dark-mode .field input,html.dark-mode .field select,html.dark-mode .field textarea{background:#334155!important;color:#fff!important;border-color:#475569!important}html.dark-mode .pay{background:#334155;color:#fff;border-color:#475569}html.dark-mode .pay.active{background:#14532d;color:#bbf7d0;border-color:#166534}@media(max-width:600px){.grid,.payment{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start}.title{font-size:21px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="title">🔄 تجديد العميل</div><button class="back" onclick="location.href='customers.html'">↩️ رجوع للعملاء</button></div>
<section id="customerCard" class="card customer"><h2 id="name">جاري تحميل العميل...</h2><p id="phone"></p><p id="package"></p><p id="currentRenewal"></p></section>
<section id="formCard" class="card"><div class="section-title">📋 بيانات التجديد</div><div class="grid">
<div class="field"><label>💰 مبلغ التجديد</label><input id="amount" type="number" min="0" step="0.01"></div>
<div class="field"><label>📅 التجديد القادم</label><input id="next" type="date"></div>
<div class="field"><label>📌 نظام التجديد</label><select id="renewalType"><option value="day_1">يوم 1</option><option value="day_16">يوم 16</option><option value="custom">تاريخ مخصص</option></select></div>
<div class="field"><label>🔢 يوم التجديد</label><input id="renewalDay" type="number" min="1" max="31"></div>
<div class="field full"><label>💳 طريقة الدفع</label><div class="payment"><button type="button" class="pay active" data-pay="الدفع النقدي">💵 الدفع النقدي</button><button type="button" class="pay" data-pay="InstaPay">📲 InstaPay</button><button type="button" class="pay" data-pay="Vodafone Cash">📱 Vodafone Cash</button><button type="button" class="pay" data-pay="تحويل بنكي">🏦 تحويل بنكي</button></div></div>
<div class="field full"><label>🖼️ صورة التحويل / إثبات الدفع (اختياري)</label><input id="shot" class="file" type="file" accept="image/*"><small style="display:block;color:#888;margin-top:5px">في حالة الكاش اتركها فارغة.</small></div>
<div class="field full"><label>📝 ملاحظات</label><textarea id="notes" placeholder="مثال: تم التجديد يدويًا من الإدارة"></textarea></div>
</div><div id="msg" class="msg"></div>
<button id="save" class="save">✅ تأكيد التجديد وتسجيل العملية</button>
<button id="skip" class="skip" type="button">⏸️ مش هيجدد الشهر ده</button><div id="success" class="success"></div></section>
</main>
<script>
(function(){
  var boot=document.getElementById('name');
  if(boot) boot.textContent='⚙️ جاري تشغيل صفحة التجديد...';
  window.addEventListener('error',function(e){
    var m=document.getElementById('msg');
    if(m) m.textContent='❌ خطأ في الصفحة: '+(e.message||'JavaScript error');
  });
})();
</script>
<script>
(function(){
'use strict';

var U='https://pgvbynefhqmyzjtccttl.supabase.co';
var K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';
var $=function(id){return document.getElementById(id);};
var params=new URLSearchParams(window.location.search);
var customerId=params.get('customer_id') || params.get('id') || sessionStorage.getItem('renew_customer_id');
var customer=null;
var payment='الدفع النقدي';

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
  });
}
function pad(n){return String(n).padStart(2,'0');}
function dateText(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nextDate(day){
  var d=new Date();
  d.setHours(0,0,0,0);
  var y=d.getFullYear(),m=d.getMonth();
  if(day<=d.getDate()) m++;
  return new Date(y,m,day);
}
function showError(message){
  if($('name')) $('name').textContent='❌ تعذر تحميل العميل';
  if($('customerCard')) $('customerCard').innerHTML='<h2>❌ تعذر تحميل العميل</h2><p>'+esc(message)+'</p>';
  if($('formCard')) $('formCard').style.display='none';
}
async function api(path,options){
  options=options||{};
  var headers=Object.assign({
    'apikey':K,
    'Authorization':'Bearer '+K,
    'Content-Type':'application/json',
    'Prefer':'return=representation'
  },options.headers||{});
  var response=await fetch(U+'/rest/v1/'+path,Object.assign({},options,{headers:headers}));
  var raw=await response.text();
  var data;
  try{data=raw?JSON.parse(raw):null;}catch(e){data=raw;}
  if(!response.ok){
    throw new Error((data&&data.message)|| (data&&data.details)|| (data&&data.hint)|| String(data||('HTTP '+response.status)));
  }
  return data;
}
async function load(){
  try{
    if(!customerId) throw new Error('لم يتم تمرير رقم العميل. ارجع لصفحة العملاء واضغط «تجديد الآن» من نفس العميل.');
    var rows=await api('customers?select=*&id=eq.'+encodeURIComponent(customerId)+'&deleted_at=is.null&limit=1');
    if(!Array.isArray(rows)||rows.length===0) throw new Error('العميل غير موجود أو تم حذفه.');
    customer=rows[0];
    sessionStorage.removeItem('renew_customer_id');
    $('name').textContent='👤 '+(customer.subscriber_name||'بدون اسم');
    $('phone').textContent='📱 '+(customer.phone||'-');
    $('package').textContent='📦 '+(customer.package_name||'-')+' — '+(Number(customer.allocated_gb)||0)+' GB';
    $('currentRenewal').textContent='📅 التجديد الحالي: '+(customer.next_renewal_date||'-');
    $('amount').value=Math.max(0,Number(customer.last_price||0)-Number(customer.discount_amount||0));
    var rt=customer.renewal_type||'day_1';
    $('renewalType').value=rt;
    $('renewalDay').value=customer.renewal_day||'';
    if(Number(customer.renewal_day)===1) $('next').value=dateText(nextDate(1));
    else if(Number(customer.renewal_day)===16) $('next').value=dateText(nextDate(16));
    else $('next').value=customer.next_renewal_date||dateText(nextDate(1));
    $('msg').textContent='✅ الصفحة جاهزة — '+(customer.subscriber_name||'العميل');
  }catch(e){
    showError(e.message||String(e));
  }
}
async function skipRenewal(){
  if(!customer){$('msg').textContent='❌ بيانات العميل لم تُحمّل بعد';return;}
  if(!window.confirm('⏸️ '+(customer.subscriber_name||'العميل')+'\n\nتحديد العميل إنه مش هيجدد الشهر ده؟')) return;
  var b=$('skip');
  b.disabled=true;
  b.textContent='⏳ جاري الحفظ...';
  try{
    var d=new Date();
    var month=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01';
    await api('customers?id=eq.'+encodeURIComponent(customer.id),{
      method:'PATCH',
      body:JSON.stringify({skip_renewal_month:month,updated_at:new Date().toISOString()})
    });
    $('success').style.display='block';
    $('success').textContent='⏸️ تم تسجيل عدم التجديد لهذا الشهر.';
    b.textContent='تم الحفظ';
    setTimeout(function(){location.href='customers.html';},800);
  }catch(e){
    $('msg').style.color='#b00020';
    $('msg').textContent='❌ لم يتم تسجيل عدم التجديد: '+(e.message||e);
    b.disabled=false;
    b.textContent='⏸️ مش هيجدد الشهر ده';
  }
}
async function save(){
  if(!customer){$('msg').textContent='❌ بيانات العميل لم تُحمّل بعد';return;}
  var b=$('save');
  b.disabled=true;
  b.textContent='⏳ جاري تسجيل التجديد...';
  $('msg').textContent='';
  try{
    var amount=Number($('amount').value);
    var next=$('next').value;
    if(!(amount>=0)) throw new Error('اكتب مبلغ التجديد');
    if(!next) throw new Error('حدد تاريخ التجديد القادم');
    var now=new Date().toISOString();
    var order='REN-'+Date.now().toString(36).toUpperCase();
    var shot=null;
    var file=$('shot').files&&$('shot').files[0];
    if(file){
      shot=await new Promise(function(resolve,reject){
        var reader=new FileReader();
        reader.onload=function(){
          var img=new Image();
          img.onload=function(){
            var max=1100,scale=Math.min(1,max/img.width),canvas=document.createElement('canvas');
            canvas.width=Math.round(img.width*scale);
            canvas.height=Math.round(img.height*scale);
            canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
            resolve(canvas.toDataURL('image/jpeg',.72));
          };
          img.onerror=reject;
          img.src=reader.result;
        };
        reader.onerror=reject;
        reader.readAsDataURL(file);
      });
    }
    await api('orders',{
      method:'POST',
      body:JSON.stringify({
        order_number:order,customer_id:customer.id,subscriber_name:customer.subscriber_name,
        phone:customer.phone,package_name:customer.package_name,package_gb:customer.allocated_gb,
        original_price:amount,final_price:amount,payment_method:payment,payment_screenshot:shot,
        renewal_type:$('renewalType').value,renewal_day:Number($('renewalDay').value)||null,status:'completed'
      })
    });
    await api('invoices',{
      method:'POST',
      body:JSON.stringify({
        order_number:order,customer_id:customer.id,customer_name:customer.subscriber_name,
        phone:customer.phone,package_name:customer.package_name,package_gb:customer.allocated_gb,
        original_price:amount,discount_code:null,discount_amount:0,amount:amount,
        notes:'تجديد يدوي — '+payment+($('notes').value.trim()?' — '+$('notes').value.trim():'')
      })
    });
    await api('customers?id=eq.'+encodeURIComponent(customer.id),{
      method:'PATCH',
      body:JSON.stringify({
        payment_method:payment,next_renewal_date:next,renewal_type:$('renewalType').value,
        renewal_day:Number($('renewalDay').value)||null,last_renewed_at:now,last_order_at:now,
        total_orders:Number(customer.total_orders||0)+1,updated_at:now,status:'active',
        skip_renewal_month:null
      })
    });
    $('success').style.display='block';
    $('success').innerHTML='✅ تم تجديد <b>'+esc(customer.subscriber_name||'العميل')+'</b> بنجاح<br>رقم العملية: <b>'+esc(order)+'</b>';
    b.textContent='تم التجديد بنجاح';
    setTimeout(function(){location.href='customers.html';},900);
  }catch(e){
    $('msg').style.color='#b00020';
    $('msg').textContent='❌ لم يتم التجديد: '+(e.message||e);
    b.disabled=false;
    b.textContent='✅ تأكيد التجديد وتسجيل العملية';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.pay').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.pay').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      payment=b.getAttribute('data-pay')||'الدفع النقدي';
    });
  });
  $('renewalType').addEventListener('change',function(){
    var t=$('renewalType').value;
    if(t==='day_1'){$('renewalDay').value=1;$('next').value=dateText(nextDate(1));}
    if(t==='day_16'){$('renewalDay').value=16;$('next').value=dateText(nextDate(16));}
  });
  $('save').addEventListener('click',save);
  $('skip').addEventListener('click',skipRenewal);
  load();
});
})();
</script>
</body></html>
