<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CASH BACK - الفواتير</title><script src="theme.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;min-height:100vh;background:radial-gradient(circle at 100% 0%,#a568f0 0%,transparent 38%),linear-gradient(135deg,#f2effb,#ded5f0,#d2c6e8);color:#19182d;transition:.2s}.container{width:92%;max-width:1050px;margin:auto;padding:25px 0 70px}.glass{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:26px;backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(60,35,120,.13)}.header{text-align:center;padding:24px;margin-bottom:18px}.header h1{margin:0;color:#5420b8;font-size:32px}.header p{margin:8px 0 0;color:#707080}.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;margin-bottom:18px}.topbar h2{margin:0;color:#5420b8}.back{display:inline-flex;padding:12px 18px;border-radius:14px;background:#e8ddff;color:#5420b8;text-decoration:none;font-weight:bold}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:18px}.toolbar input,.toolbar select{width:100%;padding:14px;border:1px solid #ddd;border-radius:15px;background:#fff;color:#19182d;font-size:16px;outline:none}.invoice{padding:18px;margin-bottom:18px}.receipt{background:#fff;color:#171526;border-radius:22px;padding:20px;max-width:560px;margin:auto;box-shadow:0 12px 35px rgba(40,20,80,.12);border:1px solid #eee;transition:.2s}.receipt-brand{text-align:center;border-bottom:1px dashed #bbb;padding-bottom:15px;margin-bottom:15px}.receipt-logo{width:92px;height:92px;object-fit:contain;border-radius:22px;margin:auto;display:block}.brand-name{font-size:25px;font-weight:900;color:#5420b8;margin-top:7px}.brand-contact{font-size:14px;color:#555;margin-top:5px;direction:rtl}.invoice-head{display:flex;justify-content:flex-end;gap:10px;align-items:center;border-bottom:1px solid #eee;padding-bottom:12px;margin-bottom:12px}.date{color:#777;font-size:12px}.info{line-height:2;color:#555}.info strong{color:#25243a}.discount{color:#08752d;font-weight:bold}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.summary div{padding:11px 8px;border-radius:15px;background:#f7f4fd;text-align:center}.summary small{display:block;color:#777;margin-bottom:5px}.summary strong{font-size:17px}.final{color:#5420b8}.receipt-footer{text-align:center;border-top:1px dashed #bbb;padding-top:14px;margin-top:15px;color:#666;font-size:13px;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1;min-width:120px;border:0;cursor:pointer;border-radius:14px;padding:13px 12px;font-size:14px;font-weight:bold}.print{background:#e8ddff;color:#5420b8}.pdf{background:#eee5ff;color:#5420b8}.image{background:#e8f6ee;color:#08752d}.delete{background:#ffe2e2;color:#a00000}.empty{text-align:center;padding:45px;color:#777}.count{text-align:center;color:#777;margin:10px 0 18px;font-weight:bold}.busy{opacity:.65;pointer-events:none}.dark-mode body{background:#0b1220;color:#f5f7ff}.dark-mode .glass{background:rgba(20,30,48,.9);border-color:#33445f;box-shadow:0 18px 45px rgba(0,0,0,.28)}.dark-mode .header h1,.dark-mode .topbar h2{color:#b98cff}.dark-mode .header p,.dark-mode .empty,.dark-mode .count{color:#aeb9c9}.dark-mode .back{background:#2c2050;color:#d2b7ff;border:1px solid #563c86}.dark-mode .toolbar input,.dark-mode .toolbar select{background:#18253a;color:#f5f7ff;border-color:#3b4d68}.dark-mode .receipt{background:#17243a;color:#f4f7ff;border-color:#3b4d68;box-shadow:0 15px 40px rgba(0,0,0,.35)}.dark-mode .receipt-brand{border-color:#52647f}.dark-mode .brand-name{color:#c19bff}.dark-mode .brand-contact,.dark-mode .date,.dark-mode .info,.dark-mode .receipt-footer{color:#b8c3d2}.dark-mode .info strong{color:#fff}.dark-mode .invoice-head{border-color:#3b4d68}.dark-mode .summary div{background:#24344d;border:1px solid #354964}.dark-mode .summary small{color:#aeb9c9}.dark-mode .final{color:#c19bff}.dark-mode .discount{color:#6fe39a}.dark-mode .receipt-footer{border-color:#52647f}.dark-mode .print{background:#3a285f;color:#d9c3ff}.dark-mode .pdf{background:#33275a;color:#d9c3ff}.dark-mode .image{background:#163d2b;color:#7be6a7}.dark-mode .delete{background:#4b2025;color:#ff9fa7}@media(max-width:650px){.toolbar{grid-template-columns:1fr}.topbar{flex-direction:column;gap:12px}.back{width:100%;justify-content:center}.summary{grid-template-columns:1fr}.actions{flex-direction:column}.actions button{width:100%}.receipt{padding:16px}.receipt-logo{width:82px;height:82px}}@media print{@page{size:80mm auto;margin:0!important}html,body{width:80mm!important;background:#fff!important}.container{width:80mm!important;padding:0!important}.header,.topbar,.toolbar,.count,.actions{display:none!important}.invoice{display:none!important;padding:0!important;margin:0!important;border:0!important;box-shadow:none!important;background:#fff!important}.invoice.printing{display:block!important;width:80mm!important}.invoice.printing .receipt{width:80mm!important;max-width:none!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;padding:4mm 3mm!important;background:#fff!important;color:#000!important}.invoice.printing .summary div{background:#f5f5f5!important}.invoice.printing .brand-name,.invoice.printing .final{color:#5420b8!important}.invoice.printing .info strong{color:#111!important}.invoice.printing .brand-contact,.invoice.printing .date,.invoice.printing .info,.invoice.printing .receipt-footer{color:#444!important}}</style></head><body><div class="container"><div class="header glass"><h1>CASH BACK 💜</h1><p>إدارة وحفظ الفواتير</p></div><div class="topbar glass"><h2>🧾 الفواتير المحفوظة</h2><a class="back" href="customers.html">← رجوع للعملاء</a></div><div class="toolbar"><input id="search" placeholder="🔎 ابحث باسم العميل أو الرقم أو رقم الفاتورة"><select id="filter"><option value="all">كل الفواتير</option><option value="discount">بها خصم</option><option value="nodiscount">بدون خصم</option></select></div><div id="count" class="count"></div><div id="list"></div></div><script>const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';const db=window.supabase.createClient(U,K);let invoices=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function money(v){return Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:0})}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('filter').value;const data=invoices.filter(x=>{const hit=!q||[x.id,x.customer_name,x.phone,x.order_number,x.discount_code].some(v=>String(v??'').toLowerCase().includes(q));const d=Number(x.discount_amount||0)>0;return hit&&(f==='all'||(f==='discount'&&d)||(f==='nodiscount'&&!d))});document.getElementById('count').textContent=`عدد الفواتير: ${data.length}`;const l=document.getElementById('list');if(!data.length){l.innerHTML='<div class="empty glass">لا توجد فواتير مطابقة 🧾</div>';return}l.innerHTML=data.map(x=>{const disc=Number(x.discount_amount||0);return `<div class="invoice glass" id="invoice-${Number(x.id)}"><div class="receipt" id="receipt-${Number(x.id)}"><div class="receipt-brand"><img class="receipt-logo" src="logo.png" alt="CASH BACK"><div class="brand-name">CASH BACK</div><div class="brand-contact">للتواصل والطلبات 📞 01090532469</div></div><div class="invoice-head"><div class="date">${esc(new Date(x.created_at).toLocaleString('ar-EG'))}</div></div><div class="info">👤 العميل: <strong>${esc(x.customer_name)}</strong><br>📱 الرقم: <strong>${esc(x.phone)}</strong><br>📦 الباقة: <strong>${esc(x.package_name)}</strong></div><div class="summary"><div><small>السعر الأصلي</small><strong>${money(x.original_price)} جنيه</strong></div><div><small>الخصم ${x.discount_code?'('+esc(x.discount_code)+')':''}</small><strong class="discount">${disc>0?'- '+money(disc):'بدون خصم'}</strong></div><div><small>المبلغ النهائي</small><strong class="final">${money(x.amount)} جنيه</strong></div></div>${x.notes?'<div class="info">📝 '+esc(x.notes)+'</div>':''}<div class="receipt-footer">شكرًا لاختيارك CASH BACK 💜<br>أفضل مكان لباقاتك — للتواصل 01090532469</div></div><div class="actions"><button class="print" onclick="printInvoice(${Number(x.id)})">🖨️ طباعة 80mm</button><button class="pdf" onclick="savePDF(${Number(x.id)})">📄 PDF</button><button class="image" onclick="saveImage(${Number(x.id)})">🖼️ صورة</button><button class="delete" onclick="deleteInvoice(${Number(x.id)})">🗑️ حذف</button></div></div>`}).join('')}function printInvoice(id){const el=document.getElementById('invoice-'+id);if(!el)return;document.querySelectorAll('.invoice.printing').forEach(x=>x.classList.remove('printing'));el.classList.add('printing');window.print();window.addEventListener('afterprint',()=>el.classList.remove('printing'),{once:true})}async function makeCanvas(id){const el=document.getElementById('receipt-'+id);if(!el)throw new Error('لم يتم العثور على الفاتورة');return await html2canvas(el,{scale:3,useCORS:true,backgroundColor:getComputedStyle(el).backgroundColor,logging:false})}function setBusy(id,on){const el=document.getElementById('invoice-'+id);if(el)el.classList.toggle('busy',on)}async function saveImage(id){setBusy(id,true);try{const canvas=await makeCanvas(id);const a=document.createElement('a');a.download='cash-back-invoice-'+id+'.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){alert('❌ تعذر إنشاء الصورة: '+e.message)}finally{setBusy(id,false)}}async function savePDF(id){setBusy(id,true);try{const canvas=await makeCanvas(id);const img=canvas.toDataURL('image/jpeg',.95);const {jsPDF}=window.jspdf;const w=80;const h=w*canvas.height/canvas.width;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[w,h]});pdf.addImage(img,'JPEG',0,0,w,h);pdf.save('cash-back-invoice-'+id+'.pdf')}catch(e){alert('❌ تعذر إنشاء PDF: '+e.message)}finally{setBusy(id,false)}}async function deleteInvoice(id){if(!confirm('هل تريد حذف الفاتورة؟'))return;const r=await db.from('invoices').delete().eq('id',id);if(r.error)alert('❌ '+r.error.message);else load()}async function load(){const l=document.getElementById('list');l.innerHTML='<div class="empty glass">⏳ جاري تحميل الفواتير...</div>';const r=await db.from('invoices').select('*').order('id',{ascending:false});if(r.error){l.innerHTML='<div class="empty glass">❌ '+esc(r.error.message)+'</div>';return}invoices=r.data||[];render()}document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);load();</script></body></html>
