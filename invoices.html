<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CASH BACK - الفواتير</title><script src="theme.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;min-height:100vh;background:radial-gradient(circle at 100% 0%,#a568f0 0%,transparent 38%),linear-gradient(135deg,#f2effb,#ded5f0,#d2c6e8);color:#19182d}.container{width:92%;max-width:1050px;margin:auto;padding:30px 0 70px}.glass{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:26px;backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(60,35,120,.13)}.header{text-align:center;padding:28px;margin-bottom:22px}.header h1{margin:0 0 8px;color:#5420b8;font-size:32px}.header p{margin:0;color:#707080}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px;margin-bottom:22px}.topbar h2{margin:0;color:#5420b8}.back{display:inline-flex;padding:12px 18px;border-radius:14px;background:#e8ddff;color:#5420b8;text-decoration:none;font-weight:bold}.invoice{padding:22px;margin-bottom:16px}.invoice-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.invoice-no{font-size:23px;font-weight:900;color:#5420b8}.info{line-height:2;color:#555}.discount{color:#08752d;font-weight:bold}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.print{background:#e8ddff;color:#5420b8}.delete{background:#ffe2e2;color:#a00000}.empty{text-align:center;padding:40px;color:#777}@media(max-width:600px){.invoice-head{flex-direction:column;align-items:stretch}.actions{flex-direction:column}.actions button{width:100%}}@media print{@page{size:80mm auto;margin:0!important}body{width:80mm!important;background:#fff!important}.container{width:80mm!important;padding:0!important}.header,.topbar,.invoice:not(.printing){display:none!important}.invoice.printing{display:block!important;width:80mm!important;margin:0!important;padding:4mm 3mm!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;color:#000!important}.invoice.printing .actions{display:none!important}}</style></head><body><div class="container"><div class="header glass"><h1>CASH BACK 💜</h1><p>الفواتير المحفوظة</p></div><div class="topbar glass"><h2>🧾 الفواتير</h2><a class="back" href="admin.html">← رجوع للإدارة</a></div><div id="list"></div></div><script>const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';const db=window.supabase.createClient(U,K);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){const l=document.getElementById('list');l.innerHTML='<div class="empty glass">⏳ جاري التحميل...</div>';const r=await db.from('invoices').select('*').order('id',{ascending:false});if(r.error){l.innerHTML='<div class="empty glass">❌ '+esc(r.error.message)+'</div>';return}if(!r.data?.length){l.innerHTML='<div class="empty glass">لا توجد فواتير محفوظة حتى الآن 🧾</div>';return}l.innerHTML=r.data.map(x=>{const disc=Number(x.discount_amount||0);return `<div class="invoice glass" id="invoice-${Number(x.id)}"><div class="invoice-head"><div class="invoice-no">🧾 فاتورة #${esc(x.id)}</div><div>${esc(new Date(x.created_at).toLocaleString('ar-EG'))}</div></div><div class="info">👤 العميل: <strong>${esc(x.customer_name)}</strong><br>📱 الرقم: <strong>${esc(x.phone)}</strong><br>📦 الباقة: <strong>${esc(x.package_name)}</strong><br>💵 السعر الأصلي: <strong>${esc(x.original_price)} جنيه</strong>${x.discount_code?`<br>🎟️ كود الخصم: <strong>${esc(x.discount_code)}</strong>`:''}${disc>0?`<br><span class="discount">⬇️ الخصم: ${esc(disc)} جنيه</span>`:''}<br>💰 <strong>المبلغ بعد الخصم: ${esc(x.amount)} جنيه</strong>${x.notes?'<br>📝 '+esc(x.notes):''}</div><div class="actions"><button class="print" onclick="printInvoice(${Number(x.id)})">🖨️ طباعة</button><button class="delete" onclick="deleteInvoice(${Number(x.id)})">🗑️ حذف</button></div></div>`}).join('')}async function printInvoice(id){const el=document.getElementById('invoice-'+id);if(!el)return;document.querySelectorAll('.invoice.printing').forEach(x=>x.classList.remove('printing'));el.classList.add('printing');window.print();window.addEventListener('afterprint',()=>el.classList.remove('printing'),{once:true})}async function deleteInvoice(id){if(!confirm('هل تريد حذف الفاتورة؟'))return;const r=await db.from('invoices').delete().eq('id',id);if(r.error)alert('❌ '+r.error.message);else load()}load();</script></body></html>
