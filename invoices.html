<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CASH BACK - الفواتير</title><script src="theme.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;min-height:100vh;background:radial-gradient(circle at 100% 0%,#a568f0 0%,transparent 38%),linear-gradient(135deg,#f2effb,#ded5f0,#d2c6e8);color:#19182d}.container{width:92%;max-width:1050px;margin:auto;padding:25px 0 70px}.glass{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:26px;backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(60,35,120,.13)}.header{text-align:center;padding:24px;margin-bottom:18px}.header h1{margin:0;color:#5420b8;font-size:32px}.header p{margin:8px 0 0;color:#707080}.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;margin-bottom:18px}.topbar h2{margin:0;color:#5420b8}.back{display:inline-flex;padding:12px 18px;border-radius:14px;background:#e8ddff;color:#5420b8;text-decoration:none;font-weight:bold}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:18px}.toolbar input,.toolbar select{width:100%;padding:14px;border:1px solid #ddd;border-radius:15px;background:#fff;font-size:16px;outline:none}.invoice{padding:22px;margin-bottom:16px;transition:.2s}.invoice:hover{transform:translateY(-2px)}.invoice-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #eee;padding-bottom:13px;margin-bottom:12px}.invoice-no{font-size:23px;font-weight:900;color:#5420b8}.date{color:#777;font-size:13px}.info{line-height:2;color:#555}.info strong{color:#25243a}.discount{color:#08752d;font-weight:bold}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.summary div{padding:12px;border-radius:15px;background:#f7f4fd;text-align:center}.summary small{display:block;color:#777;margin-bottom:5px}.summary strong{font-size:18px}.final{color:#5420b8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}button{border:0;cursor:pointer;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:bold}.print{background:#e8ddff;color:#5420b8}.delete{background:#ffe2e2;color:#a00000}.empty{text-align:center;padding:45px;color:#777}.count{text-align:center;color:#777;margin:10px 0 18px;font-weight:bold}.dark-mode body{background:#0f1020;color:#f5f5fa}.dark-mode .glass{background:rgba(25,25,42,.86);border-color:#34344e}.dark-mode .header p,.dark-mode .date,.dark-mode .empty,.dark-mode .count{color:#aaa}.dark-mode .info{color:#c5c5d0}.dark-mode .info strong{color:#fff}.dark-mode .invoice-head{border-color:#38384d}.dark-mode .summary div{background:#303049}.dark-mode .toolbar input,.dark-mode .toolbar select{background:#202035;color:#fff;border-color:#40405a}@media(max-width:650px){.toolbar{grid-template-columns:1fr}.topbar{flex-direction:column;gap:12px}.back{width:100%;justify-content:center}.summary{grid-template-columns:1fr}.invoice-head{flex-direction:column;align-items:stretch}.actions{flex-direction:column}.actions button{width:100%}}@media print{@page{size:80mm auto;margin:0!important}body{width:80mm!important;background:#fff!important}.container{width:80mm!important;padding:0!important}.header,.topbar,.toolbar,.count,.invoice:not(.printing){display:none!important}.invoice.printing{display:block!important;width:80mm!important;margin:0!important;padding:4mm 3mm!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;color:#000!important}.invoice.printing .actions{display:none!important}.invoice.printing .info,.invoice.printing .info strong{color:#000!important}.invoice.printing .summary div{background:#f5f5f5!important}}
</style></head><body><div class="container"><div class="header glass"><h1>CASH BACK 💜</h1><p>إدارة وحفظ الفواتير</p></div><div class="topbar glass"><h2>🧾 الفواتير المحفوظة</h2><a class="back" href="customers.html">← رجوع للعملاء</a></div><div class="toolbar"><input id="search" placeholder="🔎 ابحث باسم العميل أو الرقم أو رقم الفاتورة"><select id="filter"><option value="all">كل الفواتير</option><option value="discount">بها خصم</option><option value="nodiscount">بدون خصم</option></select></div><div id="count" class="count"></div><div id="list"></div></div><script>const U='https://pgvbynefhqmyzjtccttl.supabase.co',K='sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY';const db=window.supabase.createClient(U,K);let invoices=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('filter').value;const data=invoices.filter(x=>{const hit=!q||[x.id,x.customer_name,x.phone,x.order_number,x.discount_code].some(v=>String(v??'').toLowerCase().includes(q));const d=Number(x.discount_amount||0)>0;return hit&&(f==='all'||(f==='discount'&&d)||(f==='nodiscount'&&!d))});document.getElementById('count').textContent=`عدد الفواتير: ${data.length}`;const l=document.getElementById('list');if(!data.length){l.innerHTML='<div class="empty glass">لا توجد فواتير مطابقة 🧾</div>';return}l.innerHTML=data.map(x=>{const disc=Number(x.discount_amount||0);return `<div class="invoice glass" id="invoice-${Number(x.id)}"><div class="invoice-head"><div class="invoice-no">🧾 فاتورة #${esc(x.id)}</div><div class="date">${esc(new Date(x.created_at).toLocaleString('ar-EG'))}</div></div><div class="info">👤 العميل: <strong>${esc(x.customer_name)}</strong><br>📱 الرقم: <strong>${esc(x.phone)}</strong><br>📦 الباقة: <strong>${esc(x.package_name)}</strong></div><div class="summary"><div><small>السعر الأصلي</small><strong>${esc(x.original_price)} جنيه</strong></div><div><small>الخصم ${x.discount_code?'('+esc(x.discount_code)+')':''}</small><strong class="discount">${disc>0?'- '+esc(disc):'بدون خصم'} جنيه</strong></div><div><small>المبلغ النهائي</small><strong class="final">${esc(x.amount)} جنيه</strong></div></div>${x.notes?'<div class="info">📝 '+esc(x.notes)+'</div>':''}<div class="actions"><button class="print" onclick="printInvoice(${Number(x.id)})">🖨️ طباعة 80mm</button><button class="delete" onclick="deleteInvoice(${Number(x.id)})">🗑️ حذف</button></div></div>`}).join('')}function printInvoice(id){const el=document.getElementById('invoice-'+id);if(!el)return;document.querySelectorAll('.invoice.printing').forEach(x=>x.classList.remove('printing'));el.classList.add('printing');window.print();window.addEventListener('afterprint',()=>el.classList.remove('printing'),{once:true})}async function deleteInvoice(id){if(!confirm('هل تريد حذف الفاتورة؟'))return;const r=await db.from('invoices').delete().eq('id',id);if(r.error)alert('❌ '+r.error.message);else load()}async function load(){const l=document.getElementById('list');l.innerHTML='<div class="empty glass">⏳ جاري تحميل الفواتير...</div>';const r=await db.from('invoices').select('*').order('id',{ascending:false});if(r.error){l.innerHTML='<div class="empty glass">❌ '+esc(r.error.message)+'</div>';return}invoices=r.data||[];render()}document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);load();</script></body></html>
