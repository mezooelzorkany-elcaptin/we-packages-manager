<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CASH BACK - الفواتير</title>
<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;min-height:100vh;background:radial-gradient(circle at 100% 0%,#a568f0 0%,transparent 38%),linear-gradient(135deg,#f2effb,#ded5f0,#d2c6e8);color:#19182d}.container{width:92%;max-width:1050px;margin:auto;padding:30px 0 70px}.glass{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:26px;backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(60,35,120,.13)}.header{text-align:center;padding:28px;margin-bottom:22px}.header h1{margin:0 0 8px;color:#5420b8;font-size:32px}.header p{margin:0;color:#707080}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px;margin-bottom:22px}.topbar h2{margin:0;color:#5420b8}.back{display:inline-flex;padding:12px 18px;border-radius:14px;background:#e8ddff;color:#5420b8;text-decoration:none;font-weight:bold}.form{padding:25px;margin-bottom:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:15px;background:#fff;font-size:16px;margin-bottom:14px}button{border:0;cursor:pointer;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:bold}.add{width:100%;color:#fff;background:linear-gradient(135deg,#5420b8,#9747ff)}.invoice{padding:22px;margin-bottom:16px}.invoice-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.invoice-no{font-size:23px;font-weight:900;color:#5420b8}.info{line-height:2;color:#555}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.print{background:#e8ddff;color:#5420b8}.delete{background:#ffe2e2;color:#a00000}.empty{text-align:center;padding:40px;color:#777}.message{text-align:center;margin-top:12px;font-weight:bold}@media(max-width:600px){.row{grid-template-columns:1fr}.invoice-head{flex-direction:column;align-items:stretch}.actions{flex-direction:column}.actions button{width:100%}}
@media print{@page{size:80mm auto;margin:0}body{width:80mm;background:#fff}.container,.header,.topbar,.form{display:none!important}.invoice{display:none!important}}
</style>
</head>
<body><div class="container">
<div class="header glass"><h1>CASH BACK 💜</h1><p>حفظ وإدارة الفواتير</p></div>
<div class="topbar glass"><h2>🧾 الفواتير المحفوظة</h2><a class="back" href="admin.html">← رجوع للإدارة</a></div>
<div class="form glass"><h3>➕ حفظ فاتورة جديدة</h3><div class="row"><input id="customer" placeholder="اسم العميل"><input id="phone" placeholder="رقم العميل"></div><div class="row"><input id="package" placeholder="الباقة"><input id="amount" type="number" placeholder="المبلغ"></div><input id="notes" placeholder="ملاحظات"><button class="add" onclick="saveInvoice()">💾 حفظ الفاتورة</button><div id="message" class="message"></div></div>
<div id="list"></div>
</div>
<script>
const SUPABASE_URL="https://pgvbynefhqmyzjtccttl.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(){const list=document.getElementById('list');list.innerHTML='<div class="empty glass">⏳ جاري التحميل...</div>';let r=await db.from('invoices').select('*').order('id',{ascending:false});if(r.error){list.innerHTML='<div class="empty glass">❌ '+esc(r.error.message)+'</div>';return}if(!r.data?.length){list.innerHTML='<div class="empty glass">لا توجد فواتير محفوظة حتى الآن 🧾</div>';return}list.innerHTML=r.data.map(x=>`<div class="invoice glass"><div class="invoice-head"><div class="invoice-no">🧾 فاتورة #${esc(x.id)}</div><div>${esc(new Date(x.created_at||Date.now()).toLocaleString('ar-EG'))}</div></div><div class="info">👤 العميل: <strong>${esc(x.customer_name)}</strong><br>📱 الرقم: <strong>${esc(x.phone)}</strong><br>📦 الباقة: <strong>${esc(x.package_name)}</strong><br>💰 المبلغ: <strong>${esc(x.amount)} جنيه</strong>${x.notes?'<br>📝 ملاحظات: <strong>'+esc(x.notes)+'</strong>':''}</div><div class="actions"><button class="print" onclick="printInvoice(${Number(x.id)})">🖨️ طباعة</button><button class="delete" onclick="deleteInvoice(${Number(x.id)})">🗑️ حذف</button></div></div>`).join('')}
async function saveInvoice(){const customer=document.getElementById('customer').value.trim(),phone=document.getElementById('phone').value.trim(),pack=document.getElementById('package').value.trim(),amount=Number(document.getElementById('amount').value),notes=document.getElementById('notes').value.trim(),m=document.getElementById('message');if(!customer||!pack||!amount){m.style.color='#a00000';m.textContent='❌ اكتب اسم العميل والباقة والمبلغ';return}let r=await db.from('invoices').insert({customer_name:customer,phone,package_name:pack,amount,notes});if(r.error){m.style.color='#a00000';m.textContent='❌ '+r.error.message;return}m.style.color='#08752d';m.textContent='✅ تم حفظ الفاتورة';['customer','phone','package','amount','notes'].forEach(id=>document.getElementById(id).value='');load()}
async function deleteInvoice(id){if(!confirm('هل تريد حذف الفاتورة؟'))return;let r=await db.from('invoices').delete().eq('id',id);if(r.error)alert('❌ '+r.error.message);else load()}
async function printInvoice(id){let r=await db.from('invoices').select('*').eq('id',id).single();if(r.error)return alert('❌ تعذر تحميل الفاتورة');const x=r.data,w=window.open('','_blank','width=420,height=700');if(!w)return;w.document.write(`<html dir="rtl"><head><title>فاتورة #${esc(x.id)}</title><style>@page{size:80mm auto;margin:0}body{width:80mm;margin:0;padding:5mm;font-family:Arial;color:#000}.c{text-align:center}.row{border-bottom:1px dashed #999;padding:8px 0;display:flex;justify-content:space-between}.total{font-size:20px;font-weight:bold;margin-top:15px;text-align:center}</style></head><body><div class="c"><h2>CASH BACK</h2><h3>فاتورة #${esc(x.id)}</h3></div><div class="row"><span>العميل</span><strong>${esc(x.customer_name)}</strong></div><div class="row"><span>الرقم</span><strong>${esc(x.phone)}</strong></div><div class="row"><span>الباقة</span><strong>${esc(x.package_name)}</strong></div><div class="row"><span>التاريخ</span><strong>${esc(new Date(x.created_at||Date.now()).toLocaleString('ar-EG'))}</strong></div>${x.notes?`<div class="row"><span>ملاحظات</span><strong>${esc(x.notes)}</strong></div>`:''}<div class="total">الإجمالي: ${esc(x.amount)} جنيه</div><div class="c" style="margin-top:25px">شكراً لتعاملك مع CASH BACK 💜</div><script>window.onload=()=>{window.print();window.onafterprint=()=>window.close()}<\/script></body></html>`);w.document.close()}
load();
</script></body></html>
