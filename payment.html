<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>الدفع | WE Packages</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif
}

body{
margin:0;
min-height:100vh;

background:
radial-gradient(
circle at 100% 0%,
#a06cf0 0%,
transparent 38%
),

linear-gradient(
135deg,
#f1eff9,
#ded5f0,
#d1c5e8
);

color:#19182d
}

.container{
width:92%;
max-width:650px;
margin:auto;
padding:28px 0 70px
}

.card{
background:rgba(255,255,255,.84);
border:1px solid rgba(255,255,255,.95);
border-radius:30px;
padding:26px 20px 32px;

backdrop-filter:blur(20px);

box-shadow:
0 20px 55px
rgba(60,35,120,.15)
}


/* HEADER */

.logo{
text-align:center;
font-size:43px;
margin-bottom:8px
}

.title{
text-align:center;
color:#5420b8;
font-size:30px;
font-weight:900;
margin-bottom:7px
}

.subtitle{
text-align:center;
color:#777;
font-size:15px;
line-height:1.8;
margin-bottom:20px
}


/* TYPE */

.customer-type{

padding:14px;

border-radius:16px;

text-align:center;

font-size:18px;

font-weight:900;

margin-bottom:18px
}

.new{

background:#eee5ff;

color:#5420b8
}

.current{

background:#dff8e8;

color:#08752d
}


/* SUMMARY */

.summary{

border-radius:25px;

padding:22px 18px;

color:#fff;

text-align:center;

background:
linear-gradient(
135deg,
#5420b8,
#9747ff
);

box-shadow:
0 15px 35px
rgba(84,32,184,.20)
}

.summary-small{
font-size:14px;
opacity:.9
}

.summary-package{
font-size:29px;
font-weight:900;
margin-top:10px
}

.summary-price{
font-size:34px;
font-weight:900;
margin-top:5px
}

.summary-discount{
margin-top:8px;
font-size:14px;
color:#e5ffe8
}


/* INFO */

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px
}

.info-box{
background:#f7f5fb;
border-radius:15px;
padding:14px
}

.info-box small{
display:block;
color:#888;
margin-bottom:6px
}

.info-box strong{
font-size:15px;
word-break:break-word
}


/* PAYMENT */

.section-title{
text-align:center;

margin:28px 0 15px;

font-size:24px;

font-weight:900;

color:#5420b8
}

.payment-card{

display:flex;

align-items:center;

gap:13px;

padding:17px;

margin-bottom:12px;

border-radius:20px;

background:#fff;

border:2px solid #eee7f8;

cursor:pointer;

transition:.2s
}

.payment-card.selected{

border-color:#7544cf;

background:#faf7ff
}

.payment-card input{

display:none
}

.radio{

width:24px;
height:24px;

border:3px solid #bbb;

border-radius:50%;

flex:0 0 24px;

display:flex;

align-items:center;

justify-content:center
}

.payment-card.selected .radio{

border-color:#6d28d9
}

.payment-card.selected .radio span{

width:10px;
height:10px;

background:#6d28d9;

border-radius:50%
}

.payment-icon{
font-size:28px
}

.payment-name{
font-weight:bold;
font-size:17px
}


/* PROOF */

.proof{

margin-top:20px;

display:none
}

.proof label{

display:block;

font-weight:bold;

margin-bottom:9px
}

.proof input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:14px;

background:white
}

.hint{

font-size:12px;

color:#777;

margin-top:7px;

line-height:1.6
}


/* BUTTON */

.submit{

width:100%;

margin-top:22px;

padding:17px;

border:0;

border-radius:17px;

background:
linear-gradient(
135deg,
#5420b8,
#9747ff
);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer
}

.submit:disabled{

opacity:.6;

cursor:not-allowed
}


/* MESSAGE */

.message{

display:none;

margin-top:15px;

padding:14px;

border-radius:14px;

text-align:center;

font-weight:bold;

line-height:1.7
}

.error{

background:#ffe2e2;

color:#a00000
}

.success{

background:#dff8e8;

color:#08752d
}


/* ORDER */

.order-number{

margin-top:20px;

padding:14px;

background:#eee6ff;

border-radius:15px;

text-align:center;

color:#5420b8;

font-weight:bold
}


.back{

display:block;

text-align:center;

margin-top:20px;

color:#5420b8;

text-decoration:none;

font-weight:bold
}


@media(max-width:550px){

.info{

grid-template-columns:1fr

}

}

</style>

</head>

<body>


<div class="container">

<div class="card">


<div class="logo">
💳
</div>


<div class="title">
إتمام الدفع
</div>


<div class="subtitle">
راجع بيانات الطلب واختار طريقة الدفع
</div>


<!-- TYPE -->

<div
id="customerType"
class="customer-type"
>
⏳ جاري تحميل نوع العميل...
</div>


<!-- SUMMARY -->

<div class="summary">

<div class="summary-small">
بيانات الطلب
</div>

<div
id="packageName"
class="summary-package"
>
جاري التحميل...
</div>

<div
id="price"
class="summary-price"
>
--
</div>

<div
id="discount"
class="summary-discount"
></div>

</div>


<!-- INFO -->

<div class="info">


<div class="info-box">

<small>
👤 العميل
</small>

<strong
id="customerName"
>
--
</strong>

</div>


<div class="info-box">

<small>
📱 الرقم
</small>

<strong
id="customerPhone"
>
--
</strong>

</div>


<div class="info-box">

<small>
📋 رقم الطلب
</small>

<strong
id="orderNumberSmall"
>
--
</strong>

</div>


<div class="info-box">

<small>
📌 نوع الطلب
</small>

<strong
id="orderTypeSmall"
>
--
</strong>

</div>


</div>


<!-- PAYMENT -->

<div class="section-title">
💰 اختر طريقة الدفع
</div>


<label
class="payment-card"
onclick="selectPayment(this,'Vodafone Cash')"
>

<input
type="radio"
name="payment"
value="Vodafone Cash"
>

<div class="radio">
<span></span>
</div>

<div class="payment-icon">
🔴
</div>

<div class="payment-name">
Vodafone Cash
</div>

</label>


<label
class="payment-card"
onclick="selectPayment(this,'Etisalat Cash')"
>

<input
type="radio"
name="payment"
value="Etisalat Cash"
>

<div class="radio">
<span></span>
</div>

<div class="payment-icon">
🟢
</div>

<div class="payment-name">
Etisalat Cash
</div>

</label>


<label
class="payment-card"
onclick="selectPayment(this,'WE Pay')"
>

<input
type="radio"
name="payment"
value="WE Pay"
>

<div class="radio">
<span></span>
</div>

<div class="payment-icon">
💜
</div>

<div class="payment-name">
WE Pay
</div>

</label>


<label
class="payment-card"
onclick="selectPayment(this,'Orange Cash')"
>

<input
type="radio"
name="payment"
value="Orange Cash"
>

<div class="radio">
<span></span>
</div>

<div class="payment-icon">
🟠
</div>

<div class="payment-name">
Orange Cash
</div>

</label>


<label
class="payment-card"
onclick="selectPayment(this,'كاش')"
>

<input
type="radio"
name="payment"
value="كاش"
>

<div class="radio">
<span></span>
</div>

<div class="payment-icon">
💵
</div>

<div class="payment-name">
كاش
</div>

</label>


<!-- PROOF -->

<div
id="proof"
class="proof"
>

<label>
📸 صورة التحويل
</label>

<input
type="file"
id="proofFile"
accept="image/*"
>

<div class="hint">
ارفع صورة واضحة لإيصال التحويل.
</div>

</div>


<div
id="message"
class="message"
></div>


<button
id="submitButton"
class="submit"
onclick="submitPayment()"
>
✅ تأكيد الدفع وإرسال الطلب
</button>


<div
id="orderNumber"
class="order-number"
>
</div>


<a
href="index.html"
class="back"
>
← العودة للرئيسية
</a>


</div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pgvbynefhqmyzjtccttl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RMNG3j5xrijQx3HcbfEkbQ_wZkoJGrY";


/* =====================================================
   ORDER
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


const orderNumber =
params.get("order");


let order = null;

let selectedPayment = "";


/* =====================================================
   LOAD ORDER
===================================================== */

async function loadOrder(){

if(!orderNumber){

showMessage(
"❌ رقم الطلب غير موجود",
"error"
);

return;

}


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?select=*&order_number=eq."+
encodeURIComponent(
orderNumber
)+
"&limit=1",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY

}

}

);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.message||
"تعذر تحميل الطلب"
);

}


if(
!Array.isArray(data)||
!data.length
){

throw new Error(
"الطلب غير موجود"
);

}


order =
data[0];


displayOrder();


}
catch(error){

console.error(
"LOAD ORDER:",
error
);

showMessage(
"❌ "+error.message,
"error"
);

}

}


/* =====================================================
   TYPE FROM ORDER NUMBER
===================================================== */

function getOrderType(){

if(
String(order.order_number)
.startsWith("CURRENT-")
){

return "current";

}

if(
String(order.order_number)
.startsWith("NEW-")
){

return "new";

}


/*
طلبات قديمة
*/

return "new";

}


/* =====================================================
   DISPLAY
===================================================== */

function displayOrder(){

const type =
getOrderType();


const typeBox =
document.getElementById(
"customerType"
);


const typeSmall =
document.getElementById(
"orderTypeSmall"
);


if(type==="current"){

typeBox.className =
"customer-type current";

typeBox.textContent =
"👤 عميل حالي — تجديد الباقة";

typeSmall.textContent =
"👤 عميل حالي";

}
else{

typeBox.className =
"customer-type new";

typeBox.textContent =
"🆕 عميل جديد — اشتراك جديد";

typeSmall.textContent =
"🆕 عميل جديد";

}


document.getElementById(
"packageName"
).textContent =
order.package_name||"-";


document.getElementById(
"price"
).textContent =
(
Number(order.final_price)||0
)+
" جنيه";


document.getElementById(
"customerName"
).textContent =
order.subscriber_name||"-";


document.getElementById(
"customerPhone"
).textContent =
order.phone||"-";


document.getElementById(
"orderNumberSmall"
).textContent =
order.order_number||"-";


if(
Number(order.original_price)>
Number(order.final_price)
){

document.getElementById(
"discount"
).textContent =
"🎟️ تم تطبيق الخصم — السعر النهائي بعد الخصم";

}

}


/* =====================================================
   SELECT PAYMENT
===================================================== */

function selectPayment(
element,
method
){

document
.querySelectorAll(
".payment-card"
)
.forEach(
card =>
card.classList.remove(
"selected"
)
);


element.classList.add(
"selected"
);


element
.querySelector(
"input"
)
.checked =
true;


selectedPayment =
method;


/*
إظهار رفع الصورة
*/

document.getElementById(
"proof"
).style.display =
"block";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.className =
"message "+type;

box.textContent =
text;

box.style.display =
"block";

}


/* =====================================================
   SUBMIT PAYMENT
===================================================== */

async function submitPayment(){

if(!order){

showMessage(
"❌ الطلب غير محمل",
"error"
);

return;

}


if(!selectedPayment){

showMessage(
"❌ اختر طريقة الدفع أولاً",
"error"
);

return;

}


const file =
document.getElementById(
"proofFile"
).files[0];


if(
selectedPayment!=="كاش" &&
!file
){

showMessage(
"❌ ارفع صورة التحويل أولاً",
"error"
);

return;

}


const button =
document.getElementById(
"submitButton"
);


button.disabled =
true;

button.textContent =
"⏳ جاري إرسال الدفع...";


try{


/*
=====================================================
رفع صورة التحويل
=====================================================
*/

let screenshotUrl =
null;


if(file){

/*
نستخدم اسم ملف فريد
*/

const fileName =
"payments/"+
Date.now()+
"-"+
Math.random()
.toString(36)
.slice(2)+
"-"+
file.name
.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const upload =
await fetch(

SUPABASE_URL+
"/storage/v1/object/payment-proofs/"+
fileName,

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY,

"Content-Type":
file.type||
"image/jpeg"

},

body:file

}

);


if(!upload.ok){

const text =
await upload.text();

throw new Error(
"فشل رفع صورة التحويل: "+
text
);

}


screenshotUrl =
SUPABASE_URL+
"/storage/v1/object/public/payment-proofs/"+
fileName;

}


/*
=====================================================
تحديث الطلب
=====================================================
*/

const updateData = {

payment_method:
selectedPayment,

payment_screenshot:
screenshotUrl,

status:
"payment_submitted"

};


const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?order_number=eq."+
encodeURIComponent(
order.order_number
),

{

method:"PATCH",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify(
updateData
)

}

);


const text =
await response.text();


if(!response.ok){

throw new Error(
text||
"تعذر تحديث الطلب"
);

}


showMessage(
"✅ تم إرسال الدفع بنجاح.\nجاري مراجعة التحويل من الإدارة.",
"success"
);


button.textContent =
"✅ تم إرسال الطلب";


/*
إظهار رقم الطلب
*/

document.getElementById(
"orderNumber"
).textContent =
"رقم الطلب: "+
order.order_number;


}
catch(error){

console.error(
"PAYMENT ERROR:",
error
);

showMessage(
"❌ فشل إرسال الدفع:\n"+
error.message,
"error"
);

button.disabled =
false;

button.textContent =
"✅ تأكيد الدفع وإرسال الطلب";

}

}


/* =====================================================
   START
===================================================== */

loadOrder();

</script>

</body>

</html>
